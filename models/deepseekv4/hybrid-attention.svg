<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <title id="title">DeepSeek-V4 的 CSA 与 HCA 混合注意力</title>
  <desc id="desc">两种注意力都保留 128 token 滑动窗口。CSA 将远程 KV 四比一压缩，再用 Lightning Indexer 选择 Top-k；HCA 将远程 KV 一百二十八比一压缩后全部读取。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1280" height="840" fill="#f8fafc"/>
  <text x="640" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Hybrid Attention：近处看原文，远处看压缩记忆</text>
  <text x="640" y="78" text-anchor="middle" font-size="15" fill="#64748b">CSA 与 HCA 交错堆叠；两者共享 Query、窗口、MQA 与输出投影框架</text>

  <rect x="54" y="112" width="1172" height="116" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="82" y="143" font-size="16" font-weight="700" fill="#334155">层类型由 compress_ratios 决定</text>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="82" y="164" width="112" height="36" rx="8" fill="#e2e8f0"/><text x="138" y="187" fill="#334155">0 · Window</text>
    <rect x="204" y="164" width="112" height="36" rx="8" fill="#dbeafe"/><text x="260" y="187" fill="#1d4ed8">4 · CSA</text>
    <rect x="326" y="164" width="112" height="36" rx="8" fill="#ede9fe"/><text x="382" y="187" fill="#6d28d9">128 · HCA</text>
  </g>
  <text x="484" y="176" font-size="14" font-weight="700" fill="#334155">Flash 主干：</text>
  <text x="574" y="176" font-size="14" fill="#475569">Window, Window, CSA, HCA, CSA, HCA, …, CSA</text>
  <text x="484" y="202" font-size="14" font-weight="700" fill="#334155">Pro 主干：</text>
  <text x="574" y="202" font-size="14" fill="#475569">HCA, HCA, CSA, HCA, CSA, HCA, …, CSA</text>

  <rect x="54" y="258" width="566" height="500" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="660" y="258" width="566" height="500" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="337" y="296" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">CSA · 精细但稀疏</text>
  <text x="943" y="296" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">HCA · 粗粒度但全局</text>

  <g>
    <rect x="86" y="326" width="208" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="692" y="326" width="208" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="190" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">远程历史 n tokens</text>
    <text x="190" y="370" text-anchor="middle" font-size="12" fill="#64748b">Hidden States</text>
    <text x="796" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">远程历史 n tokens</text>
    <text x="796" y="370" text-anchor="middle" font-size="12" fill="#64748b">Hidden States</text>

    <rect x="354" y="326" width="220" height="54" rx="10" fill="#ecfeff" stroke="#0891b2"/>
    <rect x="960" y="326" width="220" height="54" rx="10" fill="#ecfeff" stroke="#0891b2"/>
    <text x="464" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">最近 128 tokens</text>
    <text x="464" y="370" text-anchor="middle" font-size="12" fill="#0e7490">不压缩滑动窗口</text>
    <text x="1070" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">最近 128 tokens</text>
    <text x="1070" y="370" text-anchor="middle" font-size="12" fill="#0e7490">不压缩滑动窗口</text>
  </g>

  <rect x="104" y="420" width="172" height="64" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="447" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Compressor</text>
  <text x="190" y="470" text-anchor="middle" font-size="13" fill="#334155">4:1 · overlap</text>
  <path d="M190 380V406" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="710" y="420" width="172" height="64" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="796" y="447" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">Compressor</text>
  <text x="796" y="470" text-anchor="middle" font-size="13" fill="#334155">128:1 · non-overlap</text>
  <path d="M796 380V406" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="86" y="524" width="208" height="72" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="190" y="550" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">约 n/4 个压缩条目</text>
  <text x="190" y="574" text-anchor="middle" font-size="13" fill="#475569">主 KV + 独立 Index KV</text>
  <path d="M190 484V510" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="692" y="524" width="208" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="796" y="550" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">约 n/128 个压缩条目</text>
  <text x="796" y="574" text-anchor="middle" font-size="13" fill="#475569">全部保留，无 Indexer</text>
  <path d="M796 484V510" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="86" y="636" width="208" height="72" rx="12" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="661" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Lightning Indexer</text>
  <text x="190" y="684" text-anchor="middle" font-size="13" fill="#334155">FP4 打分 → Top-k</text>
  <path d="M190 596V622" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="336" y="524" width="238" height="184" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="455" y="555" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">Shared-KV MQA</text>
  <text x="455" y="584" text-anchor="middle" font-size="14" fill="#334155">Top-k 压缩条目</text>
  <text x="455" y="608" text-anchor="middle" font-size="22" fill="#0f766e">+</text>
  <text x="455" y="635" text-anchor="middle" font-size="14" fill="#334155">128 window entries</text>
  <path d="M294 672H322" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M464 380V510" stroke="#0891b2" stroke-width="2"/>
  <path d="M464 510L464 512" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="455" y="677" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">核心读取：640 / 1,152</text>

  <rect x="942" y="524" width="238" height="184" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1061" y="555" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">Shared-KV MQA</text>
  <text x="1061" y="584" text-anchor="middle" font-size="14" fill="#334155">全部 n/128 压缩条目</text>
  <text x="1061" y="608" text-anchor="middle" font-size="22" fill="#0f766e">+</text>
  <text x="1061" y="635" text-anchor="middle" font-size="14" fill="#334155">128 window entries</text>
  <path d="M900 560H928" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M1070 380V510" stroke="#0891b2" stroke-width="2"/>
  <path d="M1070 510L1070 512" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="1061" y="677" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">1M 时读取：8,320</text>

  <path d="M455 708V716" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="371" y="722" width="168" height="28" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="455" y="741" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Attention output</text>
  <path d="M1061 708V716" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="977" y="722" width="168" height="28" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="1061" y="741" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Attention output</text>

  <rect x="54" y="784" width="1172" height="38" rx="10" fill="#e2e8f0"/>
  <text x="640" y="809" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">共同细节：Q-LoRA · Q/KV RMSNorm · Partial RoPE(64/512) · Attention Sink · Grouped Output Projection</text>
</svg>
