<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <title id="title">DeepSeek-V3 到 DeepSeek-V4 架构迁移地图</title>
  <desc id="desc">对比 V3 的 MLA、普通残差、前三层 Dense FFN 与 V4 的 CSA/HCA、四路 mHC 和前三层 Hash MoE；DeepSeekMoE 与 MTP 延续。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">DeepSeek-V3 → DeepSeek-V4：迁移地图</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#64748b">绿色 = 直接继承　蓝色 = 结构升级　橙色 = 路由调整</text>

  <rect x="48" y="112" width="476" height="550" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="676" y="112" width="476" height="550" rx="18" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="286" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">DeepSeek-V3</text>
  <text x="914" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">DeepSeek-V4</text>

  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <rect x="132" y="184" width="308" height="56" rx="10"/>
    <rect x="132" y="272" width="308" height="72" rx="10"/>
    <rect x="132" y="376" width="308" height="72" rx="10"/>
    <rect x="132" y="480" width="308" height="64" rx="10"/>
    <rect x="132" y="576" width="308" height="48" rx="10"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="286" y="218" font-size="17" font-weight="600">Embedding · 129,280 vocab</text>
    <text x="286" y="302" font-size="19" font-weight="700">MLA</text>
    <text x="286" y="326" font-size="14" fill="#475569">逐 token 缓存低秩 KV latent</text>
    <text x="286" y="405" font-size="18" font-weight="700">普通 Residual Add</text>
    <text x="286" y="430" font-size="14" fill="#475569">一条残差流：x + F(x)</text>
    <text x="286" y="507" font-size="18" font-weight="700">Dense × 3 → DeepSeekMoE</text>
    <text x="286" y="531" font-size="14" fill="#475569">Sigmoid · Top-8 routed</text>
    <text x="286" y="607" font-size="17" font-weight="700">MTP × 1 · LM Head</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M286 240V268"/>
    <path d="M286 344V372"/>
    <path d="M286 448V476"/>
    <path d="M286 544V572"/>
  </g>

  <g stroke-width="1.5">
    <rect x="760" y="184" width="308" height="56" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
    <rect x="760" y="272" width="308" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="760" y="396" width="308" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="760" y="504" width="308" height="64" rx="10" fill="#fff7ed" stroke="#f97316"/>
    <rect x="760" y="600" width="308" height="48" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="914" y="218" font-size="17" font-weight="600">Embedding · 129,280 vocab</text>
    <text x="914" y="302" font-size="19" font-weight="700">CSA ↔ HCA 混合注意力</text>
    <text x="914" y="327" font-size="14" fill="#475569">128-token 原文窗口 + 压缩远程 KV</text>
    <text x="914" y="348" font-size="14" fill="#475569">4:1 + Top-k / 128:1 + Dense</text>
    <text x="914" y="425" font-size="18" font-weight="700">mHC · 4 路 Residual</text>
    <text x="914" y="450" font-size="14" fill="#475569">受约束的动态读、混合、写回</text>
    <text x="914" y="531" font-size="18" font-weight="700">Hash-MoE × 3 → Learned MoE</text>
    <text x="914" y="555" font-size="14" fill="#475569">SqrtSoftplus · Top-6 routed</text>
    <text x="914" y="631" font-size="17" font-weight="700">MTP × 1 · LM Head</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)">
    <path d="M914 240V268"/>
    <path d="M914 364V392"/>
    <path d="M914 472V500"/>
    <path d="M914 568V596"/>
  </g>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="548" y="196" width="104" height="30" rx="15" fill="#dcfce7"/>
    <text x="600" y="216" fill="#166534">直接继承</text>
    <rect x="548" y="305" width="104" height="30" rx="15" fill="#dbeafe"/>
    <text x="600" y="325" fill="#1d4ed8">替换核心</text>
    <rect x="548" y="407" width="104" height="30" rx="15" fill="#dbeafe"/>
    <text x="600" y="427" fill="#1d4ed8">扩大通路</text>
    <rect x="548" y="516" width="104" height="30" rx="15" fill="#ffedd5"/>
    <text x="600" y="536" fill="#c2410c">调整路由</text>
    <rect x="548" y="609" width="104" height="30" rx="15" fill="#dcfce7"/>
    <text x="600" y="629" fill="#166534">配置不变</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5">
    <path d="M440 211H548"/>
    <path d="M652 211H760"/>
    <path d="M440 320H548"/>
    <path d="M652 320H760"/>
    <path d="M440 422H548"/>
    <path d="M652 422H760"/>
    <path d="M440 531H548"/>
    <path d="M652 531H760"/>
    <path d="M440 624H548"/>
    <path d="M652 624H760"/>
  </g>
</svg>
