<svg viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Segoe UI,Roboto,sans-serif" role="img" aria-label="IndexPool 选中一个池后将池内四个 token 全部送入 Sparse MLA">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#f97316"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#3b82f6"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="38" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">IndexPool：选中一个池，池内 4 个 token 全部进入 Sparse MLA</text>
  <text x="700" y="65" font-size="13" fill="#64748b" text-anchor="middle">示例：index_kpool = 4，池 10 对应 token 40～43</text>
  <rect x="48" y="84" width="12" height="12" rx="2" fill="#ffedd5" stroke="#f97316"/>
  <text x="67" y="95" font-size="12" fill="#7c2d12">索引器路径：只负责低成本粗筛</text>
  <rect x="284" y="84" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="303" y="95" font-size="12" fill="#1e3a8a">主 MLA 路径：保留每个 token 的独立 KV</text>

  <!-- ① token 级输入 -->
  <rect x="40" y="118" width="300" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="190" y="150" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">① 四个原始 token</text>
  <text x="190" y="172" font-size="12" fill="#64748b" text-anchor="middle">每个 token 同时拥有索引 Key 和主 MLA KV</text>
  <g>
    <rect x="66" y="194" width="248" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="206" width="62" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="109" y="226" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">token 40</text>
    <rect x="151" y="206" width="64" height="30" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="183" y="226" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₀</text>
    <rect x="226" y="206" width="76" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="264" y="226" font-size="13" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₀</text>
    <rect x="66" y="258" width="248" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="270" width="62" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="109" y="290" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">token 41</text>
    <rect x="151" y="270" width="64" height="30" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="183" y="290" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₁</text>
    <rect x="226" y="270" width="76" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="264" y="290" font-size="13" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₁</text>
    <rect x="66" y="322" width="248" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="334" width="62" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="109" y="354" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">token 42</text>
    <rect x="151" y="334" width="64" height="30" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="183" y="354" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₂</text>
    <rect x="226" y="334" width="76" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="264" y="354" font-size="13" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₂</text>
    <rect x="66" y="386" width="248" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="398" width="62" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="109" y="418" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">token 43</text>
    <rect x="151" y="398" width="64" height="30" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="183" y="418" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₃</text>
    <rect x="226" y="398" width="76" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="264" y="418" font-size="13" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₃</text>
  </g>
  <text x="190" y="462" font-size="12" fill="#64748b" text-anchor="middle">橙色和蓝色是两条不同的数据路径</text>

  <!-- ② 仅池化索引 Key -->
  <path d="M340 300 H382" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="118" width="260" height="360" rx="16" fill="#fffaf5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="520" y="150" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">② 只池化索引 Key</text>
  <text x="520" y="172" font-size="12" fill="#9a3412" text-anchor="middle">4 个 kᴵ → 1 个池化代表</text>
  <rect x="426" y="205" width="58" height="32" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="455" y="226" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₀</text>
  <rect x="426" y="249" width="58" height="32" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="455" y="270" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₁</text>
  <rect x="426" y="293" width="58" height="32" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="455" y="314" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₂</text>
  <rect x="426" y="337" width="58" height="32" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="455" y="358" font-size="13" fill="#9a3412" text-anchor="middle">kᴵ₄₃</text>
  <path d="M486 221 C518 221 510 274 544 287" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M486 265 C518 265 518 280 544 291" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M486 309 C518 309 518 302 544 297" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M486 353 C518 353 510 314 544 301" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="548" y="262" width="72" height="66" rx="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="584" y="288" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">池 10</text><text x="584" y="313" font-size="16" fill="#9a3412" text-anchor="middle">k̄ᴵ₁₀</text>
  <text x="520" y="393" font-size="12" fill="#9a3412" text-anchor="middle">weighted pooling</text>
  <rect x="420" y="416" width="200" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="520" y="433" font-size="11.5" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₀、cᴷⱽ₄₁、cᴷⱽ₄₂、cᴷⱽ₄₃</text><text x="520" y="449" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">不池化，继续独立保存</text>

  <!-- ③ 池级选择 -->
  <path d="M650 300 H692" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="118" width="240" height="360" rx="16" fill="#fffaf5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="820" y="150" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">③ Indexer 选择池</text>
  <text x="820" y="172" font-size="12" fill="#64748b" text-anchor="middle">Query 只扫描池化 Key</text>
  <rect x="735" y="216" width="70" height="46" rx="9" fill="#fce7f3" stroke="#ec4899"/><text x="770" y="245" font-size="15" fill="#9d174d" text-anchor="middle">qᴵₜ</text>
  <text x="820" y="244" font-size="20" fill="#94a3b8" text-anchor="middle">·</text>
  <rect x="835" y="216" width="70" height="46" rx="9" fill="#ffedd5" stroke="#f97316"/><text x="870" y="245" font-size="15" fill="#9a3412" text-anchor="middle">k̄ᴵ₁₀</text>
  <path d="M820 270 V306" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="750" y="316" width="140" height="72" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="820" y="342" font-size="13" fill="#9a3412" text-anchor="middle">池 10 分数 = 0.91</text><text x="820" y="370" font-size="18" font-weight="700" fill="#c2410c" text-anchor="middle">Top-k 选中 ✓</text>
  <text x="820" y="421" font-size="12" fill="#64748b" text-anchor="middle">这里选中的是“池编号 10”</text><text x="820" y="442" font-size="12" fill="#64748b" text-anchor="middle">还没有计算主注意力</text>

  <!-- ④ 展开后 token 级主注意力 -->
  <path d="M940 300 H982" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="990" y="118" width="370" height="360" rx="16" fill="#f5f9ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1175" y="150" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">④ 展开为四个 token 再精算</text>
  <text x="1175" y="172" font-size="12" fill="#1d4ed8" text-anchor="middle">选中池 10 ⇒ 位置 [40, 41, 42, 43]</text>
  <rect x="1022" y="202" width="306" height="48" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="1175" y="222" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">从主 MLA KV Cache 分别 gather</text><text x="1175" y="241" font-size="12" fill="#1d4ed8" text-anchor="middle">cᴷⱽ₄₀　cᴷⱽ₄₁　cᴷⱽ₄₂　cᴷⱽ₄₃</text>
  <path d="M1175 252 V280" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g>
    <rect x="1022" y="291" width="68" height="80" rx="9" fill="#ffffff" stroke="#3b82f6"/><text x="1056" y="314" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">token 40</text><text x="1056" y="338" font-size="12" fill="#64748b" text-anchor="middle">q·k₄₀</text><text x="1056" y="359" font-size="12" fill="#1d4ed8" text-anchor="middle">α₄₀=0.05</text>
    <rect x="1101" y="291" width="68" height="80" rx="9" fill="#ffffff" stroke="#3b82f6"/><text x="1135" y="314" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">token 41</text><text x="1135" y="338" font-size="12" fill="#64748b" text-anchor="middle">q·k₄₁</text><text x="1135" y="359" font-size="12" fill="#1d4ed8" text-anchor="middle">α₄₁=0.60</text>
    <rect x="1180" y="291" width="68" height="80" rx="9" fill="#ffffff" stroke="#3b82f6"/><text x="1214" y="314" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">token 42</text><text x="1214" y="338" font-size="12" fill="#64748b" text-anchor="middle">q·k₄₂</text><text x="1214" y="359" font-size="12" fill="#1d4ed8" text-anchor="middle">α₄₂=0.25</text>
    <rect x="1259" y="291" width="68" height="80" rx="9" fill="#ffffff" stroke="#3b82f6"/><text x="1293" y="314" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">token 43</text><text x="1293" y="338" font-size="12" fill="#64748b" text-anchor="middle">q·k₄₃</text><text x="1293" y="359" font-size="12" fill="#1d4ed8" text-anchor="middle">α₄₃=0.10</text>
  </g>
  <text x="1175" y="405" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">四个 token 都参与，但主注意力权重可以不同</text>
  <text x="1175" y="432" font-size="12" fill="#64748b" text-anchor="middle">池化代表 k̄ᴵ₁₀ 不进入这一步</text>

  <!-- tail 与结论 -->
  <rect x="40" y="505" width="1320" height="112" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="535" font-size="15" font-weight="700" fill="#334155">未满池的 tail：</text>
  <rect x="205" y="516" width="72" height="34" rx="7" fill="#ecfdf5" stroke="#10b981"/><text x="241" y="538" font-size="13" fill="#047857" text-anchor="middle">token 44</text>
  <rect x="287" y="516" width="72" height="34" rx="7" fill="#ecfdf5" stroke="#10b981"/><text x="323" y="538" font-size="13" fill="#047857" text-anchor="middle">token 45</text>
  <text x="375" y="538" font-size="13" fill="#64748b">不足 4 个，不等待成池，直接加入候选位置</text>
  <rect x="66" y="565" width="1268" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="700" y="587" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">结论：池化只压缩“海选”所用的索引 Key；选中一个完整池，就把池内全部 4 个 token 的原始 MLA KV 送去“精算”。</text>
</svg>
