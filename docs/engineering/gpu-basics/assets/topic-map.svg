<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">计算、拷贝与通信共享 GPU 资源的专题总览</title>
  <desc id="desc">计算从 HBM 读取数据并在 SM 和 Tensor Core 执行；拷贝通过 copy engine 或 SM 在内存间搬运；通信还要经过 NVLink、PCIe 或网卡。三者会共享 HBM、SM 和互联。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3b82f6"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8b5cf6"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1100" height="610" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="40" y="42" fill="#0f172a" font-size="24" font-weight="750">从数据路径理解 GPU 性能</text>
    <text x="40" y="68" fill="#64748b" font-size="14">先问数据在哪里、经过哪里、占用什么，再谈优化</text>

    <g filter="url(#shadow)">
      <rect x="40" y="100" width="320" height="350" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="390" y="100" width="320" height="350" rx="18" fill="#fffbeb" stroke="#fcd34d"/>
      <rect x="740" y="100" width="320" height="350" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
    </g>

    <circle cx="92" cy="146" r="24" fill="#3b82f6"/><text x="92" y="153" fill="#fff" font-size="21" text-anchor="middle">算</text>
    <text x="130" y="151" fill="#1e3a8a" font-size="20" font-weight="750">计算 Compute</text>
    <rect x="74" y="194" width="110" height="62" rx="10" fill="#fff" stroke="#93c5fd"/><text x="129" y="219" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">HBM</text><text x="129" y="240" fill="#64748b" font-size="12" text-anchor="middle">参数 / 激活</text>
    <rect x="216" y="194" width="110" height="62" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="271" y="219" fill="#1e3a8a" font-size="14" font-weight="700" text-anchor="middle">SM</text><text x="271" y="240" fill="#475569" font-size="12" text-anchor="middle">Tensor Core</text>
    <path d="M184 225H211" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M271 257V291H129V261" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="200" y="324" fill="#1e3a8a" font-size="16" font-weight="700" text-anchor="middle">主要消耗</text>
    <text x="200" y="352" fill="#334155" font-size="14" text-anchor="middle">计算吞吐 · HBM 带宽 · launch</text>
    <text x="200" y="395" fill="#64748b" font-size="13" text-anchor="middle">GEMM 常看 Tensor Core</text>
    <text x="200" y="418" fill="#64748b" font-size="13" text-anchor="middle">逐元素算子常看 HBM</text>

    <circle cx="442" cy="146" r="24" fill="#f59e0b"/><text x="442" y="153" fill="#fff" font-size="21" text-anchor="middle">搬</text>
    <text x="480" y="151" fill="#92400e" font-size="20" font-weight="750">拷贝 Copy</text>
    <rect x="424" y="194" width="110" height="62" rx="10" fill="#fff" stroke="#fcd34d"/><text x="479" y="219" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">源 HBM</text><text x="479" y="240" fill="#64748b" font-size="12" text-anchor="middle">读取</text>
    <rect x="566" y="194" width="110" height="62" rx="10" fill="#fef3c7" stroke="#fbbf24"/><text x="621" y="219" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">目标 HBM</text><text x="621" y="240" fill="#64748b" font-size="12" text-anchor="middle">写入</text>
    <path d="M534 225H561" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <rect x="484" y="280" width="132" height="42" rx="21" fill="#fff" stroke="#f59e0b"/><text x="550" y="306" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">copy engine / SM</text>
    <text x="550" y="352" fill="#92400e" font-size="16" font-weight="700" text-anchor="middle">主要消耗</text>
    <text x="550" y="380" fill="#334155" font-size="14" text-anchor="middle">源读 + 目标写 + 路径带宽</text>
    <text x="550" y="418" fill="#64748b" font-size="13" text-anchor="middle">100 MB D2D ≈ 200 MB HBM 流量</text>

    <circle cx="792" cy="146" r="24" fill="#8b5cf6"/><text x="792" y="153" fill="#fff" font-size="21" text-anchor="middle">通</text>
    <text x="830" y="151" fill="#6d28d9" font-size="20" font-weight="750">通信 Communicate</text>
    <rect x="768" y="194" width="90" height="62" rx="10" fill="#fff" stroke="#c4b5fd"/><text x="813" y="219" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">GPU 0</text><text x="813" y="240" fill="#64748b" font-size="12" text-anchor="middle">HBM</text>
    <rect x="942" y="194" width="90" height="62" rx="10" fill="#fff" stroke="#c4b5fd"/><text x="987" y="219" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">GPU 1</text><text x="987" y="240" fill="#64748b" font-size="12" text-anchor="middle">HBM</text>
    <path d="M858 225H937" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="900" y="214" fill="#6d28d9" font-size="11" font-weight="700" text-anchor="middle">NVLink / NIC</text>
    <rect x="832" y="280" width="136" height="42" rx="21" fill="#fff" stroke="#8b5cf6"/><text x="900" y="306" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">NCCL kernel / CE</text>
    <text x="900" y="352" fill="#6d28d9" font-size="16" font-weight="700" text-anchor="middle">主要消耗</text>
    <text x="900" y="380" fill="#334155" font-size="14" text-anchor="middle">HBM · SM/CE · 互联 · buffer</text>
    <text x="900" y="418" fill="#64748b" font-size="13" text-anchor="middle">归约还要完成求和</text>

    <rect x="40" y="482" width="1020" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="64" y="515" fill="#0f172a" font-size="16" font-weight="750">共享资源意味着：</text>
    <g font-size="14" font-weight="650" text-anchor="middle">
      <rect x="235" y="500" width="140" height="38" rx="19" fill="#dbeafe"/><text x="305" y="525" fill="#1e3a8a">SM 会竞争</text>
      <rect x="398" y="500" width="140" height="38" rx="19" fill="#dcfce7"/><text x="468" y="525" fill="#166534">HBM 会竞争</text>
      <rect x="561" y="500" width="140" height="38" rx="19" fill="#fef3c7"/><text x="631" y="525" fill="#92400e">链路会竞争</text>
      <rect x="724" y="500" width="210" height="38" rx="19" fill="#f3e8ff"/><text x="829" y="525" fill="#6b21a8">不同 stream 也会竞争</text>
    </g>
    <text x="550" y="555" fill="#64748b" font-size="13" text-anchor="middle">性能优化不是让所有工作同时开始，而是让关键路径更短</text>
  </g>
</svg>
