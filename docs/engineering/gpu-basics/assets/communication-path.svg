<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">一次集合通信从框架到目标 GPU 的数据路径</title>
  <desc id="desc">Host 上的 PyTorch 调用把 NCCL collective 排入 CUDA stream。源 GPU 从 HBM 读取输入，由 NCCL kernel 或 copy engine 处理，经 NVLink 或 PCIe 和网卡传输，目标 GPU 写入 HBM。Reduce 类操作还需要归约求和。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b5cf6"/></marker><marker id="down" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1160" height="600" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="24" font-weight="750">一次 collective：从 API 到链路</text>
    <text x="38" y="68" fill="#64748b" font-size="14">逻辑上是一行调用，物理上是一条完整的数据路径</text>

    <rect x="38" y="95" width="1084" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="62" y="113" width="246" height="38" rx="19" fill="#e2e8f0"/><text x="185" y="138" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">PyTorch dist.all_reduce(...)</text>
    <path d="M308 132H376" stroke="#64748b" stroke-width="3" marker-end="url(#down)"/>
    <rect x="382" y="113" width="226" height="38" rx="19" fill="#ede9fe"/><text x="495" y="138" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">NCCL communicator</text>
    <path d="M608 132H676" stroke="#64748b" stroke-width="3" marker-end="url(#down)"/>
    <rect x="682" y="113" width="218" height="38" rx="19" fill="#dbeafe"/><text x="791" y="138" fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">enqueue 到 CUDA stream</text>
    <text x="1088" y="136" fill="#64748b" font-size="12" text-anchor="end">Host 通常先返回</text>

    <rect x="38" y="208" width="352" height="245" rx="20" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="214" y="241" fill="#1e3a8a" font-size="18" font-weight="750" text-anchor="middle">源 GPU</text>
    <rect x="69" y="271" width="132" height="72" rx="12" fill="#f0fdf4" stroke="#22c55e"/><text x="135" y="299" fill="#166534" font-size="15" font-weight="750" text-anchor="middle">HBM 输入</text><text x="135" y="323" fill="#64748b" font-size="11" text-anchor="middle">读取 Tensor / buffer</text>
    <rect x="227" y="271" width="132" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa"/><text x="293" y="299" fill="#6d28d9" font-size="14" font-weight="750" text-anchor="middle">NCCL Kernel</text><text x="293" y="323" fill="#64748b" font-size="11" text-anchor="middle">或 Copy Engine</text>
    <path d="M201 307H222" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="111" y="371" width="206" height="48" rx="12" fill="#fff" stroke="#93c5fd"/><text x="214" y="392" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">切分 · 地址处理 · 可选归约</text><text x="214" y="409" fill="#64748b" font-size="10" text-anchor="middle">可能占用 SM、HBM 与临时 buffer</text>

    <rect x="438" y="249" width="284" height="163" rx="20" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="580" y="282" fill="#6d28d9" font-size="18" font-weight="750" text-anchor="middle">物理传输路径</text>
    <rect x="467" y="310" width="94" height="56" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="514" y="335" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">NVLink</text><text x="514" y="353" fill="#64748b" font-size="10" text-anchor="middle">节点内</text>
    <text x="580" y="343" fill="#94a3b8" font-size="15" text-anchor="middle">或</text>
    <rect x="599" y="301" width="94" height="74" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="646" y="324" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle">PCIe → NIC</text><text x="646" y="344" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle">IB / RoCE</text><text x="646" y="362" fill="#64748b" font-size="10" text-anchor="middle">跨节点</text>
    <path d="M390 331H433" stroke="#8b5cf6" stroke-width="5" marker-end="url(#arrow)"/><path d="M722 331H765" stroke="#8b5cf6" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="770" y="208" width="352" height="245" rx="20" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="946" y="241" fill="#166534" font-size="18" font-weight="750" text-anchor="middle">目标 GPU</text>
    <rect x="801" y="271" width="132" height="72" rx="12" fill="#f5f3ff" stroke="#a78bfa"/><text x="867" y="299" fill="#6d28d9" font-size="14" font-weight="750" text-anchor="middle">NCCL Kernel</text><text x="867" y="323" fill="#64748b" font-size="11" text-anchor="middle">或 Copy Engine</text>
    <rect x="959" y="271" width="132" height="72" rx="12" fill="#fff" stroke="#22c55e"/><text x="1025" y="299" fill="#166534" font-size="15" font-weight="750" text-anchor="middle">HBM 输出</text><text x="1025" y="323" fill="#64748b" font-size="11" text-anchor="middle">写入结果</text>
    <path d="M933 307H954" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="843" y="371" width="206" height="48" rx="12" fill="#fff" stroke="#86efac"/><text x="946" y="392" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">等待完成后才可安全消费</text><text x="946" y="409" fill="#64748b" font-size="10" text-anchor="middle">同流顺序或显式 event / wait</text>

    <rect x="38" y="492" width="1084" height="70" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <text x="62" y="522" fill="#92400e" font-size="15" font-weight="750">一次通信同时可能占用：</text>
    <text x="292" y="522" fill="#334155" font-size="14">HBM 读写</text><text x="400" y="522" fill="#94a3b8">+</text><text x="435" y="522" fill="#334155" font-size="14">SM / CE</text><text x="535" y="522" fill="#94a3b8">+</text><text x="570" y="522" fill="#334155" font-size="14">NVLink / PCIe / NIC</text><text x="762" y="522" fill="#94a3b8">+</text><text x="798" y="522" fill="#334155" font-size="14">通信 buffer</text><text x="920" y="522" fill="#94a3b8">+</text><text x="955" y="522" fill="#334155" font-size="14">同步等待</text>
    <text x="580" y="548" fill="#64748b" font-size="12" text-anchor="middle">All-Reduce / Reduce-Scatter 还包含求和；collective 也可能被拆成多轮传输</text>
  </g>
</svg>
