<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">GPU 内、CPU 到 GPU、GPU 到 GPU 的三条拷贝路径</title>
  <desc id="desc">GPU 内 D2D 拷贝读取并写入同一 GPU 的 HBM；H2D 和 D2H 经过 Host DRAM 与 PCIe；GPU P2P 拷贝经过两端 HBM 和 NVLink 或 PCIe。</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3b82f6"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker>
    <marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="24" font-weight="750">一次 copy，先看源和目标</text>
    <text x="38" y="68" fill="#64748b" font-size="14">同样是 100 MB，经过 HBM、PCIe 或 NVLink 的成本完全不同</text>

    <rect x="38" y="112" width="210" height="300" rx="20" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="143" y="146" fill="#0f172a" font-size="18" font-weight="750" text-anchor="middle">CPU / Host</text>
    <rect x="68" y="181" width="150" height="82" rx="13" fill="#e2e8f0" stroke="#94a3b8"/><text x="143" y="214" fill="#334155" font-size="16" font-weight="750" text-anchor="middle">Host DRAM</text><text x="143" y="240" fill="#64748b" font-size="12" text-anchor="middle">系统内存</text>
    <rect x="68" y="296" width="150" height="64" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="143" y="322" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Pinned Memory</text><text x="143" y="343" fill="#64748b" font-size="11" text-anchor="middle">更适合 DMA</text>

    <rect x="315" y="92" width="340" height="340" rx="22" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="485" y="128" fill="#1e3a8a" font-size="19" font-weight="750" text-anchor="middle">GPU 0</text>
    <rect x="349" y="166" width="272" height="114" rx="15" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="485" y="197" fill="#166534" font-size="17" font-weight="750" text-anchor="middle">HBM</text>
    <rect x="371" y="218" width="92" height="40" rx="8" fill="#fff" stroke="#4ade80"/><text x="417" y="243" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">源区域</text>
    <rect x="507" y="218" width="92" height="40" rx="8" fill="#fff" stroke="#4ade80"/><text x="553" y="243" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">目标区域</text>
    <path d="M463 238H502" stroke="#f59e0b" stroke-width="4" marker-end="url(#orange)"/>
    <rect x="392" y="316" width="186" height="62" rx="14" fill="#fffbeb" stroke="#fbbf24"/><text x="485" y="340" fill="#92400e" font-size="14" font-weight="750" text-anchor="middle">Copy Engine / SM</text><text x="485" y="361" fill="#64748b" font-size="12" text-anchor="middle">执行本地或跨设备搬运</text>

    <rect x="722" y="92" width="340" height="340" rx="22" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="892" y="128" fill="#6d28d9" font-size="19" font-weight="750" text-anchor="middle">GPU 1</text>
    <rect x="756" y="166" width="272" height="114" rx="15" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="892" y="197" fill="#166534" font-size="17" font-weight="750" text-anchor="middle">HBM</text>
    <rect x="831" y="218" width="122" height="40" rx="8" fill="#fff" stroke="#4ade80"/><text x="892" y="243" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">Peer 目标区域</text>
    <rect x="799" y="316" width="186" height="62" rx="14" fill="#f3e8ff" stroke="#a78bfa"/><text x="892" y="340" fill="#6d28d9" font-size="14" font-weight="750" text-anchor="middle">Copy Engine / SM</text><text x="892" y="361" fill="#64748b" font-size="12" text-anchor="middle">接收并写入 HBM</text>

    <path d="M248 204C278 204 281 204 310 204" fill="none" stroke="#3b82f6" stroke-width="5" marker-end="url(#blue)"/>
    <path d="M310 260C281 260 278 260 248 260" fill="none" stroke="#3b82f6" stroke-width="5" marker-end="url(#blue)"/>
    <text x="279" y="184" fill="#1e3a8a" font-size="12" font-weight="750" text-anchor="middle">H2D</text><text x="279" y="286" fill="#1e3a8a" font-size="12" font-weight="750" text-anchor="middle">D2H · PCIe / C2C</text>
    <path d="M655 238H717" stroke="#8b5cf6" stroke-width="5" marker-end="url(#purple)"/>
    <text x="686" y="218" fill="#6d28d9" font-size="12" font-weight="750" text-anchor="middle">P2P</text><text x="686" y="258" fill="#6d28d9" font-size="11" text-anchor="middle">NVLink / PCIe</text>

    <rect x="38" y="470" width="1024" height="120" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="62" y="503" fill="#0f172a" font-size="16" font-weight="750">每条路径都至少包含：</text>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="250" y="492" width="160" height="46" rx="23" fill="#dcfce7"/><text x="330" y="521" fill="#166534">读取源内存</text>
      <text x="432" y="520" fill="#64748b" font-size="20">+</text>
      <rect x="455" y="492" width="190" height="46" rx="23" fill="#fef3c7"/><text x="550" y="521" fill="#92400e">经过搬运路径</text>
      <text x="667" y="520" fill="#64748b" font-size="20">+</text>
      <rect x="690" y="492" width="160" height="46" rx="23" fill="#ede9fe"/><text x="770" y="521" fill="#6d28d9">写入目标内存</text>
    </g>
    <text x="550" y="568" fill="#64748b" font-size="13" text-anchor="middle">copy engine 能减少 SM 占用，但不会消除内存和链路流量</text>
  </g>
</svg>
