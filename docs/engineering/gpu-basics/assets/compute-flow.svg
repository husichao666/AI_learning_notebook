<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">GPU 计算的数据生命周期</title>
  <desc id="desc">输入参数和激活从 HBM 经 L2 到达 SM 内的寄存器和 Shared Memory，再由 Tensor Core 或 CUDA Core 计算，结果最终写回 HBM。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3b82f6"/></marker></defs>
  <rect width="1100" height="500" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="24" font-weight="750">一次计算：先搬到 SM，再执行，再写回</text>
    <text x="38" y="68" fill="#64748b" font-size="14">算术单元只处理已经到达附近的数据</text>

    <g text-anchor="middle">
      <rect x="38" y="135" width="170" height="106" rx="16" fill="#f0fdf4" stroke="#22c55e"/>
      <text x="123" y="171" fill="#166534" font-size="18" font-weight="750">HBM 输入</text>
      <text x="123" y="198" fill="#475569" font-size="13">参数 · 激活</text><text x="123" y="220" fill="#64748b" font-size="12">容量大 / 距离远</text>

      <rect x="258" y="135" width="130" height="106" rx="16" fill="#ecfdf5" stroke="#4ade80"/>
      <text x="323" y="177" fill="#166534" font-size="18" font-weight="750">L2</text>
      <text x="323" y="204" fill="#64748b" font-size="12">共享缓存</text>

      <rect x="438" y="116" width="196" height="144" rx="16" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="536" y="150" fill="#1e3a8a" font-size="18" font-weight="750">SM 内部存储</text>
      <rect x="459" y="172" width="70" height="53" rx="9" fill="#fff" stroke="#93c5fd"/><text x="494" y="194" fill="#334155" font-size="12" font-weight="700">Register</text><text x="494" y="212" fill="#64748b" font-size="10">每线程</text>
      <rect x="542" y="172" width="71" height="53" rx="9" fill="#fff" stroke="#93c5fd"/><text x="577" y="194" fill="#334155" font-size="11" font-weight="700">Shared</text><text x="577" y="212" fill="#64748b" font-size="10">每 Block</text>

      <rect x="684" y="116" width="198" height="144" rx="16" fill="#eef2ff" stroke="#7c93ff"/>
      <text x="783" y="150" fill="#3730a3" font-size="18" font-weight="750">执行单元</text>
      <rect x="704" y="172" width="73" height="53" rx="9" fill="#dbeafe" stroke="#3b82f6"/><text x="740" y="194" fill="#1e3a8a" font-size="11" font-weight="700">Tensor</text><text x="740" y="212" fill="#1e3a8a" font-size="11" font-weight="700">Core</text>
      <rect x="790" y="172" width="72" height="53" rx="9" fill="#dbeafe" stroke="#3b82f6"/><text x="826" y="194" fill="#1e3a8a" font-size="11" font-weight="700">CUDA</text><text x="826" y="212" fill="#1e3a8a" font-size="11" font-weight="700">Core</text>

      <rect x="932" y="135" width="130" height="106" rx="16" fill="#f0fdf4" stroke="#22c55e"/>
      <text x="997" y="171" fill="#166534" font-size="18" font-weight="750">HBM 输出</text>
      <text x="997" y="198" fill="#475569" font-size="13">结果 Tensor</text><text x="997" y="220" fill="#64748b" font-size="12">写回显存</text>
    </g>
    <g stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)">
      <path d="M208 188H253"/><path d="M388 188H433"/><path d="M634 188H679"/><path d="M882 188H927"/>
    </g>

    <rect x="38" y="306" width="1024" height="142" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="62" y="340" fill="#0f172a" font-size="17" font-weight="750">同一条路径，三种不同瓶颈</text>
    <g text-anchor="middle">
      <rect x="70" y="364" width="280" height="58" rx="12" fill="#dbeafe"/><text x="210" y="387" fill="#1e3a8a" font-size="14" font-weight="750">计算受限</text><text x="210" y="408" fill="#475569" font-size="12">Tensor Core / CUDA Core 先满</text>
      <rect x="410" y="364" width="280" height="58" rx="12" fill="#dcfce7"/><text x="550" y="387" fill="#166534" font-size="14" font-weight="750">带宽受限</text><text x="550" y="408" fill="#475569" font-size="12">数据从 HBM 送得不够快</text>
      <rect x="750" y="364" width="280" height="58" rx="12" fill="#fef3c7"/><text x="890" y="387" fill="#92400e" font-size="14" font-weight="750">延迟受限</text><text x="890" y="408" fill="#475569" font-size="12">工作太小 / 并行度不足 / 等待</text>
    </g>
  </g>
</svg>
