<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">从 step time 到计算、拷贝和通信瓶颈的诊断流程</title>
  <desc id="desc">先确认端到端 step 是否变慢，再从时间线定位计算、拷贝、通信或等待。计算下钻到 Roofline，拷贝核对路径和字节，通信核对拓扑和消息大小，最后重新验证 step time、显存和正确性。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1100" height="650" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="24" font-weight="750">最小性能诊断流程</text>
    <text x="38" y="68" fill="#64748b" font-size="14">一次只验证一个假设，最后回到端到端结果</text>

    <rect x="390" y="100" width="320" height="72" rx="36" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="550" y="130" fill="#3730a3" font-size="17" font-weight="750" text-anchor="middle">Step time 变慢 / 利用率异常</text>
    <text x="550" y="153" fill="#64748b" font-size="12" text-anchor="middle">先采一段代表性时间线</text>
    <path d="M550 172V214" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="360" y="222" width="380" height="68" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="550" y="250" fill="#0f172a" font-size="16" font-weight="750" text-anchor="middle">关键路径上暴露的是哪一类时间？</text>
    <text x="550" y="273" fill="#64748b" font-size="12" text-anchor="middle">Kernel · Memcpy/Pack · Collective · 空洞/Wait</text>

    <path d="M430 290V332" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 290V332" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 290V332" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="55" y="340" width="300" height="154" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="205" y="372" fill="#1e3a8a" font-size="17" font-weight="750" text-anchor="middle">计算</text>
    <text x="82" y="405" fill="#334155" font-size="13">① 看 Roofline：算力还是 HBM</text>
    <text x="82" y="432" fill="#334155" font-size="13">② 看形状、并行度与 launch</text>
    <text x="82" y="459" fill="#334155" font-size="13">③ 再考虑融合或数据布局</text>

    <rect x="400" y="340" width="300" height="154" rx="18" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="550" y="372" fill="#92400e" font-size="17" font-weight="750" text-anchor="middle">拷贝</text>
    <text x="427" y="405" fill="#334155" font-size="13">① 源和目标在哪里</text>
    <text x="427" y="432" fill="#334155" font-size="13">② 实际读写多少字节</text>
    <text x="427" y="459" fill="#334155" font-size="13">③ 是否能用 view 或复用 buffer</text>

    <rect x="745" y="340" width="300" height="154" rx="18" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="895" y="372" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="middle">通信 / 等待</text>
    <text x="772" y="405" fill="#334155" font-size="13">① 看拓扑、消息大小和次数</text>
    <text x="772" y="432" fill="#334155" font-size="13">② 区分 pack 与链路时间</text>
    <text x="772" y="459" fill="#334155" font-size="13">③ 检查同步点与覆盖窗口</text>

    <path d="M205 494V540H390" fill="none" stroke="#64748b" stroke-width="3"/><path d="M550 494V540" fill="none" stroke="#64748b" stroke-width="3"/><path d="M895 494V540H710" fill="none" stroke="#64748b" stroke-width="3"/><path d="M550 540V564" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="330" y="572" width="440" height="52" rx="26" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="550" y="594" fill="#166534" font-size="15" font-weight="750" text-anchor="middle">重新测量：step time · 峰值显存 · 正确性</text>
    <text x="550" y="613" fill="#64748b" font-size="11" text-anchor="middle">局部变快但 step 不变，就继续寻找真正的关键路径</text>
  </g>
</svg>
