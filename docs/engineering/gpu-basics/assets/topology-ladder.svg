<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">GPU 通信从节点内到跨节点的带宽层级</title>
  <desc id="desc">GPU 内访问 HBM 路径最短；节点内 GPU 通常经 NVLink、NVSwitch 或 PCIe；跨节点 GPU 还要经过 PCIe、网卡、InfiniBand 或 RoCE 和交换机。路径越长，通常时延越高、有效带宽越低。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1100" height="590" fill="#fff"/>
  <g font-family="'WenQuanYi Zen Hei','Noto Sans SC','Microsoft YaHei','Segoe UI',Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="38" y="42" fill="#0f172a" font-size="24" font-weight="750">拓扑阶梯：数据走得越远，路径越复杂</text>
    <text x="38" y="68" fill="#64748b" font-size="14">相对关系用于建立直觉；具体数字必须在目标机器上测量</text>

    <rect x="72" y="118" width="280" height="112" rx="18" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="212" y="150" fill="#166534" font-size="18" font-weight="750" text-anchor="middle">① 同一 GPU</text>
    <text x="212" y="181" fill="#334155" font-size="14" text-anchor="middle">SM ↔ L2 ↔ HBM</text>
    <text x="212" y="208" fill="#64748b" font-size="12" text-anchor="middle">本地访问 · 不经过外部互联</text>

    <rect x="242" y="264" width="360" height="112" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="422" y="296" fill="#1e3a8a" font-size="18" font-weight="750" text-anchor="middle">② 节点内 GPU ↔ GPU</text>
    <text x="422" y="327" fill="#334155" font-size="14" text-anchor="middle">HBM → NVLink / NVSwitch / PCIe → HBM</text>
    <text x="422" y="354" fill="#64748b" font-size="12" text-anchor="middle">通常低时延、高带宽；也受拓扑差异影响</text>

    <rect x="492" y="410" width="536" height="112" rx="18" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="760" y="442" fill="#6d28d9" font-size="18" font-weight="750" text-anchor="middle">③ 跨节点 GPU ↔ GPU</text>
    <text x="760" y="473" fill="#334155" font-size="14" text-anchor="middle">HBM → PCIe → NIC → IB / RoCE → Switch → NIC → PCIe → HBM</text>
    <text x="760" y="500" fill="#64748b" font-size="12" text-anchor="middle">路径更长；还受网卡亲和性、交换层级和拥塞影响</text>

    <path d="M352 174C428 174 392 260 420 260" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M602 320C706 320 672 406 744 406" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g text-anchor="middle">
      <rect x="688" y="110" width="340" height="190" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="858" y="143" fill="#0f172a" font-size="16" font-weight="750">路径变长时通常发生</text>
      <text x="785" y="184" fill="#ef4444" font-size="24" font-weight="800">↑</text><text x="820" y="182" fill="#334155" font-size="14" text-anchor="start">固定延迟</text>
      <text x="785" y="224" fill="#ef4444" font-size="24" font-weight="800">↑</text><text x="820" y="222" fill="#334155" font-size="14" text-anchor="start">拥塞与尾延迟风险</text>
      <text x="785" y="264" fill="#3b82f6" font-size="24" font-weight="800">↓</text><text x="820" y="262" fill="#334155" font-size="14" text-anchor="start">单 GPU 有效带宽</text>
    </g>
    <text x="550" y="563" fill="#64748b" font-size="13" font-weight="650" text-anchor="middle">并行策略的关键：把高频、难隐藏的通信放在更近的拓扑里</text>
  </g>
</svg>
