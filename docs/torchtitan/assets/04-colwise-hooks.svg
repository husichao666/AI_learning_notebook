<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="ColwiseParallel 安装 hook 与每次模块调用触发 hook 的完整过程">
  <defs>
    <marker id="hook-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1398" height="898" rx="22" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="700" y="48" text-anchor="middle" fill="#172033" font-size="30" font-weight="700">forward 源码不变，输入与参数的运行时语义变了</text>
    <text x="700" y="82" text-anchor="middle" fill="#5f6b7a" font-size="18">上半部分只执行一次；下半部分在每次 module(x) 时执行</text>

    <rect x="48" y="112" width="1304" height="326" rx="20" fill="#ffffff" stroke="#8ba3d9" stroke-width="1.7"/>
    <rect x="72" y="130" width="156" height="38" rx="9" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="150" y="156" text-anchor="middle" fill="#334a8a" font-size="18" font-weight="700">并行化阶段</text>
    <text x="254" y="155" fill="#64748b" font-size="16">只执行一次</text>

    <rect x="84" y="198" width="250" height="102" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="209" y="233" text-anchor="middle" fill="#334a8a" font-size="18" font-weight="700">ColwiseParallel._apply()</text>
    <text x="209" y="266" text-anchor="middle" fill="#5f6b7a" font-size="16">把三个处理函数交给</text>
    <text x="209" y="290" text-anchor="middle" fill="#5f6b7a" font-size="16">distribute_module()</text>

    <path d="M334 249 L405 249" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#hook-arrow)"/>

    <rect x="415" y="182" width="306" height="134" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="568" y="218" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">distribute_module()</text>
    <text x="568" y="253" text-anchor="middle" fill="#334155" font-size="16">① 立即调用 partition_fn</text>
    <text x="568" y="279" text-anchor="middle" fill="#334155" font-size="16">② 注册 input_fn</text>
    <text x="568" y="305" text-anchor="middle" fill="#334155" font-size="16">③ 注册 output_fn</text>

    <path d="M721 212 L790 204" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#hook-arrow)"/>
    <path d="M721 249 L790 260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#hook-arrow)"/>
    <path d="M721 286 C758 286 752 372 790 372" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#hook-arrow)"/>

    <rect x="800" y="124" width="500" height="282" rx="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1050" y="160" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">还是原来的 nn.Linear 对象</text>

    <rect x="830" y="181" width="440" height="46" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="850" y="210" fill="#1e3a8a" font-size="16" font-weight="700">parameters</text>
    <text x="1002" y="210" fill="#334155" font-size="16">weight / bias → DTensor Parameter</text>

    <rect x="830" y="237" width="440" height="46" rx="9" fill="#fff7ed" stroke="#fb923c"/>
    <text x="850" y="266" fill="#9a3412" font-size="16" font-weight="700">pre-hook</text>
    <text x="1002" y="266" fill="#334155" font-size="16">prepare_input_fn</text>

    <rect x="830" y="293" width="440" height="46" rx="9" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="850" y="322" fill="#166534" font-size="16" font-weight="700">forward</text>
    <text x="1002" y="322" fill="#334155" font-size="16">原来的 Python 实现</text>

    <rect x="830" y="349" width="440" height="46" rx="9" fill="#fff7ed" stroke="#fb923c"/>
    <text x="850" y="378" fill="#9a3412" font-size="16" font-weight="700">forward hook</text>
    <text x="1002" y="378" fill="#334155" font-size="16">prepare_output_fn</text>

    <path d="M700 438 L700 486" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#hook-arrow)"/>

    <rect x="48" y="497" width="1304" height="332" rx="20" fill="#ffffff" stroke="#66b88a" stroke-width="1.7"/>
    <rect x="72" y="515" width="156" height="38" rx="9" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="150" y="541" text-anchor="middle" fill="#166534" font-size="18" font-weight="700">运行阶段</text>
    <text x="254" y="540" fill="#64748b" font-size="16">每次 module(x) 都执行</text>

    <rect x="82" y="596" width="200" height="110" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="182" y="635" text-anchor="middle" fill="#334a8a" font-size="19" font-weight="700">module(x)</text>
    <text x="182" y="670" text-anchor="middle" fill="#5f6b7a" font-size="16">进入 __call__()</text>

    <path d="M282 651 L352 651" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#hook-arrow)"/>

    <rect x="362" y="578" width="255" height="146" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <circle cx="394" cy="610" r="19" fill="#ffedd5" stroke="#fb923c"/>
    <text x="394" y="617" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">1</text>
    <text x="489" y="615" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="700">forward_pre_hook</text>
    <text x="489" y="654" text-anchor="middle" fill="#334155" font-size="16">Tensor → DTensor</text>
    <text x="489" y="682" text-anchor="middle" fill="#5f6b7a" font-size="15">按需 redistribute 输入</text>

    <path d="M617 651 L687 651" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#hook-arrow)"/>

    <rect x="687" y="564" width="280" height="174" rx="14" fill="#ecfdf5" stroke="#4ade80" stroke-width="1.7"/>
    <circle cx="719" cy="610" r="19" fill="#dcfce7" stroke="#4ade80"/>
    <text x="719" y="617" text-anchor="middle" fill="#166534" font-size="17" font-weight="700">2</text>
    <text x="835" y="615" text-anchor="middle" fill="#166534" font-size="19" font-weight="700">原 forward() 源码</text>
    <text x="827" y="651" text-anchor="middle" fill="#334155" font-size="16">F.linear(input, DTensor weight)</text>
    <text x="827" y="681" text-anchor="middle" fill="#334155" font-size="16">进入 DTensor dispatcher</text>
    <text x="827" y="711" text-anchor="middle" fill="#5f6b7a" font-size="15">执行分片传播与本地 GEMM</text>

    <path d="M967 651 L1027 651" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#hook-arrow)"/>

    <rect x="1037" y="578" width="280" height="146" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <circle cx="1069" cy="610" r="19" fill="#ffedd5" stroke="#fb923c"/>
    <text x="1069" y="617" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">3</text>
    <text x="1177" y="615" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="700">forward_hook</text>
    <text x="1177" y="654" text-anchor="middle" fill="#334155" font-size="16">对齐输出 Placement</text>
    <text x="1177" y="682" text-anchor="middle" fill="#5f6b7a" font-size="15">按需 to_local()</text>

    <rect x="176" y="766" width="1048" height="52" rx="11" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="700" y="798" text-anchor="middle" fill="#334a8a" font-size="17" font-weight="700">forward 源码没变 ≠ 仍在执行单卡语义：DTensor 让同一个 F.linear 变成分布式算子</text>

    <text x="700" y="870" text-anchor="middle" fill="#64748b" font-size="16">参数对象和模块边界变了；Linear 的计算关系没有变</text>
  </g>
</svg>
