<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1050" viewBox="0 0 1480 1050" role="img" aria-labelledby="title desc">
  <title id="title">GraphTrainer 从初始化、首次构图到稳态训练的流程</title>
  <desc id="desc">初始化阶段构造 GraphTrainer 并留下空的 traced step。第一次 batch 经预处理、前反向函数包装和 minimal FX tracer 生成联合图。后续 batch 复用该图，输出 loss 和参数梯度，再由基础 Trainer 完成优化器更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .phase { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .box-title { font: 700 21px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .box-text { font: 400 17px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .code { font: 600 17px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1e3a8a; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-label { font: 600 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1480" height="1050" rx="28" fill="url(#bg)"/>
  <text x="740" y="52" class="title" text-anchor="middle">GraphTrainer：只构图一次，随后反复执行</text>
  <text x="740" y="84" class="subtitle" text-anchor="middle">参数和 buffer 每次从 live module 重新读取，优化器仍留在联合图之外</text>

  <!-- Initialization -->
  <rect x="40" y="112" width="1400" height="220" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="68" y="137" width="126" height="44" rx="22" fill="#2563eb"/>
  <text x="131" y="166" class="phase" text-anchor="middle">初始化</text>

  <g filter="url(#shadow)">
    <rect x="230" y="158" width="230" height="126" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="510" y="158" width="230" height="126" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="790" y="158" width="250" height="126" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1090" y="158" width="250" height="126" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="345" y="204" class="box-title">config.build()</text>
  <text x="345" y="237" class="box-text">构造 GraphTrainer</text>
  <text x="345" y="263" class="box-text">而不是普通 Trainer</text>

  <text x="625" y="204" class="box-title">基础 Trainer 初始化</text>
  <text x="625" y="237" class="box-text">mesh · model · optimizer</text>
  <text x="625" y="263" class="box-text">dataloader · checkpoint</text>

  <text x="915" y="198" class="box-title">图模式并行化</text>
  <text x="915" y="231" class="box-text">FQN 注解 · TP</text>
  <text x="915" y="257" class="box-text">SimpleFSDP · 编译设置</text>

  <text x="1215" y="207" class="code">_traced_step = None</text>
  <text x="1215" y="240" class="box-text">尚未追踪</text>
  <text x="1215" y="266" class="box-text">等待真实训练输入</text>

  <path d="M460 221 H495" class="arrow"/>
  <path d="M740 221 H775" class="arrow"/>
  <path d="M1040 221 H1075" class="arrow"/>

  <!-- First call -->
  <rect x="40" y="360" width="1400" height="288" rx="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="68" y="385" width="148" height="44" rx="22" fill="#15803d"/>
  <text x="142" y="414" class="phase" text-anchor="middle">第一次 batch</text>

  <g filter="url(#shadow)">
    <rect x="230" y="438" width="200" height="138" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="460" y="438" width="200" height="138" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="690" y="438" width="220" height="138" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="3"/>
    <rect x="940" y="438" width="200" height="138" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="1170" y="438" width="200" height="138" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="330" y="482" class="box-title">准备输入</text>
  <text x="330" y="518" class="box-text">preprocess_inputs</text>
  <text x="330" y="546" class="box-text">本 rank 的 batch</text>

  <text x="560" y="478" class="box-title">包装前反向</text>
  <text x="560" y="513" class="box-text">forward · loss</text>
  <text x="560" y="541" class="box-text">autograd.grad</text>

  <text x="800" y="478" class="box-title">minimal_fx_tracer</text>
  <text x="800" y="513" class="box-text">显式 state · FakeTensor</text>
  <text x="800" y="541" class="box-text">make_fx</text>

  <text x="1040" y="478" class="box-title">联合 FX 图</text>
  <text x="1040" y="513" class="box-text">forward → loss</text>
  <text x="1040" y="541" class="box-text">→ backward</text>

  <text x="1270" y="478" class="box-title">变换并缓存</text>
  <text x="1270" y="513" class="box-text">graph pass pipeline</text>
  <text x="1270" y="541" class="code">_traced_step</text>

  <path d="M430 507 H445" class="arrow"/>
  <path d="M660 507 H675" class="arrow"/>
  <path d="M910 507 H925" class="arrow"/>
  <path d="M1140 507 H1155" class="arrow"/>
  <path d="M1215 284 C1215 330 330 322 330 423" class="arrow"/>
  <text x="720" y="345" class="arrow-label" text-anchor="middle">第一次调用触发追踪</text>

  <!-- Steady state -->
  <rect x="40" y="676" width="1400" height="326" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="68" y="701" width="148" height="44" rx="22" fill="#c2410c"/>
  <text x="142" y="730" class="phase" text-anchor="middle">后续 batch</text>

  <g filter="url(#shadow)">
    <rect x="230" y="766" width="200" height="138" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="460" y="766" width="200" height="138" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="690" y="766" width="220" height="138" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
    <rect x="940" y="766" width="200" height="138" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1170" y="766" width="200" height="138" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  </g>
  <text x="330" y="806" class="box-title">读取最新状态</text>
  <text x="330" y="841" class="box-text">live params / buffers</text>
  <text x="330" y="869" class="box-text">+ 当前 batch</text>

  <text x="560" y="806" class="box-title">run_traced()</text>
  <text x="560" y="841" class="box-text">复用缓存图</text>
  <text x="560" y="869" class="box-text">在 no_grad 中执行</text>

  <text x="800" y="806" class="box-title">图的显式输出</text>
  <text x="800" y="841" class="code">[loss, *grads]</text>
  <text x="800" y="869" class="box-text">恢复 Tensor 结构</text>

  <text x="1040" y="806" class="box-title">累积梯度</text>
  <text x="1040" y="841" class="code">param.grad</text>
  <text x="1040" y="869" class="box-text">赋值或原地相加</text>

  <text x="1270" y="806" class="box-title">图外训练逻辑</text>
  <text x="1270" y="841" class="box-text">clip grad · optimizer</text>
  <text x="1270" y="869" class="box-text">scheduler · checkpoint</text>

  <path d="M430 835 H445" class="arrow"/>
  <path d="M660 835 H675" class="arrow"/>
  <path d="M910 835 H925" class="arrow"/>
  <path d="M1140 835 H1155" class="arrow"/>
  <path d="M1270 576 C1270 632 330 626 330 751" class="arrow"/>
  <text x="720" y="663" class="arrow-label" text-anchor="middle">后续调用跳过追踪，直接复用 TracedResult</text>

  <path d="M1270 904 V954 H330 V919" class="arrow"/>
  <text x="800" y="982" class="arrow-label" text-anchor="middle">optimizer 更新后的参数进入下一次图执行</text>
</svg>
