<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="DTensor 的逻辑张量、分布规格与各 rank 本地分片">
  <style>
    [fill="#eaeefb"]{fill:#172033}
    [fill="#cdd5ff"]{fill:#334a8a}
    [fill="#bbf7d0"]{fill:#166534}
    [fill="#fde68a"]{fill:#92400e}
    [fill="#fecdd3"]{fill:#9f1239}
    [fill="#9aa3b2"]{fill:#5f6b7a}
  </style>
  <defs>
    <marker id="dtensor-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="18" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="600" y="38" text-anchor="middle" fill="#eaeefb" font-size="28" font-weight="700">一个 DTensor 的三层口径</text>
    <text x="600" y="64" text-anchor="middle" fill="#9aa3b2" font-size="18">逻辑视图描述“完整张量是什么”，真正占显存的是每个 rank 的 local tensor</text>

    <text x="60" y="105" fill="#eaeefb" font-size="20" font-weight="700">① 逻辑全局张量</text>
    <text x="1135" y="105" text-anchor="end" fill="#9aa3b2" font-size="17">global shape = [8, D] · placements = [Shard(0)]</text>

    <g text-anchor="middle">
      <rect x="60" y="125" width="270" height="105" rx="10" fill="rgba(124,147,255,.18)" stroke="#7c93ff" stroke-width="1.5"/>
      <rect x="330" y="125" width="270" height="105" fill="rgba(74,222,128,.14)" stroke="#4ade80" stroke-width="1.5"/>
      <rect x="600" y="125" width="270" height="105" fill="rgba(251,191,36,.13)" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="870" y="125" width="270" height="105" rx="10" fill="rgba(251,113,133,.13)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="195" y="168" fill="#cdd5ff" font-size="20" font-weight="700">全局 dim-0：0–1</text>
      <text x="195" y="196" fill="#9aa3b2" font-size="18">逻辑 shard 0</text>
      <text x="465" y="168" fill="#bbf7d0" font-size="20" font-weight="700">全局 dim-0：2–3</text>
      <text x="465" y="196" fill="#9aa3b2" font-size="18">逻辑 shard 1</text>
      <text x="735" y="168" fill="#fde68a" font-size="20" font-weight="700">全局 dim-0：4–5</text>
      <text x="735" y="196" fill="#9aa3b2" font-size="18">逻辑 shard 2</text>
      <text x="1005" y="168" fill="#fecdd3" font-size="20" font-weight="700">全局 dim-0：6–7</text>
      <text x="1005" y="196" fill="#9aa3b2" font-size="18">逻辑 shard 3</text>
    </g>

    <text x="60" y="280" fill="#eaeefb" font-size="20" font-weight="700">② 每个进程真正持有的本地存储</text>
    <g text-anchor="middle">
      <rect x="60" y="300" width="240" height="115" rx="12" fill="rgba(124,147,255,.10)" stroke="#7c93ff"/>
      <text x="180" y="329" fill="#cdd5ff" font-size="20" font-weight="700">rank 0 · DTensor</text>
      <text x="180" y="360" fill="#eaeefb" font-size="19">local_tensor [2, D]</text>
      <text x="180" y="388" fill="#9aa3b2" font-size="17">只存全局行 0–1</text>

      <rect x="340" y="300" width="240" height="115" rx="12" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
      <text x="460" y="329" fill="#bbf7d0" font-size="20" font-weight="700">rank 1 · DTensor</text>
      <text x="460" y="360" fill="#eaeefb" font-size="19">local_tensor [2, D]</text>
      <text x="460" y="388" fill="#9aa3b2" font-size="17">只存全局行 2–3</text>

      <rect x="620" y="300" width="240" height="115" rx="12" fill="rgba(251,191,36,.09)" stroke="#fbbf24"/>
      <text x="740" y="329" fill="#fde68a" font-size="20" font-weight="700">rank 2 · DTensor</text>
      <text x="740" y="360" fill="#eaeefb" font-size="19">local_tensor [2, D]</text>
      <text x="740" y="388" fill="#9aa3b2" font-size="17">只存全局行 4–5</text>

      <rect x="900" y="300" width="240" height="115" rx="12" fill="rgba(251,113,133,.09)" stroke="#fb7185"/>
      <text x="1020" y="329" fill="#fecdd3" font-size="20" font-weight="700">rank 3 · DTensor</text>
      <text x="1020" y="360" fill="#eaeefb" font-size="19">local_tensor [2, D]</text>
      <text x="1020" y="388" fill="#9aa3b2" font-size="17">只存全局行 6–7</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#dtensor-arrow)">
      <path d="M195 230 C195 255 180 268 180 292"/>
      <path d="M465 230 C465 255 460 268 460 292"/>
      <path d="M735 230 C735 255 740 268 740 292"/>
      <path d="M1005 230 C1005 255 1020 268 1020 292"/>
    </g>

    <text x="60" y="475" fill="#eaeefb" font-size="20" font-weight="700">③ 每个 DTensor 都携带的分布说明书 DTensorSpec</text>
    <rect x="60" y="495" width="1080" height="125" rx="14" fill="rgba(148,163,184,.08)" stroke="#64748b"/>
    <g text-anchor="middle">
      <rect x="95" y="525" width="300" height="65" rx="10" fill="rgba(124,147,255,.12)" stroke="#7c93ff"/>
      <text x="245" y="550" fill="#cdd5ff" font-size="19" font-weight="700">mesh</text>
      <text x="245" y="575" fill="#9aa3b2" font-size="17">4-rank CUDA DeviceMesh</text>

      <rect x="450" y="525" width="300" height="65" rx="10" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
      <text x="600" y="550" fill="#bbf7d0" font-size="19" font-weight="700">placements</text>
      <text x="600" y="575" fill="#9aa3b2" font-size="17">[Shard(0)]</text>

      <rect x="805" y="525" width="300" height="65" rx="10" fill="rgba(251,191,36,.09)" stroke="#fbbf24"/>
      <text x="955" y="550" fill="#fde68a" font-size="19" font-weight="700">tensor_meta</text>
      <text x="955" y="575" fill="#9aa3b2" font-size="17">global shape / stride / dtype</text>
    </g>
    <text x="600" y="648" text-anchor="middle" fill="#9aa3b2" font-size="17">逻辑全局张量不是额外复制的 buffer；它由 local_tensor 与 DTensorSpec 共同解释出来</text>
  </g>
</svg>
