<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="ShardingConfig 在 spmd_types 后端中的初始化与运行时路径">
  <defs>
    <marker id="spmd-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1398" height="818" rx="22" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="700" y="48" text-anchor="middle" fill="#172033" font-size="30" font-weight="700">ShardingConfig 怎样进入 spmd_types 执行路径</text>
    <text x="700" y="82" text-anchor="middle" fill="#5f6b7a" font-size="18">配置只声明布局；parallelize() 负责安装，forward 包装负责每次执行</text>

    <rect x="55" y="120" width="1290" height="238" rx="20" fill="#ffffff" stroke="#8ba3d9" stroke-width="1.6"/>
    <text x="84" y="156" fill="#334a8a" font-size="21" font-weight="700">初始化阶段 · 只执行一次</text>

    <rect x="88" y="190" width="248" height="112" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="212" y="224" text-anchor="middle" fill="#334a8a" font-size="19" font-weight="700">Module.Config</text>
    <text x="212" y="254" text-anchor="middle" fill="#5f6b7a" font-size="16">携带 ShardingConfig</text>
    <text x="212" y="280" text-anchor="middle" fill="#5f6b7a" font-size="16">src / dst / state</text>

    <path d="M336 246 L397 246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="407" y="190" width="260" height="112" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="537" y="224" text-anchor="middle" fill="#334a8a" font-size="19" font-weight="700">Config.build()</text>
    <text x="537" y="254" text-anchor="middle" fill="#5f6b7a" font-size="16">写入 module</text>
    <text x="537" y="280" text-anchor="middle" fill="#5f6b7a" font-size="16">._sharding_config</text>

    <path d="M667 246 L728 246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="738" y="190" width="260" height="112" rx="14" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="868" y="224" text-anchor="middle" fill="#1e3a8a" font-size="19" font-weight="700">分发状态</text>
    <text x="868" y="254" text-anchor="middle" fill="#5f6b7a" font-size="16">spmd.shard()</text>
    <text x="868" y="280" text-anchor="middle" fill="#5f6b7a" font-size="16">普通本地 Parameter</text>

    <path d="M998 246 L1059 246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="1069" y="190" width="242" height="112" rx="14" fill="#ffedd5" stroke="#fb923c"/>
    <text x="1190" y="224" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="700">包装 forward</text>
    <text x="1190" y="254" text-anchor="middle" fill="#5f6b7a" font-size="16">输入转换 → 原函数</text>
    <text x="1190" y="280" text-anchor="middle" fill="#5f6b7a" font-size="16">→ 输出转换</text>

    <path d="M1190 302 L1190 405 L700 405 L700 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="55" y="454" width="1290" height="292" rx="20" fill="#ffffff" stroke="#66b88a" stroke-width="1.6"/>
    <text x="84" y="491" fill="#166534" font-size="21" font-weight="700">运行阶段 · 每次 module(...) 都执行</text>

    <rect x="88" y="533" width="270" height="144" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <text x="223" y="568" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="700">输入边界</text>
    <text x="223" y="600" text-anchor="middle" fill="#5f6b7a" font-size="16">assert src type</text>
    <text x="223" y="628" text-anchor="middle" fill="#5f6b7a" font-size="16">spmd.redistribute</text>
    <text x="223" y="654" text-anchor="middle" fill="#5f6b7a" font-size="16">src → dst</text>

    <path d="M358 605 L433 605" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="443" y="533" width="514" height="144" rx="14" fill="#ecfdf5" stroke="#4ade80" stroke-width="1.7"/>
    <text x="700" y="570" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">原来的单卡 forward</text>
    <text x="700" y="606" text-anchor="middle" fill="#334155" font-size="18">普通 Tensor + 本地 ATen / fused kernel</text>
    <text x="700" y="638" text-anchor="middle" fill="#5f6b7a" font-size="16">模型计算关系没有被重写</text>

    <path d="M957 605 L1032 605" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#spmd-arrow)"/>

    <rect x="1042" y="533" width="270" height="144" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <text x="1177" y="568" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="700">输出边界</text>
    <text x="1177" y="600" text-anchor="middle" fill="#5f6b7a" font-size="16">assert src type</text>
    <text x="1177" y="628" text-anchor="middle" fill="#5f6b7a" font-size="16">spmd.redistribute</text>
    <text x="1177" y="654" text-anchor="middle" fill="#5f6b7a" font-size="16">src → dst</text>

    <rect x="254" y="772" width="892" height="1" fill="#d7deea"/>
    <text x="700" y="799" text-anchor="middle" fill="#5f6b7a" font-size="16">类型信息负责证明布局正确，显式 collective 负责真正改变各 rank 上的数据</text>
  </g>
</svg>
