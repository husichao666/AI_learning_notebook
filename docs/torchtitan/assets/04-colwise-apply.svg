<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="ColwiseParallel 通过参数分发和 forward 前置与后置 hook 改造模块">
  <defs>
    <marker id="apply-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="818" rx="18" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="600" y="44" text-anchor="middle" fill="#172033" font-size="28" font-weight="700">ColwiseParallel 应用到模块时做了什么</text>
    <text x="600" y="76" text-anchor="middle" fill="#5f6b7a" font-size="18">不替换 Linear / Embedding kernel，只补上状态分发和模块边界布局</text>

    <rect x="180" y="112" width="840" height="90" rx="15" fill="#eef2ff" stroke="#7c93ff" stroke-width="1.7"/>
    <text x="600" y="148" text-anchor="middle" fill="#334a8a" font-size="21" font-weight="700">parallelize_module(module, tp_mesh, parallelize_plan)</text>
    <text x="600" y="179" text-anchor="middle" fill="#5f6b7a" font-size="17">按 FQN 找到目标子模块，将 ColwiseParallel._apply() 应用上去</text>

    <path d="M600 202 L600 244" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#apply-arrow)"/>

    <rect x="70" y="254" width="1060" height="152" rx="17" fill="#ffffff" stroke="#d7deea" stroke-width="1.5"/>
    <text x="104" y="290" fill="#172033" font-size="21" font-weight="700">并行化阶段 · distribute_module()</text>
    <rect x="105" y="316" width="450" height="61" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="330" y="342" text-anchor="middle" fill="#1e3a8a" font-size="18" font-weight="700">Linear：weight / bias → Shard(0)</text>
    <text x="330" y="365" text-anchor="middle" fill="#5f6b7a" font-size="15">参数重新注册为 DTensor Parameter</text>
    <rect x="645" y="316" width="450" height="61" rx="10" fill="#ffedd5" stroke="#fb923c"/>
    <text x="870" y="342" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="700">Embedding：weight → Shard(1)</text>
    <text x="870" y="365" text-anchor="middle" fill="#5f6b7a" font-size="15">两种模块都产生最后一维分片输出</text>

    <path d="M600 406 L600 452" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#apply-arrow)"/>

    <rect x="35" y="463" width="335" height="214" rx="17" fill="#ffffff" stroke="#7c93ff" stroke-width="1.6"/>
    <circle cx="72" cy="501" r="21" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="72" y="508" text-anchor="middle" fill="#334a8a" font-size="18" font-weight="700">1</text>
    <text x="104" y="507" fill="#172033" font-size="20" font-weight="700">准备输入</text>
    <text x="202" y="548" text-anchor="middle" fill="#334a8a" font-size="17" font-weight="700">forward_pre_hook</text>
    <text x="202" y="576" text-anchor="middle" fill="#5f6b7a" font-size="16">按 input_layouts 包装 DTensor</text>
    <text x="202" y="612" text-anchor="middle" fill="#334a8a" font-size="17" font-weight="700">不是 Replicate？</text>
    <text x="202" y="640" text-anchor="middle" fill="#5f6b7a" font-size="16">redistribute → Replicate</text>

    <path d="M370 570 L423 570" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#apply-arrow)"/>

    <rect x="432" y="463" width="335" height="214" rx="17" fill="#ffffff" stroke="#4ade80" stroke-width="1.6"/>
    <circle cx="469" cy="501" r="21" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="469" y="508" text-anchor="middle" fill="#166534" font-size="18" font-weight="700">2</text>
    <text x="501" y="507" fill="#172033" font-size="20" font-weight="700">执行原 forward</text>
    <rect x="485" y="544" width="229" height="85" rx="10" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="600" y="576" text-anchor="middle" fill="#166534" font-size="19" font-weight="700">nn.Linear</text>
    <text x="600" y="605" text-anchor="middle" fill="#5f6b7a" font-size="16">或 nn.Embedding</text>
    <text x="600" y="657" text-anchor="middle" fill="#5f6b7a" font-size="15">直接使用本地参数 shard</text>

    <path d="M767 570 L820 570" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#apply-arrow)"/>

    <rect x="829" y="463" width="335" height="214" rx="17" fill="#ffffff" stroke="#fb923c" stroke-width="1.6"/>
    <circle cx="866" cy="501" r="21" fill="#fff7ed" stroke="#fb923c"/>
    <text x="866" y="508" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="700">3</text>
    <text x="898" y="507" fill="#172033" font-size="20" font-weight="700">整理输出</text>
    <text x="996" y="548" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">forward_hook</text>
    <text x="996" y="576" text-anchor="middle" fill="#5f6b7a" font-size="16">默认保持 Shard(-1)</text>
    <text x="996" y="612" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">use_local_output？</text>
    <text x="996" y="640" text-anchor="middle" fill="#5f6b7a" font-size="16">True 时调用 to_local()</text>

    <rect x="155" y="728" width="890" height="58" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="600" y="753" text-anchor="middle" fill="#334a8a" font-size="19" font-weight="700">hook 包住原 forward，单卡计算代码保持不变</text>
    <text x="600" y="776" text-anchor="middle" fill="#5f6b7a" font-size="15">变化的是参数的实际 buffer，以及模块入口和出口携带的 DTensor 布局</text>
  </g>
</svg>
