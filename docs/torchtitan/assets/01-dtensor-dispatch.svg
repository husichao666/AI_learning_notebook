<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-label="当前 PyTorch DTensor 算子从分发到本地计算再包装的流程">
  <style>
    [fill="#eaeefb"]{fill:#172033}
    [fill="#cdd5ff"]{fill:#334a8a}
    [fill="#bbf7d0"]{fill:#166534}
    [fill="#fde68a"]{fill:#92400e}
    [fill="#fecdd3"]{fill:#9f1239}
    [fill="#9aa3b2"]{fill:#5f6b7a}
  </style>
  <defs>
    <marker id="dispatch-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1098" height="858" rx="18" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="550" y="38" text-anchor="middle" fill="#eaeefb" font-size="28" font-weight="700">DTensor 算子调度：语义在全局，计算落在本地</text>
    <text x="550" y="64" text-anchor="middle" fill="#9aa3b2" font-size="18">当前 PyTorch 常见路径先走 C++ fast path；Python OpDispatcher 继续处理慢路径与特殊情况</text>

    <g text-anchor="middle">
      <rect x="210" y="92" width="680" height="66" rx="12" fill="rgba(124,147,255,.16)" stroke="#7c93ff" stroke-width="1.5"/>
      <text x="550" y="119" fill="#cdd5ff" font-size="21" font-weight="700">① 用户调用 ATen 算子</text>
      <text x="550" y="143" fill="#9aa3b2" font-size="18">例如 add / matmul；至少一个输入是 DTensor</text>

      <rect x="95" y="220" width="410" height="86" rx="12" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
      <text x="300" y="251" fill="#bbf7d0" font-size="20" font-weight="700">②a C++ DTensor fast path</text>
      <text x="300" y="278" fill="#9aa3b2" font-size="17">处理常见分发与缓存命中路径</text>

      <rect x="595" y="220" width="410" height="86" rx="12" fill="rgba(251,191,36,.11)" stroke="#fbbf24"/>
      <text x="800" y="251" fill="#fde68a" font-size="20" font-weight="700">②b Python OpDispatcher</text>
      <text x="800" y="278" fill="#9aa3b2" font-size="17">处理慢路径、cache miss 与特殊算子</text>

      <rect x="210" y="365" width="680" height="72" rx="12" fill="rgba(148,163,184,.09)" stroke="#64748b"/>
      <text x="550" y="393" fill="#eaeefb" font-size="20" font-weight="700">③ 拆出 local tensor 与输入 DTensorSpec</text>
      <text x="550" y="419" fill="#9aa3b2" font-size="17">形成算子 schema、mesh、输入布局等调度信息</text>

      <rect x="210" y="490" width="680" height="80" rx="12" fill="rgba(124,147,255,.12)" stroke="#7c93ff"/>
      <text x="550" y="520" fill="#cdd5ff" font-size="20" font-weight="700">④ ShardingPropagator 推导策略</text>
      <text x="550" y="547" fill="#9aa3b2" font-size="17">决定输出 placements，并判断输入是否需要先变成建议布局</text>

      <rect x="210" y="623" width="680" height="86" rx="12" fill="rgba(251,113,133,.10)" stroke="#fb7185"/>
      <text x="550" y="653" fill="#fecdd3" font-size="20" font-weight="700">⑤ 仅在布局不匹配时执行 redistribute</text>
      <text x="550" y="680" fill="#9aa3b2" font-size="17">Shard→Replicate: all-gather · Partial→Replicate: all-reduce</text>
      <text x="550" y="700" fill="#9aa3b2" font-size="17">Partial→Shard: reduce-scatter · Replicate→Shard: 本地切分</text>

      <rect x="85" y="764" width="430" height="68" rx="12" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
      <text x="300" y="792" fill="#bbf7d0" font-size="20" font-weight="700">⑥ 各 rank 执行本地 ATen 算子</text>
      <text x="300" y="817" fill="#9aa3b2" font-size="17">输入和输出都是普通 local tensor</text>

      <rect x="585" y="764" width="430" height="68" rx="12" fill="rgba(124,147,255,.12)" stroke="#7c93ff"/>
      <text x="800" y="792" fill="#cdd5ff" font-size="20" font-weight="700">⑦ local output + output spec</text>
      <text x="800" y="817" fill="#9aa3b2" font-size="17">重新包装为 DTensor，继续参与后续算子</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#dispatch-arrow)">
      <path d="M550 158 L550 185 L300 185 L300 212"/>
      <path d="M550 158 L550 185 L800 185 L800 212"/>
      <path d="M300 306 L300 335 L550 335 L550 357"/>
      <path d="M800 306 L800 335 L550 335 L550 357"/>
      <path d="M550 437 L550 482"/>
      <path d="M550 570 L550 615"/>
      <path d="M550 709 L550 735 L300 735 L300 756"/>
      <path d="M515 798 L577 798"/>
    </g>

    <rect x="900" y="504" width="170" height="52" rx="10" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-dasharray="5 4"/>
    <text x="985" y="526" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="700">布局已满足？</text>
    <text x="985" y="545" text-anchor="middle" fill="#9aa3b2" font-size="15">直接跳过通信</text>
    <path d="M890 530 L900 530" fill="none" stroke="#4ade80" stroke-width="1.4" marker-end="url(#dispatch-arrow)"/>
  </g>
</svg>
