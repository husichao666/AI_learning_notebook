<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="TorchTitan ParallelDims 从一维 world mesh 构造多套命名 mesh 视图">
  <defs>
    <marker id="views-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="878" rx="18" fill="#f8fafc" stroke="#d7deea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="600" y="42" text-anchor="middle" fill="#172033" font-size="28" font-weight="700">TorchTitan ParallelDims：同一批 rank 的多套 mesh 视图</text>
    <text x="600" y="73" text-anchor="middle" fill="#5f6b7a" font-size="18">不是复制设备，而是按不同消费者的语义重新解释同一个一维 world mesh</text>

    <rect x="330" y="101" width="540" height="86" rx="15" fill="#eef2ff" stroke="#7c93ff" stroke-width="2"/>
    <text x="600" y="135" text-anchor="middle" fill="#334a8a" font-size="22" font-weight="700">world mesh · shape = [WORLD_SIZE]</text>
    <text x="600" y="165" text-anchor="middle" fill="#5f6b7a" font-size="17">mesh_dim_names = ("world",)</text>

    <g fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#views-arrow)">
      <path d="M600 187 L600 215 L190 215 L190 246"/>
      <path d="M600 187 L600 246"/>
      <path d="M600 187 L600 215 L1010 215 L1010 246"/>
    </g>

    <rect x="35" y="254" width="310" height="126" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <text x="190" y="286" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">dataloading view</text>
    <text x="190" y="320" text-anchor="middle" fill="#172033" font-size="17">pp × batch × cp × tp</text>
    <text x="190" y="349" text-anchor="middle" fill="#5f6b7a" font-size="16">batch = dp_replicate × dp_shard</text>
    <text x="190" y="370" text-anchor="middle" fill="#5f6b7a" font-size="16">供数据分片与 batch rank 使用</text>

    <rect x="405" y="254" width="390" height="126" rx="14" fill="#ffffff" stroke="#7c93ff" stroke-width="1.5"/>
    <text x="600" y="286" text-anchor="middle" fill="#334a8a" font-size="21" font-weight="700">dense views</text>
    <text x="600" y="320" text-anchor="middle" fill="#172033" font-size="17">FSDP 存储与 forward/backward</text>
    <text x="600" y="349" text-anchor="middle" fill="#5f6b7a" font-size="16">具体 axis 随 SPMD backend 改变</text>
    <text x="600" y="370" text-anchor="middle" fill="#5f6b7a" font-size="16">同一设备集合可同时存在多个视图</text>

    <rect x="855" y="254" width="310" height="126" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1010" y="286" text-anchor="middle" fill="#92400e" font-size="21" font-weight="700">sparse view</text>
    <text x="1010" y="320" text-anchor="middle" fill="#172033" font-size="17">pp × dp_replicate × efsdp × ep</text>
    <text x="1010" y="349" text-anchor="middle" fill="#5f6b7a" font-size="16">efsdp = dp_shard × cp × tp / ep</text>
    <text x="1010" y="370" text-anchor="middle" fill="#5f6b7a" font-size="16">供 Expert Parallel 区域使用</text>

    <g fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#views-arrow)">
      <path d="M190 380 L190 423"/>
      <path d="M520 380 L520 405 L537 405 L537 423"/>
      <path d="M680 380 L680 405 L882 405 L882 423"/>
    </g>

    <rect x="35" y="431" width="310" height="115" rx="14" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="190" y="463" text-anchor="middle" fill="#166534" font-size="20" font-weight="700">loss mesh</text>
    <text x="190" y="495" text-anchor="middle" fill="#172033" font-size="17">flatten(batch, cp)</text>
    <text x="190" y="524" text-anchor="middle" fill="#5f6b7a" font-size="16">size = batch × cp</text>

    <rect x="380" y="431" width="315" height="170" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="537" y="463" text-anchor="middle" fill="#334a8a" font-size="20" font-weight="700">spmd_types · FSDP storage</text>
    <text x="537" y="496" text-anchor="middle" fill="#172033" font-size="16">pp × dp_replicate × dp_shard</text>
    <text x="537" y="520" text-anchor="middle" fill="#172033" font-size="16">× cp × tp</text>
    <text x="537" y="555" text-anchor="middle" fill="#5f6b7a" font-size="16">参数分片看具体存储 axis</text>
    <text x="537" y="582" text-anchor="middle" fill="#5f6b7a" font-size="16">dp_shard 保持独立</text>

    <rect x="725" y="431" width="315" height="170" rx="14" fill="#eef2ff" stroke="#7c93ff"/>
    <text x="882" y="463" text-anchor="middle" fill="#334a8a" font-size="20" font-weight="700">spmd_types · fwd/bwd</text>
    <text x="882" y="496" text-anchor="middle" fill="#172033" font-size="17">dp × cp × tp</text>
    <text x="882" y="529" text-anchor="middle" fill="#5f6b7a" font-size="16">dp = dp_replicate × dp_shard</text>
    <text x="882" y="562" text-anchor="middle" fill="#5f6b7a" font-size="16">供 SPMD 类型检查</text>
    <text x="882" y="587" text-anchor="middle" fill="#5f6b7a" font-size="16">不等同于参数存储视图</text>

    <path d="M600 380 L710 405 L710 624" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#views-arrow)"/>
    <rect x="380" y="632" width="660" height="108" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <text x="710" y="665" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="700">partial_dtensor · dense storage</text>
    <text x="710" y="697" text-anchor="middle" fill="#172033" font-size="17">pp × dp_replicate × fsdp × tp</text>
    <text x="710" y="724" text-anchor="middle" fill="#5f6b7a" font-size="16">fsdp = dp_shard × cp；模型并行主要保留 tp / ep</text>

    <rect x="70" y="798" width="1060" height="58" rx="16" fill="#ffffff" stroke="#64748b"/>
    <text x="600" y="824" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">命名 mesh 缓存：batch · loss · dp_replicate · dp_shard / fsdp · cp · tp · ep · efsdp</text>
    <text x="600" y="847" text-anchor="middle" fill="#5f6b7a" font-size="16">上层通过 get_mesh() / get_optional_mesh() 取职责视图，不必手工维护 rank 列表与 ProcessGroup</text>
  </g>
</svg>
