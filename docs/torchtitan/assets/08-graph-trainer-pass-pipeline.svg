<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1180" viewBox="0 0 1480 1180" role="img" aria-labelledby="title desc">
  <title id="title">GraphTrainer 默认图变换流水线</title>
  <desc id="desc">联合 FX 图先经过规范化，再决定激活保存、CPU offload 和重计算，然后完成 FSDP、EP、TP 通信调度，最后进入 regional 或 full Inductor 并套 CUDA Graph wrapper。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .phase { font: 700 21px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; text-anchor: middle; }
      .box-title { font: 700 20px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .box-text { font: 400 17px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .code { font: 600 16px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1e3a8a; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .hint { font: 600 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1480" height="1180" rx="28" fill="url(#bg)"/>
  <text x="740" y="50" class="title" text-anchor="middle">联合 FX 图怎样变成稳态执行程序</text>
  <text x="740" y="80" class="subtitle" text-anchor="middle">实线表示默认主干，虚线框和虚线箭头表示按配置插入的选配变换</text>

  <rect x="525" y="103" width="430" height="62" rx="31" fill="#312e81"/>
  <text x="740" y="142" class="phase">make_fx 联合图：forward → loss → backward</text>
  <path d="M740 165 V194" class="arrow"/>

  <!-- Normalize -->
  <rect x="40" y="196" width="1400" height="168" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="65" y="221" width="132" height="44" rx="22" fill="#2563eb"/>
  <text x="131" y="250" class="phase">规范化</text>
  <g filter="url(#shadow)">
    <rect x="245" y="224" width="300" height="112" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="590" y="224" width="300" height="112" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="935" y="224" width="330" height="112" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="395" y="266" class="box-title">删除 dead code</text>
  <text x="395" y="299" class="box-text">移除无消费者节点</text>
  <text x="395" y="324" class="code">eliminate_dead_code</text>
  <text x="740" y="266" class="box-title">统一等价图形</text>
  <text x="740" y="299" class="box-text">detach · view · transpose</text>
  <text x="740" y="324" class="code">canonicalize_graph</text>
  <text x="1100" y="266" class="box-title">FSDP unshard 去重</text>
  <text x="1100" y="299" class="box-text">同一参数只保留一条规范链</text>
  <text x="1100" y="324" class="code">deduplicate_fsdp_unshard</text>
  <path d="M545 280 H575" class="arrow"/>
  <path d="M890 280 H920" class="arrow"/>
  <path d="M1100 336 V388" class="arrow"/>

  <!-- Memory -->
  <rect x="40" y="390" width="1400" height="168" rx="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="65" y="415" width="132" height="44" rx="22" fill="#15803d"/>
  <text x="131" y="444" class="phase">激活内存</text>
  <g filter="url(#shadow)">
    <rect x="245" y="418" width="300" height="112" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="590" y="418" width="300" height="112" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="935" y="418" width="330" height="112" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="395" y="460" class="box-title">先写策略标签</text>
  <text x="395" y="493" class="box-text">save · recompute · offload</text>
  <text x="395" y="518" class="code">tag_with_memory_policy</text>
  <text x="740" y="460" class="box-title">插入 CPU offload</text>
  <text x="740" y="493" class="box-text">offload · reload · wait</text>
  <text x="740" y="518" class="code">apply_cpu_offload</text>
  <text x="1100" y="460" class="box-title">复制重计算节点</text>
  <text x="1100" y="493" class="box-text">放到最早 backward 消费者之前</text>
  <text x="1100" y="518" class="code">selective_activation_remat</text>
  <path d="M545 474 H575" class="arrow"/>
  <path d="M890 474 H920" class="arrow"/>
  <path d="M1100 530 V582" class="arrow"/>

  <!-- Distributed -->
  <rect x="40" y="584" width="1400" height="224" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="65" y="609" width="132" height="44" rx="22" fill="#c2410c"/>
  <text x="131" y="638" class="phase">通信调度</text>
  <g filter="url(#shadow)">
    <rect x="225" y="622" width="250" height="130" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="510" y="622" width="300" height="130" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
    <rect x="845" y="622" width="250" height="130" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="1130" y="622" width="250" height="130" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <text x="350" y="663" class="box-title">EP 准备</text>
  <text x="350" y="696" class="box-text">chunk 元数据 / 切图</text>
  <text x="350" y="722" class="box-text">隔离 process group</text>
  <text x="660" y="663" class="box-title">FSDP 分桶与预取</text>
  <text x="660" y="696" class="box-text">forward AG · backward AG</text>
  <text x="660" y="722" class="box-text">backward RS</text>
  <text x="970" y="663" class="box-title">Overlap 调度</text>
  <text x="970" y="696" class="box-text">EP schedule</text>
  <text x="970" y="722" class="box-text">FSDP dense region</text>
  <text x="1255" y="663" class="box-title">Async TP</text>
  <text x="1255" y="696" class="box-text">AG + MM</text>
  <text x="1255" y="722" class="box-text">MM + RS 微流水</text>
  <path d="M475 687 H495" class="branch"/>
  <path d="M810 687 H830" class="arrow"/>
  <path d="M1095 687 H1115" class="branch"/>
  <text x="350" y="780" class="hint" text-anchor="middle">选配</text>
  <text x="660" y="780" class="hint" text-anchor="middle">默认进入；无匹配节点时为空操作</text>
  <text x="970" y="780" class="hint" text-anchor="middle">选配</text>
  <text x="1255" y="780" class="hint" text-anchor="middle">选配</text>
  <path d="M1255 752 V832" class="arrow"/>

  <!-- Inductor -->
  <rect x="40" y="834" width="1400" height="190" rx="24" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="65" y="859" width="132" height="44" rx="22" fill="#7e22ce"/>
  <text x="131" y="888" class="phase">代码生成</text>
  <rect x="260" y="868" width="260" height="120" rx="18" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
  <text x="390" y="910" class="box-title">选择编译范围</text>
  <text x="390" y="944" class="code">inductor_compilation</text>
  <text x="390" y="971" class="box-text">regional 或 full</text>
  <g filter="url(#shadow)">
    <rect x="610" y="850" width="300" height="138" rx="18" fill="#ffffff" stroke="#c084fc" stroke-width="3"/>
    <rect x="1000" y="850" width="300" height="138" rx="18" fill="#ffffff" stroke="#c084fc" stroke-width="3"/>
  </g>
  <text x="760" y="895" class="box-title">Regional Inductor</text>
  <text x="760" y="929" class="box-text">标记并编译 FlexAttention</text>
  <text x="760" y="956" class="box-text">保留外层 FX 节点</text>
  <text x="1150" y="895" class="box-title">Full Inductor</text>
  <text x="1150" y="929" class="box-text">整张联合图作为一个 region</text>
  <text x="1150" y="956" class="box-text">不再继续做 FX 级改写</text>
  <path d="M520 916 C555 916 560 905 595 905" class="branch"/>
  <path d="M520 950 C700 1020 905 1020 985 950" class="branch"/>

  <!-- CUDA graph and output -->
  <path d="M760 988 V1045 H740" class="arrow"/>
  <path d="M1150 988 V1045 H740" class="arrow"/>
  <rect x="505" y="1046" width="470" height="72" rx="22" fill="#ffffff" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
  <text x="740" y="1077" class="box-title">CUDA Graph compatibility + wrapper</text>
  <text x="740" y="1104" class="box-text">运行时 warmup → capture → replay</text>
  <path d="M740 1118 V1135" class="arrow"/>
  <rect x="535" y="1137" width="410" height="34" rx="17" fill="#312e81"/>
  <text x="740" y="1161" class="phase">缓存到 _traced_step，后续 batch 复用</text>
</svg>
