<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Shard Placement：逻辑张量沿指定张量维度切分到各 rank">
  <defs>
    <marker id="shard-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1098" height="498" rx="18" fill="#f8fafc" stroke="#d7deea"/>

  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="550" y="42" text-anchor="middle" fill="#172033" font-size="28" font-weight="700">Shard(0)：沿张量第 0 维切分</text>
    <text x="550" y="73" text-anchor="middle" fill="#5f6b7a" font-size="18">逻辑 shape = [8, D] · 4 个 rank 的 local shape 通常为 [2, D]</text>

    <text x="70" y="112" fill="#172033" font-size="20" font-weight="700">逻辑全局张量 X</text>
    <text x="1030" y="112" text-anchor="end" fill="#5f6b7a" font-size="17">placements = [Shard(0)]</text>

    <g text-anchor="middle">
      <rect x="70" y="130" width="240" height="105" rx="12" fill="#e0e7ff" stroke="#7c93ff" stroke-width="1.5"/>
      <rect x="310" y="130" width="240" height="105" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
      <rect x="550" y="130" width="240" height="105" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="790" y="130" width="240" height="105" rx="12" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5"/>
      <text x="190" y="174" fill="#334a8a" font-size="20" font-weight="700">全局行 0–1</text>
      <text x="190" y="207" fill="#5f6b7a" font-size="17">shard 0</text>
      <text x="430" y="174" fill="#166534" font-size="20" font-weight="700">全局行 2–3</text>
      <text x="430" y="207" fill="#5f6b7a" font-size="17">shard 1</text>
      <text x="670" y="174" fill="#92400e" font-size="20" font-weight="700">全局行 4–5</text>
      <text x="670" y="207" fill="#5f6b7a" font-size="17">shard 2</text>
      <text x="910" y="174" fill="#9f1239" font-size="20" font-weight="700">全局行 6–7</text>
      <text x="910" y="207" fill="#5f6b7a" font-size="17">shard 3</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#shard-arrow)">
      <path d="M190 235 L190 285"/>
      <path d="M430 235 L430 285"/>
      <path d="M670 235 L670 285"/>
      <path d="M910 235 L910 285"/>
    </g>

    <g text-anchor="middle">
      <rect x="70" y="293" width="240" height="120" rx="14" fill="#ffffff" stroke="#7c93ff" stroke-width="1.5"/>
      <text x="190" y="326" fill="#334a8a" font-size="20" font-weight="700">rank 0 · local</text>
      <text x="190" y="363" fill="#172033" font-size="21">只保存行 0–1</text>
      <text x="190" y="394" fill="#5f6b7a" font-size="17">[2, D]</text>

      <rect x="310" y="293" width="240" height="120" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
      <text x="430" y="326" fill="#166534" font-size="20" font-weight="700">rank 1 · local</text>
      <text x="430" y="363" fill="#172033" font-size="21">只保存行 2–3</text>
      <text x="430" y="394" fill="#5f6b7a" font-size="17">[2, D]</text>

      <rect x="550" y="293" width="240" height="120" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="670" y="326" fill="#92400e" font-size="20" font-weight="700">rank 2 · local</text>
      <text x="670" y="363" fill="#172033" font-size="21">只保存行 4–5</text>
      <text x="670" y="394" fill="#5f6b7a" font-size="17">[2, D]</text>

      <rect x="790" y="293" width="240" height="120" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="1.5"/>
      <text x="910" y="326" fill="#9f1239" font-size="20" font-weight="700">rank 3 · local</text>
      <text x="910" y="363" fill="#172033" font-size="21">只保存行 6–7</text>
      <text x="910" y="394" fill="#5f6b7a" font-size="17">[2, D]</text>
    </g>

    <rect x="248" y="449" width="604" height="35" rx="17" fill="#eef2ff"/>
    <text x="550" y="473" text-anchor="middle" fill="#334a8a" font-size="17" font-weight="700">每个 rank 只占一部分存储；需要完整数据时再通过 all-gather 等通信重建</text>
  </g>
</svg>
