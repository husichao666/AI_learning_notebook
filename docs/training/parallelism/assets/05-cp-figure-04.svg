  <defs><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker></defs>
  <!-- four KV shards -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="30"  y="30" width="72" height="34" rx="5" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="66"  y="51" fill="#e6ebff">卡0 KV₀</text>
    <rect x="30"  y="72" width="72" height="34" rx="5" fill="rgba(74,222,128,0.16)"  stroke="#4ade80"/><text x="66"  y="93" fill="#e6ebff">卡1 KV₁</text>
    <rect x="30"  y="114" width="72" height="34" rx="5" fill="rgba(251,191,36,0.16)" stroke="#fbbf24"/><text x="66"  y="135" fill="#e6ebff">卡2 KV₂</text>
    <rect x="30"  y="156" width="72" height="18" rx="5" fill="rgba(244,114,182,0.16)" stroke="#f472b6"/><text x="66"  y="169" fill="#e6ebff" font-size="9">卡3 KV₃</text>
  </g>
  <path d="M110,90 L210,90" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <text x="160" y="80" text-anchor="middle" fill="#86efac" font-size="11">all-gather</text>
  <!-- full KV on every card -->
  <g font-size="10" text-anchor="middle">
    <rect x="230" y="34" width="150" height="112" rx="8" fill="#161922" stroke="#4ade80"/>
    <text x="305" y="56" fill="#bbf7d0" font-size="11.5" font-weight="700">每张卡都拿到完整 KV</text>
    <rect x="246" y="66" width="118" height="16" rx="3" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="305" y="78" fill="#e6ebff" font-size="8.5">KV₀</text>
    <rect x="246" y="86" width="118" height="16" rx="3" fill="rgba(74,222,128,0.16)" stroke="#4ade80"/><text x="305" y="98" fill="#e6ebff" font-size="8.5">KV₁</text>
    <rect x="246" y="106" width="118" height="16" rx="3" fill="rgba(251,191,36,0.16)" stroke="#fbbf24"/><text x="305" y="118" fill="#e6ebff" font-size="8.5">KV₂</text>
    <rect x="246" y="126" width="118" height="16" rx="3" fill="rgba(244,114,182,0.16)" stroke="#f472b6"/><text x="305" y="138" fill="#e6ebff" font-size="8.5">KV₃</text>
  </g>
  <path d="M388,90 L470,90" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <text x="429" y="80" text-anchor="middle" fill="#86efac" font-size="10.5">标准注意力</text>
  <text x="429" y="104" text-anchor="middle" fill="#9aa3b2" font-size="9.5">本地 Q 段</text>
  <rect x="482" y="52" width="150" height="76" rx="8" fill="rgba(74,222,128,0.08)" stroke="#4ade80"/>
  <text x="557" y="80" text-anchor="middle" fill="#bbf7d0" font-size="11.5" font-weight="700">O 的本地段</text>
  <text x="557" y="102" text-anchor="middle" fill="#9aa3b2" font-size="10">[S/cp, d]</text>
  <rect x="654" y="34" width="150" height="112" rx="8" fill="rgba(251,191,36,0.05)" stroke="#fbbf24"/>
  <text x="729" y="60" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">代价</text>
  <text x="729" y="84" text-anchor="middle" fill="#9aa3b2" font-size="10">显存持完整 K/V</text>
  <text x="729" y="102" text-anchor="middle" fill="#9aa3b2" font-size="10">同步、不可重叠</text>
  <text x="729" y="120" text-anchor="middle" fill="#9aa3b2" font-size="10">实现最简单</text>
</svg>
