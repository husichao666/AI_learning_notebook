  <text x="488" y="188"><tspan fill="#7c93ff" font-weight="700" font-size="13">rank 3</tspan><tspan fill="#9aa3b2" font-family="monospace" font-size="13" dx="12">logits[:, :, (tp−1)·V/tp : V]</tspan></text>
