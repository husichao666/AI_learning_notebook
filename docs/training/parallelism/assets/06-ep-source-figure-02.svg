<defs><marker id="router-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#f59e66"/></marker></defs>
<text x="460" y="31" fill="#eaeefb" font-size="19" font-weight="700" text-anchor="middle">Router：决定 token 去哪些专家</text>

<rect x="22" y="78" width="138" height="82" rx="12" fill="#202a4c" stroke="#7c93ff"/>
<text x="91" y="111" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">输入 tokens</text>
<text x="91" y="139" fill="#9aa3b2" font-size="14" text-anchor="middle">[S,B,H]</text>

<rect x="190" y="78" width="160" height="82" rx="12" fill="#251e18" stroke="#b9703f"/>
<text x="270" y="111" fill="#ffcfaa" font-size="15" font-weight="700" text-anchor="middle">① Gating 打分</text>
<text x="270" y="139" fill="#fff" font-size="14" text-anchor="middle">每个 token 对所有专家</text>

<rect x="380" y="78" width="160" height="82" rx="12" fill="#211c28" stroke="#a56be8"/>
<text x="460" y="111" fill="#d8b4fe" font-size="15" font-weight="700" text-anchor="middle">② Top-k 选择</text>
<text x="460" y="139" fill="#fff" font-size="14" text-anchor="middle">选 k 个专家</text>

<rect x="570" y="78" width="160" height="82" rx="12" fill="#251e18" stroke="#b9703f"/>
<text x="650" y="111" fill="#ffcfaa" font-size="15" font-weight="700" text-anchor="middle">③ 计算权重</text>
<text x="650" y="139" fill="#fff" font-size="14" text-anchor="middle">决定结果如何混合</text>

<rect x="760" y="78" width="138" height="82" rx="12" fill="#202a4c" stroke="#7c93ff"/>
<text x="829" y="111" fill="#aab6ff" font-size="15" font-weight="700" text-anchor="middle">输出路由</text>
<text x="829" y="139" fill="#fff" font-size="14" text-anchor="middle">probs + map</text>

<g stroke="#f59e66" stroke-width="2.2" marker-end="url(#router-arrow)">
<line x1="160" y1="119" x2="187" y2="119"/>
<line x1="350" y1="119" x2="377" y2="119"/>
<line x1="540" y1="119" x2="567" y2="119"/>
<line x1="730" y1="119" x2="757" y2="119"/>
</g>

<rect x="286" y="196" width="348" height="42" rx="21" fill="#14251d" stroke="#4ade80"/>
<text x="460" y="223" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">训练时可再做容量限制与负载均衡</text>
</svg>
