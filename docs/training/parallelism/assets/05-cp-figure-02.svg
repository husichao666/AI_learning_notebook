<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Ring Attention：KV 在环上传递，online softmax 增量合并">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c93ff"/></marker></defs>
  <text x="20" y="24" fill="#eaeefb" font-size="13.5" font-weight="600">4 张卡组成环：各持 Q 分片不动，KV 分块顺时针传递</text>
  <!-- 4 nodes in a ring -->
  <g font-size="11" text-anchor="middle">
    <circle cx="410" cy="80" r="34" fill="#161922" stroke="#5b6bb0"/><text x="410" y="76" fill="#aab6ff">卡0</text><text x="410" y="92" fill="#9aa3b2" font-size="9.5">Q0·KV→</text>
    <circle cx="560" cy="140" r="34" fill="#161922" stroke="#5b6bb0"/><text x="560" y="136" fill="#aab6ff">卡1</text><text x="560" y="152" fill="#9aa3b2" font-size="9.5">Q1·KV→</text>
    <circle cx="410" cy="200" r="34" fill="#161922" stroke="#5b6bb0"/><text x="410" y="196" fill="#aab6ff">卡2</text><text x="410" y="212" fill="#9aa3b2" font-size="9.5">Q2·KV→</text>
    <circle cx="260" cy="140" r="34" fill="#161922" stroke="#5b6bb0"/><text x="260" y="136" fill="#aab6ff">卡3</text><text x="260" y="152" fill="#9aa3b2" font-size="9.5">Q3·KV→</text>
  </g>
  <!-- ring arrows -->
  <path d="M442,92 Q500,100 532,120" fill="none" stroke="#7c93ff" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M548,172 Q480,196 442,196" fill="none" stroke="#7c93ff" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M378,196 Q300,188 272,168" fill="none" stroke="#7c93ff" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M272,112 Q340,84 376,80" fill="none" stroke="#7c93ff" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- online softmax box -->
  <rect x="20" y="60" width="190" height="110" rx="10" fill="rgba(74,222,128,0.08)" stroke="#4ade80"/>
  <text x="115" y="84" text-anchor="middle" fill="#bbf7d0" font-size="12.5" font-weight="700">online softmax</text>
  <text x="115" y="106" text-anchor="middle" fill="#86efac" font-size="11">每收一块 KV：</text>
  <text x="115" y="124" text-anchor="middle" fill="#9aa3b2" font-size="10.5">更新 running max m</text>
  <text x="115" y="140" text-anchor="middle" fill="#9aa3b2" font-size="10.5">更新 running sum ℓ</text>
  <text x="115" y="158" text-anchor="middle" fill="#9aa3b2" font-size="10.5">增量累加输出 O</text>
  <text x="20" y="216" fill="#9aa3b2" font-size="12">转一圈后，每张卡的 Q 都「见过」全部 KV，得到与完整注意力数值相同的结果——但从不物化完整序列。</text>
</svg>
