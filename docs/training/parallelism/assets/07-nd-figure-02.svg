<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="并行选型决策树">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="320" y="20" width="180" height="38" rx="9" fill="#1c2030" stroke="#7c93ff"/><text x="410" y="44" fill="#cdd5ff">模型放得下单卡？</text>
    <!-- yes -> DP/FSDP -->
    <rect x="60" y="90" width="200" height="42" rx="9" fill="rgba(74,222,128,0.10)" stroke="#4ade80"/><text x="160" y="108" fill="#bbf7d0">放得下 → DP / FSDP</text><text x="160" y="124" fill="#86efac" font-size="10.5">显存够 DP；不够上 FSDP</text>
    <!-- no -> TP -->
    <rect x="560" y="90" width="200" height="42" rx="9" fill="rgba(124,147,255,0.12)" stroke="#7c93ff"/><text x="660" y="108" fill="#cdd5ff">放不下 → 加 TP</text><text x="660" y="124" fill="#9aa3b2" font-size="10.5">单层太大，机内 NVLink</text>
    <line x1="370" y1="58" x2="200" y2="86" stroke="#64748b" marker-end="url(#a)"/><text x="250" y="74" fill="#86efac" font-size="10">是</text>
    <line x1="450" y1="58" x2="650" y2="86" stroke="#64748b" marker-end="url(#a)"/><text x="560" y="74" fill="#fbbf24" font-size="10">否</text>
    <!-- next layer -->
    <rect x="290" y="160" width="240" height="38" rx="9" fill="#1c2030" stroke="#475569"/><text x="410" y="184" fill="#d7dbe4">还是放不下 / 层数很多？</text>
    <line x1="660" y1="132" x2="470" y2="158" stroke="#64748b" marker-end="url(#a)"/>
    <rect x="120" y="226" width="180" height="42" rx="9" fill="rgba(124,147,255,0.12)" stroke="#7c93ff"/><text x="210" y="244" fill="#cdd5ff">层多 → 加 PP</text><text x="210" y="260" fill="#9aa3b2" font-size="10.5">跨节点</text>
    <rect x="320" y="226" width="170" height="42" rx="9" fill="rgba(124,147,255,0.12)" stroke="#7c93ff"/><text x="405" y="244" fill="#cdd5ff">序列长 → 加 CP</text><text x="405" y="260" fill="#9aa3b2" font-size="10.5">超长上下文</text>
    <rect x="510" y="226" width="170" height="42" rx="9" fill="rgba(255,138,76,0.12)" stroke="#ff8a4c"/><text x="595" y="244" fill="#ffd9a8">MoE → 加 EP</text><text x="595" y="260" fill="#9aa3b2" font-size="10.5">专家切卡</text>
    <line x1="360" y1="198" x2="230" y2="222" stroke="#64748b" marker-end="url(#a)"/>
    <line x1="410" y1="198" x2="405" y2="222" stroke="#64748b" marker-end="url(#a)"/>
    <line x1="460" y1="198" x2="580" y2="222" stroke="#64748b" marker-end="url(#a)"/>
  </g>
  <text x="410" y="292" text-anchor="middle" fill="#9aa3b2" font-size="11.5">叠加顺序通常：FSDP/DP（外）→ PP → TP/EP（内）→ 长序列叠 CP。逐个加，每加一维都重新评估显存与吞吐。</text>
</svg>
