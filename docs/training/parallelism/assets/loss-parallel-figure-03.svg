<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 348" role="img" aria-label="单 token、V=16、tp=2 的 loss parallel 完整流程示意">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Left: the 16x1 logit column ===== -->
  <text x="120" y="22" text-anchor="middle" fill="#eaeefb" font-size="12.5" font-weight="600">① 一个 token 的 logits</text>
  <text x="120" y="40" text-anchor="middle" fill="#9aa3b2" font-size="11">z ∈ ℝ¹⁶</text>

  <!-- rank tabs -->
  <rect x="82" y="64" width="7" height="128" fill="#7c93ff" opacity="0.55"/>
  <rect x="82" y="192" width="7" height="128" fill="#ff8a4c" opacity="0.55"/>
  <text transform="rotate(-90 70 128)" x="70" y="128" text-anchor="middle" fill="#aab6ff" font-size="11" font-weight="600">rank 0 · idx 0–7</text>
  <text transform="rotate(-90 70 256)" x="70" y="256" text-anchor="middle" fill="#ff9c63" font-size="11" font-weight="600">rank 1 · idx 8–15</text>

  <!-- 16 cells: values [1,3,0,2,1,4,0,1, 2,0,5,1,3,2,0,1] -->
  <!-- rank0 -->
  <rect x="100" y="64"  width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="76"  text-anchor="end" fill="#7c8499" font-size="10">0</text><text x="127" y="76"  text-anchor="middle" fill="#d7dbe4" font-size="11">1</text>
  <rect x="100" y="80"  width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="92"  text-anchor="end" fill="#7c8499" font-size="10">1</text><text x="127" y="92"  text-anchor="middle" fill="#d7dbe4" font-size="11">3</text>
  <rect x="100" y="96"  width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="108" text-anchor="end" fill="#7c8499" font-size="10">2</text><text x="127" y="108" text-anchor="middle" fill="#d7dbe4" font-size="11">0</text>
  <rect x="100" y="112" width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="124" text-anchor="end" fill="#7c8499" font-size="10">3</text><text x="127" y="124" text-anchor="middle" fill="#d7dbe4" font-size="11">2</text>
  <rect x="100" y="128" width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="140" text-anchor="end" fill="#7c8499" font-size="10">4</text><text x="127" y="140" text-anchor="middle" fill="#d7dbe4" font-size="11">1</text>
  <rect x="100" y="144" width="54" height="16" fill="rgba(124,147,255,0.20)" stroke="#7c93ff"/><text x="92" y="156" text-anchor="end" fill="#7c8499" font-size="10">5</text><text x="127" y="156" text-anchor="middle" fill="#cdd5ff" font-size="11" font-weight="700">4</text>
  <rect x="100" y="160" width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="172" text-anchor="end" fill="#7c8499" font-size="10">6</text><text x="127" y="172" text-anchor="middle" fill="#d7dbe4" font-size="11">0</text>
  <rect x="100" y="176" width="54" height="16" fill="rgba(124,147,255,0.13)" stroke="#5b6bb0"/><text x="92" y="188" text-anchor="end" fill="#7c8499" font-size="10">7</text><text x="127" y="188" text-anchor="middle" fill="#d7dbe4" font-size="11">1</text>
  <!-- rank1 -->
  <rect x="100" y="192" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="204" text-anchor="end" fill="#7c8499" font-size="10">8</text><text x="127" y="204" text-anchor="middle" fill="#d7dbe4" font-size="11">2</text>
  <rect x="100" y="208" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="220" text-anchor="end" fill="#7c8499" font-size="10">9</text><text x="127" y="220" text-anchor="middle" fill="#d7dbe4" font-size="11">0</text>
  <rect x="100" y="224" width="54" height="16" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/><text x="92" y="236" text-anchor="end" fill="#7c8499" font-size="10">10</text><text x="127" y="236" text-anchor="middle" fill="#ffd9a8" font-size="11" font-weight="700">5</text>
  <rect x="100" y="240" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="252" text-anchor="end" fill="#7c8499" font-size="10">11</text><text x="127" y="252" text-anchor="middle" fill="#d7dbe4" font-size="11">1</text>
  <rect x="100" y="256" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="268" text-anchor="end" fill="#7c8499" font-size="10">12</text><text x="127" y="268" text-anchor="middle" fill="#d7dbe4" font-size="11">3</text>
  <rect x="100" y="272" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="284" text-anchor="end" fill="#7c8499" font-size="10">13</text><text x="127" y="284" text-anchor="middle" fill="#d7dbe4" font-size="11">2</text>
  <rect x="100" y="288" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="300" text-anchor="end" fill="#7c8499" font-size="10">14</text><text x="127" y="300" text-anchor="middle" fill="#d7dbe4" font-size="11">0</text>
  <rect x="100" y="304" width="54" height="16" fill="rgba(255,138,76,0.13)" stroke="#b9703f"/><text x="92" y="316" text-anchor="end" fill="#7c8499" font-size="10">15</text><text x="127" y="316" text-anchor="middle" fill="#d7dbe4" font-size="11">1</text>

  <!-- split divider + target marker -->
  <line x1="82" y1="192" x2="158" y2="192" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="99" y="255" width="56" height="18" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="160" y="262" fill="#fbbf24" font-size="10">◀ target</text>
  <text x="160" y="274" fill="#fbbf24" font-size="10">t = 12 (z=3)</text>

  <!-- corridor: split arrow -->
  <text x="161" y="118" fill="#9aa3b2" font-size="10.5">每个 rank</text>
  <text x="161" y="132" fill="#9aa3b2" font-size="10.5">只看本地 8 维</text>
  <line x1="160" y1="150" x2="226" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- ===== Right: 3-row reduction pipeline ===== -->
  <!-- column headers -->
  <text x="319" y="44" text-anchor="middle" fill="#aab6ff" font-size="11" font-weight="600">rank 0 本地（idx 0–7）</text>
  <text x="477" y="44" text-anchor="middle" fill="#ff9c63" font-size="11" font-weight="600">rank 1 本地（idx 8–15）</text>
  <text x="625" y="44" text-anchor="middle" fill="#9aa3b2" font-size="11" font-weight="600">跨 rank 归约</text>
  <text x="777" y="44" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">结果</text>

  <!-- stage numbers -->
  <text x="232" y="86"  text-anchor="middle" fill="#7c93ff" font-size="14" font-weight="700">②</text>
  <text x="232" y="147" text-anchor="middle" fill="#7c93ff" font-size="14" font-weight="700">③</text>
  <text x="232" y="211" text-anchor="middle" fill="#7c93ff" font-size="14" font-weight="700">④</text>

  <!-- Row ② max -->
  <rect x="248" y="58" width="146" height="46" rx="8" fill="rgba(124,147,255,0.10)" stroke="#5b6bb0"/>
  <text x="321" y="78" text-anchor="middle" fill="#d7dbe4" font-size="11.5">m₀ = max(z[0:8])</text>
  <text x="321" y="95" text-anchor="middle" fill="#cdd5ff" font-size="11.5" font-weight="700">= 4</text>
  <rect x="406" y="58" width="146" height="46" rx="8" fill="rgba(255,138,76,0.10)" stroke="#b9703f"/>
  <text x="479" y="78" text-anchor="middle" fill="#d7dbe4" font-size="11.5">m₁ = max(z[8:16])</text>
  <text x="479" y="95" text-anchor="middle" fill="#ffd9a8" font-size="11.5" font-weight="700">= 5</text>
  <rect x="564" y="58" width="124" height="46" rx="8" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/>
  <text x="626" y="79" text-anchor="middle" fill="#cdd5ff" font-size="11.5" font-weight="600">all-reduce MAX</text>
  <text x="626" y="95" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">m = 5</text>

  <!-- Row ③ predicted -->
  <rect x="248" y="116" width="146" height="52" rx="8" fill="rgba(124,147,255,0.10)" stroke="#5b6bb0"/>
  <text x="321" y="138" text-anchor="middle" fill="#d7dbe4" font-size="11.5">t=12 ∉ [0,8)</text>
  <text x="321" y="156" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="600">mask → 贡献 0</text>
  <rect x="406" y="116" width="146" height="52" rx="8" fill="rgba(255,138,76,0.10)" stroke="#b9703f"/>
  <text x="479" y="138" text-anchor="middle" fill="#d7dbe4" font-size="11.5">t=12 ∈ [8,16)</text>
  <text x="479" y="156" text-anchor="middle" fill="#ffd9a8" font-size="11.5" font-weight="600">本地 idx 4 → z=3</text>
  <rect x="564" y="116" width="124" height="52" rx="8" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/>
  <text x="626" y="139" text-anchor="middle" fill="#cdd5ff" font-size="11.5" font-weight="600">all-reduce SUM</text>
  <text x="626" y="157" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">z_t = 0 + 3 = 3</text>

  <!-- Row ④ sum-exp -->
  <rect x="248" y="180" width="146" height="52" rx="8" fill="rgba(124,147,255,0.10)" stroke="#5b6bb0"/>
  <text x="321" y="202" text-anchor="middle" fill="#d7dbe4" font-size="11.5">s₀ = Σ e^(z−m)</text>
  <text x="321" y="220" text-anchor="middle" fill="#9aa3b2" font-size="11">本地 8 项</text>
  <rect x="406" y="180" width="146" height="52" rx="8" fill="rgba(255,138,76,0.10)" stroke="#b9703f"/>
  <text x="479" y="202" text-anchor="middle" fill="#d7dbe4" font-size="11.5">s₁ = Σ e^(z−m)</text>
  <text x="479" y="220" text-anchor="middle" fill="#9aa3b2" font-size="11">本地 8 项</text>
  <rect x="564" y="180" width="124" height="52" rx="8" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/>
  <text x="626" y="203" text-anchor="middle" fill="#cdd5ff" font-size="11.5" font-weight="600">all-reduce SUM</text>
  <text x="626" y="221" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">S = s₀ + s₁</text>

  <!-- arrows reduce -> loss -->
  <line x1="688" y1="81"  x2="700" y2="120" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="688" y1="142" x2="700" y2="142" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="688" y1="206" x2="700" y2="166" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr3)"/>

  <!-- loss box -->
  <rect x="702" y="104" width="150" height="80" rx="10" fill="rgba(74,222,128,0.10)" stroke="#4ade80"/>
  <text x="777" y="126" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="700">⑤ loss</text>
  <text x="777" y="146" text-anchor="middle" fill="#bbf7d0" font-size="11.5">= log S − (z_t − m)</text>
  <text x="777" y="164" text-anchor="middle" fill="#86efac" font-size="11.5">= log Σ e^z − z_t</text>
  <text x="777" y="180" text-anchor="middle" fill="#86efac" font-size="10">逐 token 标量</text>
</svg>
