<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-FSDP 通信与计算重叠时序</title>
  <desc id="desc">前向计算时预取下一层参数，反向计算时预取下一层反向所需参数，并在梯度就绪后执行 Reduce-Scatter。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="dependency-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1080" height="510" fill="#ffffff"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="32" y="34" fill="#0f172a" font-size="21" font-weight="700">通信与计算重叠时序</text>
    <text x="32" y="58" fill="#64748b" font-size="14">独立 CUDA stream 允许参数 All-Gather、梯度 Reduce-Scatter 与层计算并行推进</text>

    <!-- Forward panel -->
    <rect x="24" y="78" width="1032" height="166" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="107" fill="#0f172a" font-size="16" font-weight="700">前向</text>
    <line x1="184" y1="104" x2="1026" y2="104" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
    <text x="1006" y="94" fill="#64748b" font-size="12">时间</text>

    <text x="154" y="151" fill="#475569" font-size="13" font-weight="600" text-anchor="end">计算 stream</text>
    <text x="154" y="205" fill="#475569" font-size="13" font-weight="600" text-anchor="end">参数 AG stream</text>

    <g filter="url(#shadow)">
      <rect x="205" y="126" width="205" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="455" y="126" width="205" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="705" y="126" width="205" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>

      <rect x="320" y="180" width="90" height="38" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
      <rect x="570" y="180" width="90" height="38" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
    </g>

    <g fill="#1e3a8a" font-size="14" font-weight="700" text-anchor="middle">
      <text x="307.5" y="150">Layer 0 forward</text>
      <text x="557.5" y="150">Layer 1 forward</text>
      <text x="807.5" y="150">Layer 2 forward</text>
    </g>
    <g fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">
      <text x="365" y="204">AG Layer 1</text>
      <text x="615" y="204">AG Layer 2</text>
    </g>

    <path d="M410 198 C432 198 432 170 449 153" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M660 198 C682 198 682 170 699 153" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>

    <text x="1038" y="203" fill="#64748b" font-size="12" text-anchor="end">计算当前层时，预取下一层参数</text>

    <!-- Backward panel -->
    <rect x="24" y="258" width="1032" height="204" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="287" fill="#0f172a" font-size="16" font-weight="700">反向</text>
    <line x1="184" y1="284" x2="1026" y2="284" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
    <text x="1006" y="274" fill="#64748b" font-size="12">时间</text>

    <text x="154" y="325" fill="#475569" font-size="13" font-weight="600" text-anchor="end">参数 AG stream</text>
    <text x="154" y="379" fill="#475569" font-size="13" font-weight="600" text-anchor="end">计算 stream</text>
    <text x="154" y="433" fill="#475569" font-size="13" font-weight="600" text-anchor="end">梯度 RS stream</text>

    <g filter="url(#shadow)">
      <rect x="190" y="300" width="110" height="38" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
      <rect x="380" y="300" width="95" height="38" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
      <rect x="590" y="300" width="95" height="38" rx="7" fill="#fef3c7" stroke="#f59e0b"/>

      <rect x="320" y="354" width="175" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="520" y="354" width="175" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="720" y="354" width="175" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>

      <rect x="520" y="408" width="115" height="38" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="720" y="408" width="115" height="38" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="915" y="408" width="115" height="38" rx="7" fill="#dcfce7" stroke="#4ade80"/>
    </g>

    <g fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">
      <text x="245" y="324">AG Layer 2</text>
      <text x="427.5" y="324">AG Layer 1</text>
      <text x="637.5" y="324">AG Layer 0</text>
    </g>
    <g fill="#1e3a8a" font-size="14" font-weight="700" text-anchor="middle">
      <text x="407.5" y="378">Layer 2 backward</text>
      <text x="607.5" y="378">Layer 1 backward</text>
      <text x="807.5" y="378">Layer 0 backward</text>
    </g>
    <g fill="#166534" font-size="13" font-weight="700" text-anchor="middle">
      <text x="577.5" y="432">RS Layer 2</text>
      <text x="777.5" y="432">RS Layer 1</text>
      <text x="972.5" y="432">RS Layer 0</text>
    </g>

    <path d="M300 319 C311 319 310 355 316 368" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M475 319 C501 319 501 346 516 367" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M685 319 C701 319 701 348 716 367" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>

    <g font-size="12">
      <rect x="31" y="478" width="15" height="15" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="53" y="490" fill="#475569">层计算</text>
      <rect x="121" y="478" width="15" height="15" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="143" y="490" fill="#475569">参数 All-Gather</text>
      <rect x="279" y="478" width="15" height="15" rx="3" fill="#dcfce7" stroke="#4ade80"/>
      <text x="301" y="490" fill="#475569">梯度 Reduce-Scatter</text>
      <text x="1038" y="490" fill="#64748b" text-anchor="end">虚线表示：参数收集完成后，对应层才能开始计算</text>
    </g>
  </g>
</svg>
