  <rect x="500" y="13" width="15" height="14" fill="rgba(168,139,250,0.24)" stroke="#a78bfa"/><text x="521" y="25" fill="#9aa3b2" font-size="12.5">激活</text>
  <rect x="612" y="13" width="15" height="14" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-dasharray="3 2"/><text x="633" y="25" fill="#9aa3b2" font-size="12.5">all-gather 峰值</text>
  <g font-size="14">
    <text x="20" y="90" fill="#d7dbe4">N=1</text>
    <rect x="150" y="66" width="400" height="34" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/><text x="350" y="88" text-anchor="middle" fill="#ffd0ad" font-size="12.5">静态 18P</text>
    <rect x="550" y="66" width="200" height="34" fill="rgba(168,139,250,0.24)" stroke="#a78bfa"/><text x="650" y="88" text-anchor="middle" fill="#c4b5fd" font-size="12.5">激活</text>
