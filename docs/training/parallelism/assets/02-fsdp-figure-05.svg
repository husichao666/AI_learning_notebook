    <rect x="150" y="126" width="50"  height="34" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/><text x="175" y="148" text-anchor="middle" fill="#ffd0ad" font-size="11">2.25P</text>
    <rect x="200" y="126" width="200" height="34" fill="rgba(168,139,250,0.24)" stroke="#a78bfa"/><text x="300" y="148" text-anchor="middle" fill="#c4b5fd" font-size="12.5">激活（配置不变时）</text>
    <rect x="400" y="126" width="50"  height="34" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-dasharray="3 2"/><text x="425" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">峰值</text>
  </g>
  <text x="20" y="188" fill="#9aa3b2" font-size="13.5">模型状态理想项随 N 缩小（橙 18P→2.25P）；local batch、SP/CP 与重计算不变时，激活项不自动缩小（紫）。</text>
