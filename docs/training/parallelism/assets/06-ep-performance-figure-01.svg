<text x="450" y="26" fill="#eaeefb" font-size="16" font-weight="700" text-anchor="middle">标准 A2A：通信算子看不到 expert 语义</text>
<rect x="25" y="62" width="135" height="50" rx="8" fill="#6f57bd"/><text x="92" y="92" fill="#fff" font-size="12" text-anchor="middle">routing_map</text>
<rect x="185" y="62" width="150" height="50" rx="8" fill="#b9703f"/><text x="260" y="84" fill="#fff" font-size="12" text-anchor="middle">按目标 rank</text><text x="260" y="101" fill="#fff" font-size="12" text-anchor="middle">permute</text>
<rect x="360" y="62" width="150" height="50" rx="8" fill="#293b91"/><text x="435" y="92" fill="#fff" font-size="12" text-anchor="middle">NCCL A2A</text>
<rect x="535" y="62" width="150" height="50" rx="8" fill="#b9703f"/><text x="610" y="84" fill="#fff" font-size="12" text-anchor="middle">按 local expert</text><text x="610" y="101" fill="#fff" font-size="12" text-anchor="middle">permute</text>
<rect x="710" y="62" width="165" height="50" rx="8" fill="#1f7a4d"/><text x="792" y="92" fill="#fff" font-size="12" text-anchor="middle">Grouped GEMM</text>
<path d="M160 87H185M335 87H360M510 87H535M685 87H710" stroke="#9aa3b2" stroke-width="2"/>
<text x="450" y="151" fill="#9aa3b2" font-size="12.5" text-anchor="middle">两次重排、split metadata 和通信分别落地；跨节点时 NCCL 负责传输，但不知道多个目的 expert 是否属于同一节点。</text>
