<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 414" role="img" aria-labelledby="title desc">
<title id="title">末端 stage 延后输出投影 DW，利用前面 stage 的反向排空时间</title>
<desc id="desc">四个 GPU 各一行。最后一个 micro-batch 的反向 B4 从 GPU3 依次传到 GPU2、GPU1、GPU0。GPU3 发出梯度后，补算缓存的输出投影 DW1 到 DW4，同时其他 GPU 继续 B4。图示 DW 全部落入排空窗口的情况。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="780" height="414" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#334155">
<text x="20" y="28" font-size="17" text-anchor="start" fill="#334155" font-weight="600">GPU3 补做 DW 时，GPU2 → GPU1 → GPU0 仍在反向</text>
<path d="M130 55 H738" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="742" y="59" font-size="12" text-anchor="start" fill="#334155" font-weight="400">时间</text>
<rect x="250" y="87" width="360" height="245" rx="4" fill="#fffbeb" stroke="none"/>
<text x="430" y="79" font-size="13" text-anchor="middle" fill="#92611b" font-weight="400">前面各 stage 继续反向的时间</text>
<text x="20" y="125" font-size="14" text-anchor="start" fill="#334155" font-weight="600">GPU0</text>
<rect x="130" y="102" width="358" height="36" rx="4" fill="#f1f5f9" stroke="none"/>
<text x="310.0" y="125" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="400">…</text>
<rect x="490" y="102" width="120" height="36" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="550" y="125" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">B4</text>
<text x="20" y="185" font-size="14" text-anchor="start" fill="#334155" font-weight="600">GPU1</text>
<rect x="130" y="162" width="238" height="36" rx="4" fill="#f1f5f9" stroke="none"/>
<text x="250.0" y="185" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="400">…</text>
<rect x="370" y="162" width="120" height="36" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="430" y="185" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">B4</text>
<rect x="490" y="162" width="120" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="550.0" y="185" font-size="12" text-anchor="middle" fill="#94a3b8" font-weight="400">等待</text>
<path d="M490 162 V138" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
<text x="496" y="153" font-size="11" text-anchor="start" fill="#64748b" font-weight="400">传梯度</text>
<text x="20" y="245" font-size="14" text-anchor="start" fill="#334155" font-weight="600">GPU2</text>
<rect x="130" y="222" width="118" height="36" rx="4" fill="#f1f5f9" stroke="none"/>
<text x="190.0" y="245" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="400">…</text>
<rect x="250" y="222" width="120" height="36" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="310" y="245" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">B4</text>
<rect x="370" y="222" width="240" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="490.0" y="245" font-size="12" text-anchor="middle" fill="#94a3b8" font-weight="400">等待</text>
<path d="M370 222 V198" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
<text x="376" y="213" font-size="11" text-anchor="start" fill="#64748b" font-weight="400">传梯度</text>
<text x="20" y="305" font-size="14" text-anchor="start" fill="#334155" font-weight="600">GPU3</text>
<text x="76" y="305" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">末端</text>
<rect x="130" y="282" width="120" height="36" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="190" y="305" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">B4</text>
<path d="M250 282 V258" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
<text x="256" y="273" font-size="11" text-anchor="start" fill="#64748b" font-weight="400">传梯度</text>
<rect x="250" y="282" width="75" height="36" rx="4" fill="#fde5ba" stroke="#d2a35b"/>
<text x="287.5" y="305" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">DW1</text>
<rect x="325" y="282" width="75" height="36" rx="4" fill="#fde5ba" stroke="#d2a35b"/>
<text x="362.5" y="305" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">DW2</text>
<rect x="400" y="282" width="75" height="36" rx="4" fill="#fde5ba" stroke="#d2a35b"/>
<text x="437.5" y="305" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">DW3</text>
<rect x="475" y="282" width="75" height="36" rx="4" fill="#fde5ba" stroke="#d2a35b"/>
<text x="512.5" y="305" font-size="14" text-anchor="middle" fill="#334155" font-weight="400">DW4</text>
<rect x="550" y="282" width="60" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="580" y="305" font-size="12" text-anchor="middle" fill="#94a3b8" font-weight="400">等待</text>
<path d="M250 322 V344 H550 V322" fill="none" stroke="#c28b35"/>
<text x="400" y="364" font-size="13" text-anchor="middle" fill="#92611b" font-weight="400">补算缓存的输出投影 DW1–DW4</text>
<path d="M610 90 V332" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
<text x="628" y="180" font-size="13" text-anchor="start" fill="#334155" font-weight="400">反向与 DW</text>
<text x="628" y="202" font-size="13" text-anchor="start" fill="#334155" font-weight="400">全部完成后，</text>
<text x="628" y="230" font-size="13" text-anchor="start" fill="#334155" font-weight="400">完成梯度同步</text>
<text x="628" y="252" font-size="13" text-anchor="start" fill="#334155" font-weight="400">与参数更新</text>
<text x="20" y="392" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">B4：最后一个 micro-batch 的反向；GPU3 的 B4 不含输出投影 DW。</text>
<text x="20" y="409" font-size="12" text-anchor="start" fill="#64748b" font-weight="400">四卡、每卡一个 stage；更早任务省略，通信耗时忽略，块宽仅示意。</text>
</g></svg>
