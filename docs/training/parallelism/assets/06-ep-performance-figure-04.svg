<text x="450" y="25" fill="#eaeefb" font-size="16" font-weight="700" text-anchor="middle">同一 micro-batch：两条分支直到输出相加前都独立</text>
<text x="20" y="86" fill="#cdd5ff" font-size="12.5">主 stream</text>
<rect x="105" y="55" width="135" height="48" rx="8" fill="#b9703f"/><text x="172" y="84" fill="#fff" font-size="11.5" text-anchor="middle">Permute</text>
<rect x="240" y="55" width="175" height="48" rx="8" fill="#293b91"/><text x="327" y="84" fill="#fff" font-size="11.5" text-anchor="middle">Dispatch A2A</text>
<rect x="415" y="55" width="205" height="48" rx="8" fill="#1f7a4d"/><text x="517" y="84" fill="#fff" font-size="11.5" text-anchor="middle">Routed Expert GEMM</text>
<rect x="620" y="55" width="175" height="48" rx="8" fill="#293b91"/><text x="707" y="84" fill="#fff" font-size="11.5" text-anchor="middle">Combine A2A</text>
<text x="20" y="178" fill="#86efac" font-size="12.5">shared stream</text>
<rect x="105" y="147" width="135" height="48" rx="8" fill="#6f57bd"/><text x="172" y="176" fill="#fff" font-size="11.5" text-anchor="middle">TP AG / gate</text>
<rect x="240" y="147" width="175" height="48" rx="8" fill="#8a5a2e"/><text x="327" y="176" fill="#fff" font-size="11.5" text-anchor="middle">Shared FC1 + Act</text>
<rect x="620" y="147" width="175" height="48" rx="8" fill="#8a5a2e"/><text x="707" y="168" fill="#fff" font-size="11.5" text-anchor="middle">Shared FC2</text><text x="707" y="184" fill="#fff" font-size="11.5" text-anchor="middle">+ TP RS</text>
<path d="M240 122V208M415 122V208M620 122V208M795 122V208" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="810" y="101" width="70" height="48" rx="8" fill="#4b5563"/><text x="845" y="130" fill="#fff" font-size="11.5" text-anchor="middle">Add</text>
<path d="M795 79H845V101M795 171H845V149" fill="none" stroke="#9aa3b2" stroke-width="2"/>
<text x="450" y="246" fill="#9aa3b2" font-size="12.5" text-anchor="middle">Dispatch 启动后插入 shared FC1；Combine 启动后插入 shared FC2/TP 通信；最后只在 Add 前等待 shared stream。</text>
<text x="450" y="272" fill="#fbbf24" font-size="12.5" text-anchor="middle">绿色虚线表示可重叠窗口，不表示两条路径耗时一定相等。</text>
</svg>
