<defs><marker id="ov-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7c93ff"/></marker></defs>
<text x="460" y="32" fill="#eaeefb" font-size="19" font-weight="700" text-anchor="middle">一次 MoE 前向</text>

<rect x="20" y="82" width="112" height="82" rx="12" fill="#202a4c" stroke="#7c93ff"/>
<text x="76" y="115" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">输入</text>
<text x="76" y="143" fill="#cdd5ff" font-size="14" text-anchor="middle">tokens</text>

<rect x="158" y="82" width="154" height="82" rx="12" fill="#251e18" stroke="#b9703f"/>
<text x="235" y="115" fill="#ffcfaa" font-size="15" font-weight="700" text-anchor="middle">① Router</text>
<text x="235" y="143" fill="#fff" font-size="14" text-anchor="middle">为 token 选择专家</text>

<rect x="338" y="82" width="164" height="82" rx="12" fill="#17213b" stroke="#4967e8"/>
<text x="420" y="115" fill="#aab6ff" font-size="15" font-weight="700" text-anchor="middle">② Dispatch</text>
<text x="420" y="143" fill="#fff" font-size="14" text-anchor="middle">把 token 送到专家</text>

<rect x="528" y="82" width="154" height="82" rx="12" fill="#14251d" stroke="#4ade80"/>
<text x="605" y="115" fill="#86efac" font-size="15" font-weight="700" text-anchor="middle">③ Experts</text>
<text x="605" y="143" fill="#fff" font-size="14" text-anchor="middle">执行专家 MLP</text>

<rect x="708" y="82" width="192" height="82" rx="12" fill="#17213b" stroke="#4967e8"/>
<text x="804" y="115" fill="#aab6ff" font-size="15" font-weight="700" text-anchor="middle">④ Combine</text>
<text x="804" y="143" fill="#fff" font-size="14" text-anchor="middle">送回并合并结果</text>

<g stroke="#7c93ff" stroke-width="2.2" marker-end="url(#ov-arrow)">
<line x1="132" y1="123" x2="155" y2="123"/>
<line x1="312" y1="123" x2="335" y2="123"/>
<line x1="502" y1="123" x2="525" y2="123"/>
<line x1="682" y1="123" x2="705" y2="123"/>
</g>
<text x="460" y="205" fill="#9aa3b2" font-size="14" text-anchor="middle">选路 → 搬运 → 计算 → 还原</text>
