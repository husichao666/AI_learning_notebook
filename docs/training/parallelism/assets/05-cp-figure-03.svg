  <defs><marker id="u" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#9aa3b2"/></marker></defs>
  <!-- headers -->
  <text x="200" y="26" text-anchor="middle" fill="#eaeefb" font-size="13" font-weight="700">all-to-all 前：每卡 = 一段序列 × 全部 head</text>
  <text x="640" y="26" text-anchor="middle" fill="#eaeefb" font-size="13" font-weight="700">all-to-all 后：每卡 = 全序列 × 一个 head</text>
  <!-- LEFT grid: rows = cards, each cell colored by head-group (column) -->
  <!-- column headers h0..h3 -->
  <text x="95"  y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">head0</text>
  <text x="158" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">head1</text>
  <text x="221" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">head2</text>
  <text x="284" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">head3</text>
  <!-- rows -->
  <!-- row i cells: fill by column color -->
  <!-- card0 -->
  <text x="40" y="86" text-anchor="middle" fill="#aab6ff" font-size="11">卡0</text>
  <rect x="67"  y="70" width="58" height="30" rx="4" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="96"  y="89" text-anchor="middle" fill="#e6ebff" font-size="10">S0·h0</text>
