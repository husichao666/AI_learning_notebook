  <rect x="633" y="70" width="58" height="30" rx="4" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="662" y="89" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h0</text>
  <rect x="696" y="70" width="58" height="30" rx="4" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="725" y="89" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h0</text>
  <!-- card1 → head1 (green) -->
  <text x="480" y="122" text-anchor="middle" fill="#aab6ff" font-size="11">卡1</text>
  <rect x="507" y="106" width="58" height="30" rx="4" fill="rgba(74,222,128,0.20)" stroke="#4ade80"/><text x="536" y="125" text-anchor="middle" fill="#e6ebff" font-size="10">S0·h1</text>
  <rect x="570" y="106" width="58" height="30" rx="4" fill="rgba(74,222,128,0.20)" stroke="#4ade80"/><text x="599" y="125" text-anchor="middle" fill="#e6ebff" font-size="10">S1·h1</text>
  <rect x="633" y="106" width="58" height="30" rx="4" fill="rgba(74,222,128,0.20)" stroke="#4ade80"/><text x="662" y="125" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h1</text>
  <rect x="696" y="106" width="58" height="30" rx="4" fill="rgba(74,222,128,0.20)" stroke="#4ade80"/><text x="725" y="125" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h1</text>
  <!-- card2 → head2 (amber) -->
  <text x="480" y="158" text-anchor="middle" fill="#aab6ff" font-size="11">卡2</text>
  <rect x="507" y="142" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)" stroke="#fbbf24"/><text x="536" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S0·h2</text>
  <rect x="570" y="142" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)" stroke="#fbbf24"/><text x="599" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S1·h2</text>
  <rect x="633" y="142" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)" stroke="#fbbf24"/><text x="662" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h2</text>
  <rect x="696" y="142" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)" stroke="#fbbf24"/><text x="725" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h2</text>
  <!-- card3 → head3 (pink) -->
  <text x="480" y="194" text-anchor="middle" fill="#aab6ff" font-size="11">卡3</text>
  <rect x="507" y="178" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="536" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S0·h3</text>
  <rect x="570" y="178" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="599" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S1·h3</text>
  <rect x="633" y="178" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="662" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h3</text>
  <rect x="696" y="178" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="725" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h3</text>
  <!-- bottom flow note -->
  <text x="420" y="238" text-anchor="middle" fill="#9aa3b2" font-size="11.5">换轴后每卡握着完整序列的 1 个 head → 直接跑标准注意力 → 再来一次 all-to-all 换回「按序列切」</text>
  <rect x="150" y="256" width="540" height="44" rx="10" fill="rgba(74,222,128,0.06)" stroke="#4ade80"/>
  <text x="420" y="283" text-anchor="middle" fill="#bbf7d0" font-size="11.5">同一格记号 S<tspan baseline-shift="sub" font-size="8">i</tspan>·h<tspan baseline-shift="sub" font-size="8">j</tspan> = 第 i 段序列的第 j 个 head 的数据；通信前后数据没变，只是换了「谁持有它」</text>
</svg>
