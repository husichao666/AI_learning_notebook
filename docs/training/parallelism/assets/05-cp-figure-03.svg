  <rect x="256" y="106" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="285" y="125" text-anchor="middle" fill="#e6ebff" font-size="10">S1·h3</text>
  <!-- card2 -->
  <text x="40" y="158" text-anchor="middle" fill="#aab6ff" font-size="11">卡2</text>
