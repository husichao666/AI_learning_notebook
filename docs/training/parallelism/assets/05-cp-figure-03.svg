  <rect x="193" y="142" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)"  stroke="#fbbf24"/><text x="222" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h2</text>
  <rect x="256" y="142" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="285" y="161" text-anchor="middle" fill="#e6ebff" font-size="10">S2·h3</text>
  <!-- card3 -->
  <text x="40" y="194" text-anchor="middle" fill="#aab6ff" font-size="11">卡3</text>
  <rect x="67"  y="178" width="58" height="30" rx="4" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="96"  y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h0</text>
  <rect x="130" y="178" width="58" height="30" rx="4" fill="rgba(74,222,128,0.20)"  stroke="#4ade80"/><text x="159" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h1</text>
  <rect x="193" y="178" width="58" height="30" rx="4" fill="rgba(251,191,36,0.20)"  stroke="#fbbf24"/><text x="222" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h2</text>
  <rect x="256" y="178" width="58" height="30" rx="4" fill="rgba(244,114,182,0.20)" stroke="#f472b6"/><text x="285" y="197" text-anchor="middle" fill="#e6ebff" font-size="10">S3·h3</text>
  <!-- middle arrow -->
  <path d="M336,138 L484,138" fill="none" stroke="#9aa3b2" stroke-width="2" marker-end="url(#u)"/>
  <text x="410" y="128" text-anchor="middle" fill="#d7dbe4" font-size="12" font-weight="700">all-to-all</text>
  <text x="410" y="156" text-anchor="middle" fill="#9aa3b2" font-size="10">按 head 重新分发</text>
  <text x="410" y="172" text-anchor="middle" fill="#9aa3b2" font-size="10">（同色块聚到同一张卡）</text>
  <!-- RIGHT grid: rows = cards, each row single color (its head), columns = seq chunks -->
  <text x="535" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">seq0</text>
  <text x="598" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">seq1</text>
  <text x="661" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">seq2</text>
  <text x="724" y="58" text-anchor="middle" fill="#9aa3b2" font-size="10.5">seq3</text>
  <!-- card0 → head0 (blue) -->
  <text x="480" y="86" text-anchor="middle" fill="#aab6ff" font-size="11">卡0</text>
  <rect x="507" y="70" width="58" height="30" rx="4" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="536" y="89" text-anchor="middle" fill="#e6ebff" font-size="10">S0·h0</text>
