<defs>
  <marker id="ep-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7c93ff"/></marker>
  <linearGradient id="ep-comm" x1="0" x2="1"><stop offset="0" stop-color="#293b91"/><stop offset="1" stop-color="#1f6f66"/></linearGradient>
</defs>

<text x="450" y="30" fill="#eaeefb" font-size="18" font-weight="700" text-anchor="middle">双卡视角：token 如何 dispatch 到专家，再 combine 回来源卡</text>
<text x="450" y="54" fill="#9aa3b2" font-size="13" text-anchor="middle">token 名字表示来源卡，颜色和 “→E” 表示目标专家；星号表示 FFN 已计算</text>

<!-- 两张卡的泳道 -->
<rect x="24" y="72" width="412" height="1395" rx="16" fill="#11151f" stroke="#35436f"/>
<rect x="464" y="72" width="412" height="1395" rx="16" fill="#11151f" stroke="#35436f"/>
<rect x="24" y="72" width="412" height="58" rx="16" fill="#1a2340" stroke="#5b6bb0"/>
<rect x="464" y="72" width="412" height="58" rx="16" fill="#1a2340" stroke="#5b6bb0"/>
<text x="230" y="98" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">卡0</text>
<text x="230" y="119" fill="#aab6ff" font-size="12.5" text-anchor="middle">持有专家 E0 / E1　·　原生 token 以 a 开头</text>
<text x="670" y="98" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">卡1</text>
<text x="670" y="119" fill="#aab6ff" font-size="12.5" text-anchor="middle">持有专家 E2 / E3　·　原生 token 以 b 开头</text>

<!-- ① Router 后的本地 token -->
<text x="450" y="158" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">① Router 后：每张卡先拥有自己的原生 token</text>
<rect x="50" y="174" width="360" height="80" rx="12" fill="#161922" stroke="#2f3855"/>
<rect x="490" y="174" width="360" height="80" rx="12" fill="#161922" stroke="#2f3855"/>
<text x="70" y="198" fill="#9aa3b2" font-size="12">卡0 原始顺序</text>
<text x="510" y="198" fill="#9aa3b2" font-size="12">卡1 原始顺序</text>
<rect x="70" y="210" width="84" height="32" rx="8" fill="#b9703f"/><text x="112" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">a0 → E2</text>
<rect x="164" y="210" width="84" height="32" rx="8" fill="#3a56d4"/><text x="206" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">a1 → E0</text>
<rect x="258" y="210" width="84" height="32" rx="8" fill="#6f57bd"/><text x="300" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">a2 → E3</text>
<rect x="510" y="210" width="84" height="32" rx="8" fill="#1f7a4d"/><text x="552" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">b0 → E1</text>
<rect x="604" y="210" width="84" height="32" rx="8" fill="#b9703f"/><text x="646" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">b1 → E2</text>
<rect x="698" y="210" width="84" height="32" rx="8" fill="#3a56d4"/><text x="740" y="231" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">b2 → E0</text>

<line x1="230" y1="254" x2="230" y2="284" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<line x1="670" y1="254" x2="670" y2="284" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<text x="450" y="274" fill="#cdd5ff" font-size="13" font-weight="600" text-anchor="middle">本地 permute：按目标卡分桶</text>

<!-- ② 每卡各自 permute -->
<text x="450" y="310" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">② permute 后：明确哪些留本卡，哪些发往对端</text>
<rect x="50" y="326" width="360" height="126" rx="12" fill="#161922" stroke="#ff6b6b"/>
<rect x="490" y="326" width="360" height="126" rx="12" fill="#161922" stroke="#ff6b6b"/>
<text x="70" y="351" fill="#86efac" font-size="12.5" font-weight="700">留卡0</text>
<rect x="132" y="335" width="78" height="28" rx="7" fill="#3a56d4"/><text x="171" y="354" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a1 → E0</text>
<text x="70" y="392" fill="#ffb0b0" font-size="12.5" font-weight="700">发卡1</text>
<rect x="132" y="376" width="78" height="28" rx="7" fill="#b9703f"/><text x="171" y="395" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a0 → E2</text>
<rect x="220" y="376" width="78" height="28" rx="7" fill="#6f57bd"/><text x="259" y="395" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a2 → E3</text>
<text x="230" y="437" fill="#ffb0b0" font-size="12" text-anchor="middle">input_splits = [1, 2]</text>
<text x="510" y="351" fill="#ffb0b0" font-size="12.5" font-weight="700">发卡0</text>
<rect x="572" y="335" width="78" height="28" rx="7" fill="#3a56d4"/><text x="611" y="354" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b2 → E0</text>
<rect x="660" y="335" width="78" height="28" rx="7" fill="#1f7a4d"/><text x="699" y="354" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b0 → E1</text>
<text x="510" y="392" fill="#86efac" font-size="12.5" font-weight="700">留卡1</text>
<rect x="572" y="376" width="78" height="28" rx="7" fill="#b9703f"/><text x="611" y="395" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b1 → E2</text>
<text x="670" y="437" fill="#ffb0b0" font-size="12" text-anchor="middle">input_splits = [2, 1]</text>

<!-- dispatch 双向交换 -->
<rect x="50" y="475" width="800" height="132" rx="14" fill="url(#ep-comm)" stroke="#7c93ff" stroke-width="1.5"/>
<text x="450" y="503" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ALL-TO-ALL · DISPATCH</text>
<text x="450" y="525" fill="#dbe4ff" font-size="12.5" text-anchor="middle">只交换目标专家在对端的 token；留本卡的 token 不走网络</text>
<line x1="245" y1="551" x2="655" y2="551" stroke="#cdd5ff" stroke-width="2.2" marker-end="url(#ep-arrow)"/>
<rect x="365" y="535" width="72" height="28" rx="7" fill="#b9703f"/><text x="401" y="554" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a0 → E2</text>
<rect x="447" y="535" width="72" height="28" rx="7" fill="#6f57bd"/><text x="483" y="554" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a2 → E3</text>
<line x1="655" y1="582" x2="245" y2="582" stroke="#cdd5ff" stroke-width="2.2" marker-end="url(#ep-arrow)"/>
<rect x="365" y="568" width="72" height="28" rx="7" fill="#3a56d4"/><text x="401" y="587" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b2 → E0</text>
<rect x="447" y="568" width="72" height="28" rx="7" fill="#1f7a4d"/><text x="483" y="587" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b0 → E1</text>

<!-- ③ dispatch 后按专家收齐 -->
<text x="450" y="639" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">③ Dispatch 后：每张卡按本地专家收齐 token</text>
<rect x="50" y="655" width="360" height="148" rx="12" fill="#161922" stroke="#2f3855"/>
<rect x="490" y="655" width="360" height="148" rx="12" fill="#161922" stroke="#2f3855"/>
<rect x="70" y="676" width="320" height="50" rx="10" fill="#12151d" stroke="#3a56d4"/>
<text x="90" y="707" fill="#aab6ff" font-size="13" font-weight="700">E0</text>
<rect x="132" y="687" width="48" height="28" rx="7" fill="#3a56d4"/><text x="156" y="706" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a1</text>
<rect x="190" y="687" width="48" height="28" rx="7" fill="#3a56d4"/><text x="214" y="706" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b2</text>
<rect x="70" y="738" width="320" height="44" rx="10" fill="#12151d" stroke="#1f7a4d"/>
<text x="90" y="766" fill="#86efac" font-size="13" font-weight="700">E1</text>
<rect x="132" y="746" width="48" height="28" rx="7" fill="#1f7a4d"/><text x="156" y="765" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b0</text>
<rect x="510" y="676" width="320" height="50" rx="10" fill="#12151d" stroke="#b9703f"/>
<text x="530" y="707" fill="#ffcfaa" font-size="13" font-weight="700">E2</text>
<rect x="572" y="687" width="48" height="28" rx="7" fill="#b9703f"/><text x="596" y="706" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a0</text>
<rect x="630" y="687" width="48" height="28" rx="7" fill="#b9703f"/><text x="654" y="706" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">b1</text>
<rect x="510" y="738" width="320" height="44" rx="10" fill="#12151d" stroke="#6f57bd"/>
<text x="530" y="766" fill="#c4b5fd" font-size="13" font-weight="700">E3</text>
<rect x="572" y="746" width="48" height="28" rx="7" fill="#6f57bd"/><text x="596" y="765" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">a2</text>

<line x1="230" y1="803" x2="230" y2="837" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<line x1="670" y1="803" x2="670" y2="837" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<text x="450" y="825" fill="#cdd5ff" font-size="13" font-weight="600" text-anchor="middle">④ 本地 grouped GEMM：每个专家一次处理自己的 token 桶</text>

<!-- ④ 专家输出 -->
<text x="450" y="865" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">④ Expert FFN 后：输出仍按本地专家分组</text>
<rect x="50" y="881" width="360" height="112" rx="12" fill="#161922" stroke="#4ade80"/>
<rect x="490" y="881" width="360" height="112" rx="12" fill="#161922" stroke="#4ade80"/>
<text x="70" y="916" fill="#aab6ff" font-size="13" font-weight="700">E0 输出</text>
<rect x="146" y="899" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="173" y="919" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">a1*</text>
<rect x="210" y="899" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="237" y="919" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">b2*</text>
<text x="70" y="966" fill="#86efac" font-size="13" font-weight="700">E1 输出</text>
<rect x="146" y="949" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="173" y="969" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">b0*</text>
<text x="510" y="916" fill="#ffcfaa" font-size="13" font-weight="700">E2 输出</text>
<rect x="586" y="899" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="613" y="919" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">a0*</text>
<rect x="650" y="899" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="677" y="919" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">b1*</text>
<text x="510" y="966" fill="#c4b5fd" font-size="13" font-weight="700">E3 输出</text>
<rect x="586" y="949" width="54" height="30" rx="7" fill="#12351f" stroke="#4ade80"/><text x="613" y="969" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">a2*</text>

<!-- combine 反向归还 -->
<line x1="230" y1="993" x2="230" y2="1016" stroke="#7c93ff" stroke-width="2"/>
<line x1="670" y1="993" x2="670" y2="1016" stroke="#7c93ff" stroke-width="2"/>
<rect x="50" y="1018" width="800" height="132" rx="14" fill="url(#ep-comm)" stroke="#7c93ff" stroke-width="1.5"/>
<text x="450" y="1046" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ALL-TO-ALL · COMBINE</text>
<text x="450" y="1068" fill="#dbe4ff" font-size="12.5" text-anchor="middle">方向与 dispatch 相反：专家输出回到 token 的来源卡</text>
<line x1="245" y1="1094" x2="655" y2="1094" stroke="#cdd5ff" stroke-width="2.2" marker-end="url(#ep-arrow)"/>
<rect x="365" y="1080" width="62" height="28" rx="7" fill="#12351f" stroke="#4ade80"/><text x="396" y="1099" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">b2*</text>
<rect x="437" y="1080" width="62" height="28" rx="7" fill="#12351f" stroke="#4ade80"/><text x="468" y="1099" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">b0*</text>
<line x1="655" y1="1125" x2="245" y2="1125" stroke="#cdd5ff" stroke-width="2.2" marker-end="url(#ep-arrow)"/>
<rect x="365" y="1111" width="62" height="28" rx="7" fill="#12351f" stroke="#4ade80"/><text x="396" y="1130" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">a0*</text>
<rect x="437" y="1111" width="62" height="28" rx="7" fill="#12351f" stroke="#4ade80"/><text x="468" y="1130" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">a2*</text>

<line x1="230" y1="1150" x2="230" y2="1172" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<line x1="670" y1="1150" x2="670" y2="1172" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>

<!-- ⑤ combine 回来源卡，仍是 permute 顺序 -->
<text x="450" y="1194" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">⑤ Combine 后：输出回到来源卡，但仍是 permute 顺序</text>
<rect x="50" y="1210" width="360" height="88" rx="12" fill="#161922" stroke="#ff6b6b"/>
<rect x="490" y="1210" width="360" height="88" rx="12" fill="#161922" stroke="#ff6b6b"/>
<text x="70" y="1235" fill="#9aa3b2" font-size="12">卡0 combine buffer</text>
<text x="510" y="1235" fill="#9aa3b2" font-size="12">卡1 combine buffer</text>
<rect x="84" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="115" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a1*</text>
<rect x="156" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="187" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a0*</text>
<rect x="228" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="259" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a2*</text>
<rect x="524" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="555" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b2*</text>
<rect x="596" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="627" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b0*</text>
<rect x="668" y="1248" width="62" height="32" rx="8" fill="#12351f" stroke="#4ade80"/><text x="699" y="1269" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b1*</text>

<line x1="230" y1="1298" x2="230" y2="1330" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<line x1="670" y1="1298" x2="670" y2="1330" stroke="#7c93ff" stroke-width="2" marker-end="url(#ep-arrow)"/>
<text x="450" y="1318" fill="#cdd5ff" font-size="13" font-weight="600" text-anchor="middle">⑥ 本地 unpermute：按保存的映射恢复原始 token 顺序</text>

<!-- ⑥ 恢复原序 -->
<text x="450" y="1354" fill="#eaeefb" font-size="15.5" font-weight="700" text-anchor="middle">⑥ Unpermute 后：两张卡分别得到原顺序输出</text>
<rect x="50" y="1370" width="360" height="78" rx="12" fill="#10251a" stroke="#4ade80"/>
<rect x="490" y="1370" width="360" height="78" rx="12" fill="#10251a" stroke="#4ade80"/>
<text x="70" y="1395" fill="#9aa3b2" font-size="12">卡0：a0 → a1 → a2</text>
<text x="510" y="1395" fill="#9aa3b2" font-size="12">卡1：b0 → b1 → b2</text>
<rect x="84" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="115" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a0*</text>
<rect x="156" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="187" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a1*</text>
<rect x="228" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="259" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">a2*</text>
<rect x="524" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="555" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b0*</text>
<rect x="596" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="627" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b1*</text>
<rect x="668" y="1405" width="62" height="30" rx="8" fill="#12351f" stroke="#4ade80"/><text x="699" y="1425" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">b2*</text>

<text x="450" y="1485" fill="#86efac" font-size="13" text-anchor="middle">dispatch 按目标专家发送；combine 按 token 来源返回；unpermute 只负责恢复本地原序。</text>
</svg>
