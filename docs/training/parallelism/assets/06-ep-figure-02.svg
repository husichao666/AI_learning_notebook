<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-label="双卡视角 EP 完整往返：卡0 与卡1 的 token 经 permute、all-to-all dispatch、专家 FFN、all-to-all combine 和 unpermute 后各自回到来源卡">
