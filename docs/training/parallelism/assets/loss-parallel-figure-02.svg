<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 376" role="img" aria-label="Loss Parallel 前向通信流：三次小张量 all-reduce">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- lane headers -->
  <text x="245" y="22" text-anchor="middle" fill="#9aa3b2" font-size="13" font-weight="700">TP rank 0</text>
  <text x="635" y="22" text-anchor="middle" fill="#9aa3b2" font-size="13" font-weight="700">其余 TP rank …</text>

  <!-- Stage A: local max -->
  <rect x="130" y="34" width="230" height="44" rx="9" fill="#1c2030" stroke="#475569"/>
  <text x="245" y="61" text-anchor="middle" fill="#d7dbe4" font-size="13">局部 max：mᵣ = max(z)</text>
  <rect x="520" y="34" width="230" height="44" rx="9" fill="#1c2030" stroke="#475569"/>
  <text x="635" y="61" text-anchor="middle" fill="#d7dbe4" font-size="13">局部 max：mᵣ = max(z)</text>
  <line x1="245" y1="78" x2="245" y2="96" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="635" y1="78" x2="635" y2="96" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Reduce bar 1 -->
  <rect x="130" y="98" width="620" height="38" rx="10" fill="rgba(124,147,255,0.16)" stroke="#7c93ff"/>
  <text x="440" y="122" text-anchor="middle" fill="#cdd5ff" font-size="13.5" font-weight="600">all-reduce(MAX)  →  全局 m   ·   [B, S]</text>
  <line x1="245" y1="136" x2="245" y2="154" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="635" y1="136" x2="635" y2="154" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Stage B: local predicted + sum-exp -->
  <rect x="130" y="156" width="230" height="54" rx="9" fill="#1c2030" stroke="#475569"/>
  <text x="245" y="178" text-anchor="middle" fill="#d7dbe4" font-size="12.5">z_t（mask 非本地 → 0）</text>
  <text x="245" y="197" text-anchor="middle" fill="#d7dbe4" font-size="12.5">局部 Σ exp(z − m)</text>
  <rect x="520" y="156" width="230" height="54" rx="9" fill="#1c2030" stroke="#475569"/>
  <text x="635" y="178" text-anchor="middle" fill="#d7dbe4" font-size="12.5">z_t（mask 非本地 → 0）</text>
  <text x="635" y="197" text-anchor="middle" fill="#d7dbe4" font-size="12.5">局部 Σ exp(z − m)</text>
  <line x1="245" y1="210" x2="245" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="635" y1="210" x2="635" y2="228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Reduce bar 2 -->
  <rect x="130" y="230" width="620" height="38" rx="10" fill="rgba(124,147,255,0.16)" stroke="#7c93ff"/>
  <text x="440" y="254" text-anchor="middle" fill="#cdd5ff" font-size="13.5" font-weight="600">all-reduce(SUM)  →  全局 z_t , Σexp   ·   [B, S]</text>
  <line x1="440" y1="268" x2="440" y2="288" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Result -->
  <rect x="210" y="290" width="440" height="58" rx="10" fill="rgba(74,222,128,0.10)" stroke="#4ade80"/>
  <text x="430" y="314" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="600">loss = log(Σexp) − z_t</text>
  <text x="430" y="334" text-anchor="middle" fill="#86efac" font-size="12.5">逐 token 统计量 · 交叉熵算子反向无词表维通信</text>
</svg>
