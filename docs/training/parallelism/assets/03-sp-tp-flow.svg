<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" role="img" aria-labelledby="title desc">
<title id="title">TP 的 MLP 前向流程，T=2</title>
<desc id="desc">蓝色块表示前半序列，橙色块表示后半序列。两卡均对完整序列执行 Norm；MLP 分片计算后 all-reduce，两卡对完整结果执行 Dropout 和残差加法。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#64748b"/></marker></defs>
