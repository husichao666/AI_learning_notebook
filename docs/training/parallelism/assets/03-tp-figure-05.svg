<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-label="Megatron Sequence Parallel 在序列分片布局与张量并行布局之间转换">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"]{fill:#92400e}
  [fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"]{fill:#f8fafc}
  rect[fill="#17213b"],rect[fill="#26336b"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#14251d"]{fill:#dcfce7}
  rect[fill="#402d21"],rect[fill="#251e18"]{fill:#ffedd5}
  rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,.03)"]{fill:rgba(15,23,42,.04)}
  [stroke="#2f3650"],[stroke="#313747"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="sparr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="29" fill="#eaeefb" font-size="17" font-weight="700">Megatron SP：在同一个 TP 组内切换两种激活布局</text>
  <text x="20" y="54" fill="#9aa3b2" font-size="12.5">示意：TP = 2；左侧逐 token 区域只保存本地序列，中央 Column → Row 区域按 hidden/head 分工</text>

  <!-- Sequence-parallel input region. -->
  <rect x="20" y="82" width="205" height="300" rx="12" fill="rgba(74,222,128,.07)" stroke="#4ade80"/>
  <text x="122" y="109" text-anchor="middle" fill="#bbf7d0" font-size="13.5" font-weight="700">序列并行区域</text>
  <text x="122" y="129" text-anchor="middle" fill="#9aa3b2" font-size="11">Norm 后 · 每卡常驻 1/2 序列</text>

  <rect x="39" y="157" width="167" height="75" rx="8" fill="#12351f" stroke="#4ade80"/>
  <rect x="49" y="174" width="40" height="40" rx="4" fill="rgba(124,147,255,.22)" stroke="#7c93ff"/>
  <text x="69" y="198" text-anchor="middle" fill="#cdd5ff" font-size="11.5">前半</text>
  <text x="99" y="181" fill="#bbf7d0" font-size="12.5" font-weight="700">TP rank 0</text>
  <text x="99" y="203" fill="#9aa3b2" font-size="11.5">Y₀ˢ</text>
  <text x="99" y="220" fill="#9aa3b2" font-size="10.5">S/2 × B × H</text>

  <rect x="39" y="260" width="167" height="75" rx="8" fill="#402d21" stroke="#ff8a4c"/>
  <rect x="49" y="277" width="40" height="40" rx="4" fill="rgba(255,138,76,.18)" stroke="#ff8a4c"/>
  <text x="69" y="301" text-anchor="middle" fill="#ffd9a8" font-size="11.5">后半</text>
  <text x="99" y="284" fill="#ffd9a8" font-size="12.5" font-weight="700">TP rank 1</text>
  <text x="99" y="306" fill="#9aa3b2" font-size="11.5">Y₁ˢ</text>
  <text x="99" y="323" fill="#9aa3b2" font-size="10.5">S/2 × B × H</text>

  <!-- All-gather conversion. -->
  <path d="M206 194H244V214H266" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <path d="M206 297H244V252H266" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <rect x="276" y="191" width="130" height="86" rx="10" fill="#251e18" stroke="#fbbf24"/>
  <text x="341" y="218" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">all-gather(S)</text>
  <text x="341" y="240" text-anchor="middle" fill="#9aa3b2" font-size="11.5">拼出全部 token</text>
  <text x="341" y="259" text-anchor="middle" fill="#9aa3b2" font-size="11">Y：S × B × H</text>

  <!-- Tensor-parallel region. -->
  <path d="M406 234H428" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <rect x="438" y="82" width="287" height="300" rx="12" fill="rgba(124,147,255,.07)" stroke="#7c93ff"/>
  <text x="581" y="109" text-anchor="middle" fill="#cdd5ff" font-size="13.5" font-weight="700">张量并行区域：Column → Row</text>
  <text x="581" y="129" text-anchor="middle" fill="#9aa3b2" font-size="11">每卡处理全部 token，但只负责自己的 hidden/head 分片</text>

  <path d="M428 234H447V194H463" fill="none" stroke="#64748b" marker-end="url(#sparr)"/>
  <path d="M447 234V297H463" fill="none" stroke="#64748b" marker-end="url(#sparr)"/>
  <circle cx="447" cy="234" r="3" fill="#64748b"/>

  <rect x="473" y="151" width="232" height="86" rx="8" fill="#17213b" stroke="#7c93ff"/>
  <text x="489" y="176" fill="#cdd5ff" font-size="12.5" font-weight="700">TP rank 0 · 全部 S 个 token</text>
  <text x="489" y="198" fill="#9aa3b2" font-size="11.5">Column/Core：hidden/head 分片 0</text>
  <text x="489" y="219" fill="#9aa3b2" font-size="11.5">Row 输出：部分和 P₀ [S,B,H]</text>

  <rect x="473" y="256" width="232" height="86" rx="8" fill="#402d21" stroke="#ff8a4c"/>
  <text x="489" y="281" fill="#ffd9a8" font-size="12.5" font-weight="700">TP rank 1 · 全部 S 个 token</text>
  <text x="489" y="303" fill="#9aa3b2" font-size="11.5">Column/Core：hidden/head 分片 1</text>
  <text x="489" y="324" fill="#9aa3b2" font-size="11.5">Row 输出：部分和 P₁ [S,B,H]</text>

  <!-- Reduce-scatter conversion. -->
  <path d="M705 194H746V214H765" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <path d="M705 299H746V252H765" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <rect x="775" y="191" width="141" height="86" rx="10" fill="#12351f" stroke="#4ade80"/>
  <text x="845" y="217" text-anchor="middle" fill="#bbf7d0" font-size="12.5" font-weight="700">reduce-scatter</text>
  <text x="845" y="239" text-anchor="middle" fill="#9aa3b2" font-size="11.5">先 sum(P₀,P₁)</text>
  <text x="845" y="258" text-anchor="middle" fill="#9aa3b2" font-size="11">再沿 S 分发结果</text>

  <!-- Sequence-parallel output region. -->
  <path d="M916 234H936" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sparr)"/>
  <rect x="946" y="82" width="134" height="300" rx="12" fill="rgba(74,222,128,.07)" stroke="#4ade80"/>
  <text x="1013" y="109" text-anchor="middle" fill="#bbf7d0" font-size="13.5" font-weight="700">序列并行区域</text>
  <text x="1013" y="129" text-anchor="middle" fill="#9aa3b2" font-size="11">Dropout / Residual</text>

  <path d="M936 234H946V194H957" fill="none" stroke="#64748b" marker-end="url(#sparr)"/>
  <path d="M936 234H946V297H957" fill="none" stroke="#64748b" marker-end="url(#sparr)"/>
  <rect x="967" y="157" width="102" height="75" rx="8" fill="#12351f" stroke="#4ade80"/>
  <text x="1018" y="184" text-anchor="middle" fill="#bbf7d0" font-size="12.5" font-weight="700">rank 0 · O₀ˢ</text>
  <text x="1018" y="205" text-anchor="middle" fill="#9aa3b2" font-size="10.5">前半序列</text>
  <text x="1018" y="221" text-anchor="middle" fill="#9aa3b2" font-size="10">S/2 × B × H</text>

  <rect x="967" y="260" width="102" height="75" rx="8" fill="#402d21" stroke="#ff8a4c"/>
  <text x="1018" y="287" text-anchor="middle" fill="#ffd9a8" font-size="12.5" font-weight="700">rank 1 · O₁ˢ</text>
  <text x="1018" y="308" text-anchor="middle" fill="#9aa3b2" font-size="10.5">后半序列</text>
  <text x="1018" y="324" text-anchor="middle" fill="#9aa3b2" font-size="10">S/2 × B × H</text>

  <!-- Explanatory footer. -->
  <line x1="20" y1="412" x2="1080" y2="412" stroke="#313747"/>
  <text x="20" y="441" fill="#5f6b7a" font-size="12.5">普通 TP：P₀、P₁ 经 all-reduce 后，两个 rank 都保存完整的 [S,B,H]。</text>
  <text x="20" y="467" fill="#166534" font-size="12.5" font-weight="700">Megatron SP：求和结果保持序列分片；直到下一个 Column Linear 才临时 all-gather。</text>
  <text x="20" y="493" fill="#92400e" font-size="12">图中“常驻”指需要跨过后续计算或保存到反向的本地分片，不包含短暂出现的通信工作区。</text>
</svg>
