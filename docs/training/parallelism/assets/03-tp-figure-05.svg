<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="普通 TP 与 Sequence Parallel 的激活布局">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs><marker id="sarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">同一个 Column → Row 模块边界</text>
  <text x="20" y="70" fill="#fff" font-size="14" font-weight="700">普通 TP</text>
  <rect x="145" y="49" width="160" height="48" rx="8" fill="#1c2030" stroke="#64748b"/>
  <text x="225" y="70" text-anchor="middle" fill="#d7dbe4" font-size="12.5">复制 [S,B,H]</text><text x="225" y="88" text-anchor="middle" fill="#9aa3b2" font-size="11">Norm / residual</text>
  <line x1="305" y1="73" x2="350" y2="73" stroke="#64748b" marker-end="url(#sarr)"/>
  <rect x="360" y="49" width="180" height="48" rx="8" fill="rgba(124,147,255,.14)" stroke="#7c93ff"/>
  <text x="450" y="70" text-anchor="middle" fill="#cdd5ff" font-size="12.5">Column → Row</text><text x="450" y="88" text-anchor="middle" fill="#9aa3b2" font-size="11">中间 last-dim 分片</text>
  <line x1="540" y1="73" x2="585" y2="73" stroke="#64748b" marker-end="url(#sarr)"/>
  <rect x="595" y="49" width="160" height="48" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
  <text x="675" y="70" text-anchor="middle" fill="#fde68a" font-size="12.5">all-reduce</text><text x="675" y="88" text-anchor="middle" fill="#9aa3b2" font-size="11">输出回到复制态</text>

  <text x="20" y="159" fill="#fff" font-size="14" font-weight="700">TP + SP</text>
  <rect x="145" y="126" width="160" height="66" rx="8" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
  <text x="225" y="151" text-anchor="middle" fill="#bbf7d0" font-size="12.5">序列分片 [S/T,B,H]</text><text x="225" y="171" text-anchor="middle" fill="#9aa3b2" font-size="11">Norm / residual 各存 1/T</text>
  <line x1="305" y1="159" x2="350" y2="159" stroke="#64748b" marker-end="url(#sarr)"/>
  <text x="327" y="145" text-anchor="middle" fill="#fbbf24" font-size="10.5">AG</text>
  <rect x="360" y="126" width="180" height="66" rx="8" fill="rgba(124,147,255,.14)" stroke="#7c93ff"/>
  <text x="450" y="151" text-anchor="middle" fill="#cdd5ff" font-size="12.5">Column → Row</text><text x="450" y="171" text-anchor="middle" fill="#9aa3b2" font-size="11">GEMM 输入临时 gather</text>
  <line x1="540" y1="159" x2="585" y2="159" stroke="#64748b" marker-end="url(#sarr)"/>
  <text x="562" y="145" text-anchor="middle" fill="#4ade80" font-size="10.5">RS</text>
  <rect x="595" y="126" width="160" height="66" rx="8" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
  <text x="675" y="151" text-anchor="middle" fill="#bbf7d0" font-size="12.5">序列分片 [S/T,B,H]</text><text x="675" y="171" text-anchor="middle" fill="#9aa3b2" font-size="11">输出仍保持分片</text>

  <line x1="20" y1="222" x2="880" y2="222" stroke="#313747"/>
  <text x="20" y="252" fill="#9aa3b2" font-size="12.5">普通 TP：一次 all-reduce = 约 $2(T-1)/T$ 份激活传输量（ring 口径）</text>
  <text x="20" y="276" fill="#9aa3b2" font-size="12.5">TP + SP：一次 all-gather + 一次 reduce-scatter = 同量级传输，换来复制区激活常驻降到 1/T</text>
  <text x="20" y="300" fill="#fbbf24" font-size="12.5">注意：物理 collective 调用数变多，不代表通信字节翻倍；AG + RS 正好对应 AR 的两半。</text>
</svg>
