<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" role="img" aria-label="FSDP 与 TP 的单卡显存构成对比">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">同样使用 4 张卡：看单个大层计算时的每卡显存</text>
  <rect x="610" y="14" width="14" height="14" fill="rgba(124,147,255,.35)" stroke="#7c93ff"/><text x="632" y="26" fill="#9aa3b2" font-size="12">常驻参数分片</text>
  <rect x="724" y="14" width="14" height="14" fill="rgba(251,191,36,.28)" stroke="#fbbf24"/><text x="746" y="26" fill="#9aa3b2" font-size="12">计算瞬时峰值</text>

  <text x="20" y="75" fill="#fff" font-size="15" font-weight="700">FSDP / ZeRO-3</text>
  <text x="20" y="97" fill="#9aa3b2" font-size="12.5">平时切分；轮到本层时，参数临时拼完整</text>
  <g>
    <rect x="220" y="57" width="150" height="42" rx="7" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <text x="295" y="82" text-anchor="middle" fill="#cdd5ff" font-size="13">常驻 W / 4</text>
    <path d="M382 78 H417" stroke="#64748b" stroke-width="2"/><path d="M410 72 L418 78 L410 84" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="430" y="51" width="300" height="54" rx="8" fill="rgba(251,191,36,.18)" stroke="#fbbf24"/>
    <text x="580" y="74" text-anchor="middle" fill="#fde68a" font-size="13">all-gather → 完整 W（瞬时）</text>
    <text x="580" y="93" text-anchor="middle" fill="#9aa3b2" font-size="11.5">大到单卡放不下时，FSDP 仍会 OOM</text>
    <rect x="748" y="51" width="125" height="54" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
    <text x="810" y="74" text-anchor="middle" fill="#fde68a" font-size="13">完整激活</text>
    <text x="810" y="93" text-anchor="middle" fill="#9aa3b2" font-size="11.5">A</text>
  </g>

  <text x="20" y="159" fill="#fff" font-size="15" font-weight="700">Tensor Parallel</text>
  <text x="20" y="181" fill="#9aa3b2" font-size="12.5">参数分片直接计算；不出现完整层权重</text>
  <g>
    <rect x="220" y="141" width="150" height="42" rx="7" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <text x="295" y="166" text-anchor="middle" fill="#cdd5ff" font-size="13">本地 W⁽ⁱ⁾ = W / 4</text>
    <path d="M382 162 H417" stroke="#64748b" stroke-width="2"/><path d="M410 156 L418 162 L410 168" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="430" y="135" width="300" height="54" rx="8" fill="rgba(74,222,128,.13)" stroke="#4ade80"/>
    <text x="580" y="158" text-anchor="middle" fill="#bbf7d0" font-size="13">本地 GEMM：X⁽ⁱ⁾W⁽ⁱ⁾</text>
    <text x="580" y="178" text-anchor="middle" fill="#9aa3b2" font-size="11.5">整个计算期间都没有完整 W</text>
    <rect x="748" y="135" width="125" height="54" rx="8" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
    <text x="810" y="158" text-anchor="middle" fill="#bbf7d0" font-size="13">中间激活</text>
    <text x="810" y="178" text-anchor="middle" fill="#9aa3b2" font-size="11.5">可降到 A / 4</text>
  </g>

  <line x1="20" y1="224" x2="880" y2="224" stroke="#313747"/>
  <text x="20" y="257" fill="#eaeefb" font-size="14" font-weight="700">显存变化（定性，不是完整训练显存估算器）</text>
  <text x="20" y="286" fill="#9aa3b2" font-size="13">模型状态</text>
  <rect x="150" y="270" width="640" height="22" rx="5" fill="#242938"/>
  <rect x="150" y="270" width="160" height="22" rx="5" fill="rgba(124,147,255,.45)" stroke="#7c93ff"/>
  <text x="875" y="286" text-anchor="end" fill="#cdd5ff" font-size="12.5">TP 与 FSDP 都可做到约 1/4</text>
  <text x="20" y="325" fill="#9aa3b2" font-size="13">单层权重峰值</text>
  <rect x="150" y="309" width="640" height="22" rx="5" fill="rgba(251,191,36,.28)" stroke="#fbbf24"/>
  <line x1="310" y1="304" x2="310" y2="337" stroke="#4ade80" stroke-width="2"/>
  <text x="875" y="325" text-anchor="end" fill="#fde68a" font-size="12.5">FSDP = 1；TP ≈ 1/4</text>
  <text x="20" y="364" fill="#9aa3b2" font-size="13">MLP 中间激活</text>
  <rect x="150" y="348" width="640" height="22" rx="5" fill="rgba(251,191,36,.18)" stroke="#fbbf24"/>
  <line x1="310" y1="343" x2="310" y2="376" stroke="#4ade80" stroke-width="2"/>
  <text x="875" y="364" text-anchor="end" fill="#fde68a" font-size="12.5">FSDP = 1；TP ≈ 1/4</text>
</svg>
