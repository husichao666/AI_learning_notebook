<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="16 卡的 nD rank 布局：TP 最内、DP 中间、PP 最外">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <text x="20" y="22" fill="#eaeefb" font-size="13.5" font-weight="600">16 卡布局：tp=2（相邻）· dp=4（中间）· pp=2（跨度 8，跨节点）</text>
  <!-- 16 cells in 2 rows of 8 (pp=0 top, pp=1 bottom) -->
  <g font-size="11" text-anchor="middle">
    <!-- pp=0 -->
    <text x="20" y="62" fill="#9aa3b2" text-anchor="start" font-size="10">节点A (pp0)</text>
    <!-- tp pairs colored -->
    <g>
      <rect x="120" y="48" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="138" y="68" fill="#cdd5ff">0</text><text x="176" y="68" fill="#cdd5ff">1</text>
      <rect x="200" y="48" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="218" y="68" fill="#cdd5ff">2</text><text x="256" y="68" fill="#cdd5ff">3</text>
      <rect x="280" y="48" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="298" y="68" fill="#cdd5ff">4</text><text x="336" y="68" fill="#cdd5ff">5</text>
      <rect x="360" y="48" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="378" y="68" fill="#cdd5ff">6</text><text x="416" y="68" fill="#cdd5ff">7</text>
    </g>
    <!-- pp=1 -->
    <text x="20" y="106" fill="#9aa3b2" text-anchor="start" font-size="10">节点B (pp1)</text>
    <g>
      <rect x="120" y="92" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="138" y="112" fill="#cdd5ff">8</text><text x="176" y="112" fill="#cdd5ff">9</text>
      <rect x="200" y="92" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="218" y="112" fill="#cdd5ff">10</text><text x="256" y="112" fill="#cdd5ff">11</text>
      <rect x="280" y="92" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="298" y="112" fill="#cdd5ff">12</text><text x="336" y="112" fill="#cdd5ff">13</text>
      <rect x="360" y="92" width="74" height="30" rx="4" fill="rgba(124,147,255,0.18)" stroke="#7c93ff"/><text x="378" y="112" fill="#cdd5ff">14</text><text x="416" y="112" fill="#cdd5ff">15</text>
    </g>
  </g>
  <!-- legend -->
  <rect x="470" y="44" width="330" height="150" rx="10" fill="#13161f" stroke="#262b3a"/>
  <text x="486" y="66" fill="#cdd5ff" font-size="12"><tspan fill="#7c93ff" font-weight="700">蓝框</tspan> = 一个 TP 组（相邻 2 卡，stride 1）→ NVLink</text>
  <text x="486" y="90" fill="#9aa3b2" font-size="12">DP 组 = {0,2,4,6} / {1,3,5,7} ...（stride 2）</text>
  <text x="486" y="114" fill="#9aa3b2" font-size="12">PP 组 = {0,8} {1,9} ...（stride 8，跨节点）</text>
  <text x="486" y="146" fill="#86efac" font-size="12" font-weight="600">本例：TP 的 stride 最小，</text>
  <text x="486" y="166" fill="#86efac" font-size="12" font-weight="600">PP 的 stride 最大；这里只定义逻辑相邻。</text>
  <text x="486" y="186" fill="#fbbf24" font-size="11">→ 还需 launcher 把相邻 rank 放到高速互联域。</text>
  <text x="20" y="230" fill="#9aa3b2" font-size="12">RankGenerator + order 生成逻辑子组；物理拓扑还取决于 global rank 到 GPU/节点的映射。</text>
</svg>
