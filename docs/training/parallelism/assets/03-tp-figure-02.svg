    <text x="180" y="142" text-anchor="middle" fill="#ff8a4c" font-size="12">GPU 1</text>
  </g>
  <line x1="500" y1="118" x2="550" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#carr)"/>
