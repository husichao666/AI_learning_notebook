  <defs><marker id="carr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">Column Parallel：每卡负责输出特征的一部分</text>
  <g transform="translate(55,58)">
    <text x="60" y="-10" text-anchor="middle" fill="#9aa3b2" font-size="12">X [M,K] · 每卡相同</text>
