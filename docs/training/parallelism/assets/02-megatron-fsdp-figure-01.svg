<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-FSDP 固定 offset 与连续缓冲区示例</title>
  <desc id="desc">offset 表将 Wq、bias 和 Wk 映射到十二个元素的逻辑完整布局；rank 0 和 rank 1 分别在本地 CUDA buffer 中常驻其中六个元素。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <clipPath id="buffer-clip">
      <rect x="96" y="92" width="768" height="72" rx="9"/>
    </clipPath>
  </defs>

  <rect width="960" height="300" fill="#ffffff"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="34" fill="#0f172a" font-size="21" font-weight="700">固定 offset 与连续 CUDA buffer（DP = 2）</text>
    <text x="40" y="58" fill="#64748b" font-size="14">offset 表定义逻辑完整布局；每个 rank 只在本地 GPU 上常驻其中一个连续分片</text>

    <text x="28" y="117" fill="#334155" font-size="14" font-weight="700">逻辑完整</text>
    <text x="28" y="136" fill="#334155" font-size="14" font-weight="700">布局</text>

    <g filter="url(#shadow)">
      <g clip-path="url(#buffer-clip)">
        <rect x="96" y="92" width="256" height="72" fill="#dbeafe"/>
        <rect x="352" y="92" width="128" height="72" fill="#fef3c7"/>
        <rect x="480" y="92" width="384" height="72" fill="#dcfce7"/>
      </g>
      <rect x="96" y="92" width="768" height="72" rx="9" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="352" y1="92" x2="352" y2="164" stroke="#2563eb" stroke-width="1.5"/>
      <line x1="480" y1="92" x2="480" y2="164" stroke="#d97706" stroke-width="1.5"/>
    </g>

    <g text-anchor="middle">
      <text x="224" y="121" fill="#1e3a8a" font-size="17" font-weight="700">Wq</text>
      <text x="224" y="145" fill="#475569" font-size="14">4 个元素 · [0, 4)</text>

      <text x="416" y="121" fill="#92400e" font-size="17" font-weight="700">bias</text>
      <text x="416" y="145" fill="#475569" font-size="14">2 个 · [4, 6)</text>

      <text x="672" y="121" fill="#166534" font-size="17" font-weight="700">Wk</text>
      <text x="672" y="145" fill="#475569" font-size="14">6 个元素 · [6, 12)</text>
    </g>

    <g fill="#64748b" font-size="12" text-anchor="middle">
      <text x="96" y="84">offset 0</text>
      <text x="352" y="84">4</text>
      <text x="480" y="84">6</text>
      <text x="864" y="84">12</text>
    </g>

    <line x1="480" y1="70" x2="480" y2="258" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="411" y="62" width="138" height="22" rx="11" fill="#fff1f2" stroke="#fda4af"/>
    <text x="480" y="77" fill="#be123c" font-size="12" font-weight="700" text-anchor="middle">DP 分片边界</text>

    <path d="M288 169 L288 194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M672 169 L672 194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="96" y="199" width="366" height="54" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="498" y="199" width="366" height="54" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>

    <g text-anchor="middle">
      <text x="279" y="222" fill="#1e40af" font-size="15" font-weight="700">Rank 0 常驻分片</text>
      <text x="279" y="242" fill="#475569" font-size="13">[0, 6) · 6 个元素</text>

      <text x="681" y="222" fill="#166534" font-size="15" font-weight="700">Rank 1 常驻分片</text>
      <text x="681" y="242" fill="#475569" font-size="13">[6, 12) · 6 个元素</text>
    </g>

    <text x="480" y="282" fill="#64748b" font-size="13" text-anchor="middle">两张 GPU 的显存并不相连；每个 rank 的常驻 buffer 都是独立的本地 CUDA Storage。</text>
  </g>
</svg>
