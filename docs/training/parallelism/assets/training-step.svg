<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 30 800 204" role="img" aria-label="一次训练 step 的四拍及其显存去向">
  <style>
    [fill="#eaeefb"]{fill:#172033}[fill="#9aa3b2"]{fill:#5f6b7a}[fill="#cdd5ff"]{fill:#334a8a}[fill="#bbf7d0"]{fill:#166534}[fill="#fde68a"]{fill:#92400e}
  </style>
  <defs><marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c93ff"/></marker></defs>
  <!-- 4 stages -->
  <g font-size="13" text-anchor="middle">
    <rect x="20"  y="40" width="170" height="54" rx="9" fill="rgba(124,147,255,0.14)" stroke="#7c93ff"/>
    <text x="105" y="64" fill="#cdd5ff" font-weight="700">① forward 前向</text>
    <text x="105" y="83" fill="#9aa3b2" font-size="11.5">用「权重」算出 loss</text>

    <rect x="216" y="40" width="170" height="54" rx="9" fill="rgba(251,191,36,0.12)" stroke="#fbbf24"/>
    <text x="301" y="64" fill="#fde68a" font-weight="700">② 存「激活值」</text>
    <text x="301" y="83" fill="#9aa3b2" font-size="11.5">中间结果，反向要用</text>

    <rect x="412" y="40" width="170" height="54" rx="9" fill="rgba(74,222,128,0.14)" stroke="#4ade80"/>
    <text x="497" y="64" fill="#bbf7d0" font-weight="700">③ backward 反向</text>
    <text x="497" y="83" fill="#9aa3b2" font-size="11.5">算出「梯度」</text>

    <rect x="608" y="40" width="190" height="54" rx="9" fill="rgba(124,147,255,0.14)" stroke="#7c93ff"/>
    <text x="703" y="64" fill="#cdd5ff" font-weight="700">④ optimizer.step()</text>
    <text x="703" y="83" fill="#9aa3b2" font-size="11.5">用「优化器状态」更新权重</text>

    <line x1="190" y1="67" x2="214" y2="67" stroke="#7c93ff" marker-end="url(#s)"/>
    <line x1="386" y1="67" x2="410" y2="67" stroke="#7c93ff" marker-end="url(#s)"/>
    <line x1="582" y1="67" x2="606" y2="67" stroke="#7c93ff" marker-end="url(#s)"/>
  </g>
  <!-- loop back -->
  <path d="M703 94 L703 130 L105 130 L105 96" fill="none" stroke="#475569" stroke-dasharray="4 4" marker-end="url(#s)"/>
  <text x="404" y="124" text-anchor="middle" fill="#64748b" font-size="11.5">权重更新完，下一个 batch 重新开始 ↺</text>
  <!-- memory tally -->
  <text x="20" y="172" fill="#eaeefb" font-size="13" font-weight="600">这一拍碰到的显存，正是下一节「账本」的四项：</text>
  <g font-size="12">
    <text x="20"  y="198" fill="#cdd5ff">• 权重 weights（①④ 都要）</text>
    <text x="300" y="198" fill="#fde68a">• 激活值 activations（②存，③用完即放）</text>
    <text x="20"  y="222" fill="#bbf7d0">• 梯度 gradients（③产生）</text>
    <text x="300" y="222" fill="#bbf7d0">• 优化器状态 optimizer states（④用）</text>
  </g>
</svg>
