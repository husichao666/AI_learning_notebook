  <defs><marker id="marr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">MLP：Column → activation → Row</text>
  <rect x="20" y="118" width="92" height="48" rx="8" fill="#1c2030" stroke="#64748b"/>
  <text x="66" y="139" text-anchor="middle" fill="#fff" font-size="13">X</text><text x="66" y="157" text-anchor="middle" fill="#9aa3b2" font-size="11">[S,B,H]</text>
  <line x1="112" y1="142" x2="142" y2="142" stroke="#64748b" marker-end="url(#marr)"/>
  <g>
    <rect x="150" y="72" width="142" height="55" rx="8" fill="rgba(124,147,255,.14)" stroke="#7c93ff"/>
    <text x="221" y="94" text-anchor="middle" fill="#cdd5ff" font-size="13">GPU 0 · W₁⁽⁰⁾</text><text x="221" y="114" text-anchor="middle" fill="#9aa3b2" font-size="11">Column Linear</text>
    <rect x="150" y="158" width="142" height="55" rx="8" fill="rgba(255,138,76,.12)" stroke="#ff8a4c"/>
    <text x="221" y="180" text-anchor="middle" fill="#ffd9a8" font-size="13">GPU 1 · W₁⁽¹⁾</text><text x="221" y="200" text-anchor="middle" fill="#9aa3b2" font-size="11">Column Linear</text>
    <line x1="292" y1="99" x2="322" y2="99" stroke="#64748b" marker-end="url(#marr)"/>
    <line x1="292" y1="185" x2="322" y2="185" stroke="#64748b" marker-end="url(#marr)"/>
    <rect x="330" y="72" width="130" height="55" rx="8" fill="rgba(124,147,255,.08)" stroke="#7c93ff"/>
    <text x="395" y="94" text-anchor="middle" fill="#cdd5ff" font-size="13">GeLU(Z⁽⁰⁾)</text><text x="395" y="114" text-anchor="middle" fill="#4ade80" font-size="11">本地 · 无通信</text>
    <rect x="330" y="158" width="130" height="55" rx="8" fill="rgba(255,138,76,.08)" stroke="#ff8a4c"/>
    <text x="395" y="180" text-anchor="middle" fill="#ffd9a8" font-size="13">GeLU(Z⁽¹⁾)</text><text x="395" y="200" text-anchor="middle" fill="#4ade80" font-size="11">本地 · 无通信</text>
    <line x1="460" y1="99" x2="490" y2="99" stroke="#64748b" marker-end="url(#marr)"/>
    <line x1="460" y1="185" x2="490" y2="185" stroke="#64748b" marker-end="url(#marr)"/>
    <rect x="498" y="72" width="140" height="55" rx="8" fill="rgba(124,147,255,.14)" stroke="#7c93ff"/>
    <text x="568" y="94" text-anchor="middle" fill="#cdd5ff" font-size="13">GPU 0 · W₂⁽⁰⁾</text><text x="568" y="114" text-anchor="middle" fill="#9aa3b2" font-size="11">Row → 部分和</text>
    <rect x="498" y="158" width="140" height="55" rx="8" fill="rgba(255,138,76,.12)" stroke="#ff8a4c"/>
    <text x="568" y="180" text-anchor="middle" fill="#ffd9a8" font-size="13">GPU 1 · W₂⁽¹⁾</text><text x="568" y="200" text-anchor="middle" fill="#9aa3b2" font-size="11">Row → 部分和</text>
  </g>
  <line x1="638" y1="99" x2="678" y2="127" stroke="#64748b" marker-end="url(#marr)"/>
  <line x1="638" y1="185" x2="678" y2="157" stroke="#64748b" marker-end="url(#marr)"/>
  <rect x="687" y="113" width="118" height="58" rx="8" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
  <text x="746" y="137" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">all-reduce</text><text x="746" y="157" text-anchor="middle" fill="#9aa3b2" font-size="11">唯一一次前向通信</text>
  <line x1="805" y1="142" x2="830" y2="142" stroke="#64748b" marker-end="url(#marr)"/>
  <text x="854" y="147" text-anchor="middle" fill="#fff" font-size="14">Y</text>
  <text x="20" y="264" fill="#4ade80" font-size="12.5">中间张量 Z 的最后一维始终是 1/T；Column 的输出布局恰好就是 Row 想要的输入布局。</text>
  <text x="20" y="286" fill="#9aa3b2" font-size="12.5">反向完全对称：Row 的反向直通，Column 的输入梯度处做一次 all-reduce。</text>
</svg>
