<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="MLP 从左到右组合 Column Parallel 与 Row Parallel，并在出口执行 all-reduce">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"]{fill:#f8fafc}
  rect[fill="rgba(255,255,255,.025)"]{fill:rgba(15,23,42,.04)}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"],[stroke="#313747"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="marr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">MLP：Column → Row</text>

  <!-- X [M,H] -->
  <g transform="translate(20,90)">
    <text x="30" y="-12" text-anchor="middle" fill="#5f6b7a" font-size="11.5">X [M,H]</text>
    <rect x="0" y="0" width="60" height="60" fill="rgba(255,255,255,.025)" stroke="#64748b"/>
    <path d="M20 0V60M40 0V60M0 20H60M0 40H60" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#172033" font-size="16">X</text>
  </g>

  <text x="93" y="128" fill="#5f6b7a" font-size="21">×</text>

  <!-- W1 [H,F]: column split. -->
  <g transform="translate(115,90)">
    <text x="60" y="-12" text-anchor="middle" fill="#5f6b7a" font-size="11.5">W₁ [H,F] · Column</text>
    <rect x="0" y="0" width="60" height="60" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="60" y="0" width="60" height="60" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M20 0V60M40 0V60M80 0V60M100 0V60M0 20H120M0 40H120" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#334a8a" font-size="13.5">W₁⁽⁰⁾</text>
    <text x="90" y="36" text-anchor="middle" fill="#92400e" font-size="13.5">W₁⁽¹⁾</text>
  </g>

  <line x1="235" y1="120" x2="250" y2="120" stroke="#64748b" marker-end="url(#marr)"/>
  <circle cx="273" cy="120" r="18" fill="rgba(74,222,128,.10)" stroke="#4ade80"/>
  <text x="273" y="124" text-anchor="middle" fill="#166534" font-size="11">GeLU</text>
  <line x1="291" y1="120" x2="305" y2="120" stroke="#64748b" marker-end="url(#marr)"/>

  <!-- A [M,F]: W1 output keeps the same column split. -->
  <g transform="translate(315,90)">
    <text x="60" y="-12" text-anchor="middle" fill="#5f6b7a" font-size="11.5">A [M,F] · 分片输出</text>
    <rect x="0" y="0" width="60" height="60" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="60" y="0" width="60" height="60" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M20 0V60M40 0V60M80 0V60M100 0V60M0 20H120M0 40H120" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#334a8a" font-size="14">A⁽⁰⁾</text>
    <text x="90" y="36" text-anchor="middle" fill="#92400e" font-size="14">A⁽¹⁾</text>
  </g>

  <text x="448" y="128" fill="#5f6b7a" font-size="21">×</text>

  <!-- W2 [F,H]: row split along the same F dimension. -->
  <g transform="translate(470,60)">
    <text x="30" y="-12" text-anchor="middle" fill="#5f6b7a" font-size="11.5">W₂ [F,H] · Row</text>
    <rect x="0" y="0" width="60" height="60" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="0" y="60" width="60" height="60" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M20 0V120M40 0V120M0 20H60M0 40H60M0 80H60M0 100H60" stroke="#313747"/>
    <text x="30" y="35" text-anchor="middle" fill="#334a8a" font-size="13.5">W₂⁽⁰⁾</text>
    <text x="30" y="95" text-anchor="middle" fill="#92400e" font-size="13.5">W₂⁽¹⁾</text>
  </g>

  <!-- Matching colors produce two complete-shaped partial sums. -->
  <path d="M530 120H545V85H558" fill="none" stroke="#7c93ff" marker-end="url(#marr)"/>
  <path d="M545 120V175H558" fill="none" stroke="#ff8a4c" marker-end="url(#marr)"/>
  <circle cx="545" cy="120" r="3" fill="#64748b"/>

  <g transform="translate(570,55)">
    <rect x="0" y="0" width="60" height="60" fill="rgba(124,147,255,.16)" stroke="#7c93ff"/>
    <path d="M20 0V60M40 0V60M0 20H60M0 40H60" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#334a8a" font-size="14">Ỹ⁽⁰⁾</text>
  </g>
  <g transform="translate(570,145)">
    <rect x="0" y="0" width="60" height="60" fill="rgba(255,138,76,.13)" stroke="#ff8a4c"/>
    <path d="M20 0V60M40 0V60M0 20H60M0 40H60" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#92400e" font-size="14">Ỹ⁽¹⁾</text>
  </g>

  <line x1="630" y1="85" x2="660" y2="108" stroke="#7c93ff" marker-end="url(#marr)"/>
  <line x1="630" y1="175" x2="660" y2="142" stroke="#ff8a4c" marker-end="url(#marr)"/>
  <rect x="670" y="95" width="110" height="60" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
  <text x="725" y="120" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">all-reduce</text>
  <text x="725" y="140" text-anchor="middle" fill="#5f6b7a" font-size="11">Ỹ⁽⁰⁾ + Ỹ⁽¹⁾</text>

  <line x1="780" y1="125" x2="810" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#marr)"/>
  <g transform="translate(825,95)">
    <text x="30" y="-12" text-anchor="middle" fill="#5f6b7a" font-size="11.5">Y [M,H]</text>
    <rect x="0" y="0" width="60" height="60" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
    <path d="M20 0V60M40 0V60M0 20H60M0 40H60" stroke="#313747"/>
    <text x="30" y="36" text-anchor="middle" fill="#166534" font-size="16">Y</text>
  </g>

  <rect x="332" y="210" width="186" height="30" rx="7" fill="rgba(74,222,128,.08)" stroke="#4ade80"/>
  <text x="425" y="230" text-anchor="middle" fill="#166534" font-size="12">同色分片本地相乘 · 0 次通信</text>
</svg>
