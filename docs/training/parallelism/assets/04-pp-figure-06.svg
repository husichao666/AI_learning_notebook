<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 225" role="img" aria-label="线性层的输入梯度与参数梯度依赖">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#334155" font-size="13">
<rect x="18" y="68" width="168" height="68" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="102" y="94" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">前向状态 X、权重 W</text>
<text x="102" y="117" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">收到输出梯度 G</text>
<rect x="244" y="22" width="192" height="65" rx="5" fill="#e5f2eb" stroke="#cbd5e1"/>
<text x="340" y="47" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">Bₓ：计算输入梯度</text>
<text x="340" y="70" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">∂L/∂X = GWᵀ</text>
<rect x="244" y="141" width="192" height="65" rx="5" fill="#fff2d9" stroke="#cbd5e1"/>
<text x="340" y="167" font-size="13" fill="#334155" font-weight="600" text-anchor="middle">B<tspan baseline-shift="sub" font-size="10">w</tspan>：计算参数梯度</text>
<text x="340" y="190" font-size="13" fill="#334155" font-weight="400" text-anchor="middle">∂L/∂W = XᵀG</text>
<rect x="493" y="30" width="189" height="50" rx="5" fill="#e5f2eb" stroke="#cbd5e1"/>
<text x="587" y="60" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">前一层 / stage 的反向</text>
<rect x="493" y="149" width="189" height="50" rx="5" fill="#fff2d9" stroke="#cbd5e1"/>
<text x="587" y="179" font-size="12" fill="#334155" font-weight="400" text-anchor="middle">梯度累积 → 参数更新</text>
<path d="M186 92 H210 V54 H244" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M186 114 H210 V173 H244" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M436 54 H493" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M436 174 H493" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="118" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">Bₓ 不依赖 B<tspan baseline-shift="sub" font-size="10">w</tspan> 的结果</text>
</g></svg>
