<rect x="580" y="273" width="82" height="48" rx="8" fill="#1f7a4d"/><text x="621" y="302" fill="#fff" font-size="12" text-anchor="middle">GPU4 · E4</text>
<rect x="692" y="273" width="82" height="48" rx="8" fill="#1f7a4d"/><text x="733" y="302" fill="#fff" font-size="12" text-anchor="middle">GPU5 · E5</text>
<path d="M339 297H555" stroke="#4ade80" stroke-width="4"/>
