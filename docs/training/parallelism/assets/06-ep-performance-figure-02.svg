<text x="460" y="26" fill="#eaeefb" font-size="16" font-weight="700" text-anchor="middle">例：token x 同时命中远端节点 B 上的 E4 与 E5</text>

<text x="22" y="83" fill="#ffb0b0" font-size="13" font-weight="700">按 rank 直接发送</text>
<rect x="120" y="51" width="245" height="116" rx="12" fill="#1c2030" stroke="#39405a"/>
<text x="242" y="74" fill="#9aa3b2" font-size="12" text-anchor="middle">节点 A · NVLink 域</text>
<rect x="190" y="91" width="105" height="48" rx="8" fill="#6f57bd"/>
<text x="242" y="120" fill="#fff" font-size="12" text-anchor="middle">GPU0 · x</text>
<rect x="555" y="51" width="245" height="116" rx="12" fill="#1c2030" stroke="#39405a"/>
<text x="677" y="74" fill="#9aa3b2" font-size="12" text-anchor="middle">节点 B · NVLink 域</text>
<rect x="580" y="91" width="82" height="48" rx="8" fill="#1f7a4d"/><text x="621" y="120" fill="#fff" font-size="12" text-anchor="middle">GPU4 · E4</text>
<rect x="692" y="91" width="82" height="48" rx="8" fill="#1f7a4d"/><text x="733" y="120" fill="#fff" font-size="12" text-anchor="middle">GPU5 · E5</text>
<path d="M295 106C395 65 475 65 580 106" fill="none" stroke="#ff6b6b" stroke-width="3"/>
<path d="M295 124C410 165 570 165 692 124" fill="none" stroke="#ff6b6b" stroke-width="3"/>
<text x="460" y="92" fill="#ffb0b0" font-size="11.5" text-anchor="middle">RDMA：发送 x</text>
<text x="500" y="157" fill="#ffb0b0" font-size="11.5" text-anchor="middle">RDMA：再次发送 x</text>
<text x="460" y="188" fill="#ffb0b0" font-size="12.5" text-anchor="middle">同一份 H 维激活两次穿越慢链路：约 2Hb 字节</text>

<line x1="30" y1="211" x2="890" y2="211" stroke="#39405a" stroke-width="1"/>

