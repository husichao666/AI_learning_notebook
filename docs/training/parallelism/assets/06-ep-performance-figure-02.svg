<rect x="145" y="273" width="82" height="48" rx="8" fill="#6f57bd"/><text x="186" y="302" fill="#fff" font-size="12" text-anchor="middle">GPU0 · x</text>
<rect x="257" y="273" width="82" height="48" rx="8" fill="#293b91"/><text x="298" y="294" fill="#fff" font-size="11.5" text-anchor="middle">RDMA</text><text x="298" y="310" fill="#fff" font-size="11.5" text-anchor="middle">forwarder</text>
<path d="M227 297H257" stroke="#7c93ff" stroke-width="3"/>

<rect x="555" y="232" width="245" height="116" rx="12" fill="#1c2030" stroke="#4ade80"/>
