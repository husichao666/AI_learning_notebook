<text x="460" y="377" fill="#86efac" font-size="12.5" text-anchor="middle">慢链路约 Hb 字节；复制留给更快的 NVLink/NVSwitch 域完成</text>
<text x="460" y="399" fill="#9aa3b2" font-size="11.5" text-anchor="middle">示意图忽略 metadata；真实实现可有多个 RDMA rank / NIC 并行转发。</text>
