<text x="470" y="27" fill="#eaeefb" font-size="16" font-weight="700" text-anchor="middle">为什么还需要 HybridEP：通信快了以后，独立重排与 SM 占用会进入关键路径</text>

<text x="18" y="81" fill="#ffcf8a" font-size="13" font-weight="700">Megatron DeepEP 路径</text>
<rect x="35" y="101" width="105" height="52" rx="8" fill="#6f57bd"/><text x="87" y="132" fill="#fff" font-size="11.5" text-anchor="middle">top-k indices</text>
<rect x="165" y="101" width="175" height="52" rx="8" fill="#293b91"/><text x="252" y="123" fill="#fff" font-size="11.5" text-anchor="middle">fused dispatch</text><text x="252" y="140" fill="#fff" font-size="10.5" text-anchor="middle">pack + NVLink/RDMA</text>
<rect x="365" y="101" width="130" height="52" rx="8" fill="#4b5563"/><text x="430" y="123" fill="#fff" font-size="11" text-anchor="middle">通信布局</text><text x="430" y="140" fill="#fbbf24" font-size="10.5" text-anchor="middle">写回 HBM</text>
<rect x="520" y="101" width="145" height="52" rx="8" fill="#b9703f"/><text x="592" y="123" fill="#fff" font-size="11" text-anchor="middle">local-expert</text><text x="592" y="140" fill="#fff" font-size="11" text-anchor="middle">permute</text>
