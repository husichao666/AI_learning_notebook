<path d="M140 127H165M340 127H365M495 127H520M665 127H690M810 127H835" stroke="#9aa3b2" stroke-width="2"/>
<path d="M430 155V185H592V155" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="511" y="202" fill="#ffb0b0" font-size="11.5" text-anchor="middle">额外 HBM 读写 + 独立 kernel launch</text>
<text x="470" y="226" fill="#9aa3b2" font-size="11.5" text-anchor="middle">通信结果还不是 Grouped GEMM 需要的 expert-contiguous layout。</text>

<line x1="25" y1="249" x2="915" y2="249" stroke="#39405a" stroke-width="1"/>

<text x="18" y="291" fill="#86efac" font-size="13" font-weight="700">HybridEP 路径</text>
<rect x="35" y="311" width="105" height="52" rx="8" fill="#6f57bd"/><text x="87" y="342" fill="#fff" font-size="11.5" text-anchor="middle">routing_map</text>
<rect x="165" y="286" width="500" height="102" rx="12" fill="#20352f" stroke="#4ade80" stroke-width="2"/>
<text x="415" y="308" fill="#86efac" font-size="12.5" font-weight="700" text-anchor="middle">dispatch_with_permute · 一个融合边界</text>
<rect x="188" y="326" width="130" height="42" rx="7" fill="#42595a"/><text x="253" y="352" fill="#fff" font-size="10.8" text-anchor="middle">通信目标 permute</text>
<rect x="338" y="326" width="130" height="42" rx="7" fill="#293b91"/><text x="403" y="344" fill="#fff" font-size="10.8" text-anchor="middle">TMA · scale-up</text><text x="403" y="359" fill="#fff" font-size="10.2" text-anchor="middle">IBGDA · scale-out</text>
<rect x="488" y="326" width="150" height="42" rx="7" fill="#42595a"/><text x="563" y="352" fill="#fff" font-size="10.8" text-anchor="middle">local-expert permute</text>
<rect x="690" y="311" width="120" height="52" rx="8" fill="#1f7a4d"/><text x="750" y="342" fill="#fff" font-size="11.5" text-anchor="middle">Expert GEMM</text>
<rect x="835" y="286" width="90" height="102" rx="10" fill="#293b91"/><text x="880" y="328" fill="#fff" font-size="10.8" text-anchor="middle">combine</text><text x="880" y="345" fill="#fff" font-size="10.8" text-anchor="middle">with</text><text x="880" y="362" fill="#fff" font-size="10.8" text-anchor="middle">unpermute</text>
<path d="M140 337H165M665 337H690M810 337H835" stroke="#4ade80" stroke-width="3"/>
<text x="470" y="416" fill="#86efac" font-size="12.5" text-anchor="middle">通信输出直接进入 GEMM；逆向也一次完成，减少中间 buffer、HBM 往返和 SM 竞争。</text>
