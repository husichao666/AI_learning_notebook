<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1050" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch FSDP2 HSDP 与 HyperParallel 默认路径的反向通信时序</title>
  <desc id="desc">PyTorch FSDP2 将完整梯度 copy-in 到输入 I3，RS3 写入独立输出 O3，AR3 原地使用 O3。post L2 等待 RS3 event 后仅回收 I3，不释放 O3，也不等待 AR3。HyperParallel 各参数 RS 直接写入融合输出 B3 的 view，下一 Hook 等待 RS 后释放各参数输入 _grad，group 仍持有 B3，随后发融合 AR3。AR 完成后结果 view 接续持有输出存储。Hook 框表示提交位置，不能据此判断 CPU 是否阻塞。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="dependency-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="1050" fill="#ffffff"/>

  <g font-family="'WenQuanYi Zen Hei', 'Noto Sans SC', 'Microsoft YaHei', Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="32" y="34" fill="#0f172a" font-size="21" font-weight="700">RS → AR 在哪里衔接：PyTorch FSDP2 与 HyperParallel</text>
    <text x="32" y="58" fill="#64748b" font-size="14">反向顺序为 L3 → L2 → L1；方块长度只表达先后和重叠关系，不代表真实耗时比例</text>

    <!-- PyTorch native panel -->
    <rect x="24" y="78" width="1072" height="516" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="108" fill="#0f172a" font-size="17" font-weight="700">PyTorch FSDP2 · 原生 HSDP</text>
    <text x="44" y="130" fill="#64748b" font-size="13">同一次 foreach_reduce() 排入 RS 与 AR；独立 stream 用事件关系保证 AR 读取完成后的 RS 输出</text>
    <line x1="180" y1="142" x2="1072" y2="142" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
    <text x="1050" y="133" fill="#64748b" font-size="12">时间</text>

    <g fill="#475569" font-size="13" font-weight="600" text-anchor="end">
      <text x="164" y="188">当前 / 计算 stream</text>
      <text x="164" y="246">RS stream</text>
      <text x="164" y="304">AR stream</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="163" width="115" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="300" y="163" width="80" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="385" y="163" width="140" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="530" y="163" width="95" height="40" rx="7" fill="#fff7ed" stroke="#fb923c"/>
      <rect x="630" y="163" width="140" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="775" y="163" width="95" height="40" rx="7" fill="#fff7ed" stroke="#fb923c"/>
      <rect x="980" y="163" width="95" height="40" rx="7" fill="#fee2e2" stroke="#f87171"/>

      <rect x="325" y="221" width="185" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="585" y="221" width="175" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="835" y="221" width="140" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>

      <rect x="510" y="279" width="180" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
      <rect x="760" y="279" width="175" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
      <rect x="975" y="279" width="100" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
    </g>

    <g fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">
      <text x="237.5" y="188">L3 backward</text>
      <text x="455" y="188">L2 backward</text>
      <text x="700" y="188">L1 backward</text>
    </g>
    <g fill="#334155" font-size="11" font-weight="700" text-anchor="middle">
      <text x="340" y="179">post L3</text><text x="340" y="195" font-size="10.5">发 RS3 / AR3</text>
      <text x="577.5" y="179">post L2</text><text x="577.5" y="195">释放 I3；排入 2</text>
      <text x="822.5" y="179">post L1</text><text x="822.5" y="195">释放 I2；排入 1</text>
    </g>
    <g fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="1027.5" y="179">root callback</text><text x="1027.5" y="195">wait last events</text>
    </g>
    <g fill="#166534" font-size="13" font-weight="700" text-anchor="middle">
      <text x="417.5" y="246">RS3：I3 → O3</text>
      <text x="672.5" y="246">RS2：I2 → O2</text>
      <text x="905" y="246">RS1：I1 → O1</text>
    </g>
    <g fill="#6b21a8" font-size="13" font-weight="700" text-anchor="middle">
      <text x="600" y="304">AR3：原地更新 O3</text>
      <text x="847.5" y="304">AR2：更新 O2</text>
      <text x="1025" y="304">AR1(O1)</text>
    </g>

    <!-- Native dependencies -->
    <path d="M510 241 C526 241 500 286 506 296" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <text x="516" y="273" fill="#64748b" font-size="10.5">AR stream wait RS stream</text>
    <path d="M760 241 C776 241 750 286 756 296" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M975 241 C990 241 966 286 971 296" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M510 229 C530 216 542 207 557 201" fill="none" stroke="#f97316" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M760 229 C780 216 791 207 808 201" fill="none" stroke="#f97316" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>

    <rect x="164" y="337" width="438" height="30" rx="7" fill="#fff7ed" stroke="#fdba74"/>
    <text x="178" y="357" fill="#92400e" font-size="12.5"><tspan font-weight="700">默认 cap=1：</tspan>post L2 等 RS3 后释放 I3，不释放 O3</text>
    <rect x="616" y="337" width="460" height="30" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="630" y="357" fill="#6b21a8" font-size="12.5"><tspan font-weight="700">AR3：</tspan>由 post L3 排入，使用独立存储 O3</text>

    <!-- Native storage path: RS input and output have separate lifetimes. -->
    <line x1="44" y1="383" x2="1076" y2="383" stroke="#e2e8f0"/>
    <text x="44" y="407" fill="#0f172a" font-size="15" font-weight="700">L3 的存储流向：I3 与 O3 是独立分配的两块 buffer</text>
    <text x="44" y="429" fill="#64748b" font-size="12.5">M 为打包后含 padding 的完整梯度元素数，S 为 shard 组大小；下图是数据流，不是时间轴</text>
    <g text-anchor="middle">
      <rect x="44" y="450" width="170" height="66" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="129" y="476" fill="#1e3a8a" font-size="14" font-weight="700">各参数完整梯度</text>
      <text x="129" y="499" fill="#475569" font-size="12">copy-in 后可释放引用</text>

      <rect x="290" y="450" width="205" height="66" rx="8" fill="#fff7ed" stroke="#fb923c"/>
      <text x="392.5" y="476" fill="#92400e" font-size="14" font-weight="700">I3：RS 输入 · M 元素</text>
      <text x="392.5" y="499" fill="#92400e" font-size="12">ReduceScatterState 保留</text>

      <rect x="570" y="450" width="225" height="66" rx="8" fill="#f3e8ff" stroke="#c084fc"/>
      <text x="682.5" y="476" fill="#6b21a8" font-size="14" font-weight="700">O3：RS 输出 · M/S 元素</text>
      <text x="682.5" y="499" fill="#6b21a8" font-size="12">RS3 写入 → AR3 原地归约</text>

      <rect x="880" y="450" width="195" height="66" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <text x="977.5" y="476" fill="#166534" font-size="14" font-weight="700">各参数的梯度分片</text>
      <text x="977.5" y="499" fill="#166534" font-size="12">按需转 dtype，再切 view</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#dependency-arrow)">
      <path d="M218 485 H284"/>
      <path d="M499 485 H564"/>
      <path d="M799 485 H874"/>
    </g>
    <g fill="#475569" font-size="11" text-anchor="middle">
      <text x="251" y="471">copy-in</text>
      <text x="532" y="471">RS3</text>
      <text x="837" y="471">AR3 后</text>
    </g>
    <text x="44" y="542" fill="#92400e" font-size="13" font-weight="700">post L2 回收 I3 时，AR3 仍可使用 O3；L3 的 AllReduceState 持有 O3。</text>
    <text x="44" y="564" fill="#475569" font-size="12.5">无需转换且无累加 / 卸载时，最终 .grad 通过 view 共享 O3；无需再逐参数 copy-out。</text>
    <text x="44" y="584" fill="#64748b" font-size="12">Hook 框是提交位置；wait_event 设置 GPU 依赖，释放引用不表示立即归还显存或 CPU 阻塞等待。</text>

    <g transform="translate(0,210)">
    <!-- HyperParallel panel -->
    <rect x="24" y="400" width="1072" height="328" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="430" fill="#0f172a" font-size="17" font-weight="700">HyperParallel · Torch 默认 comm_fusion=False</text>
    <text x="44" y="452" fill="#64748b" font-size="13">各参数 RS 输出直写融合 buffer Bi 的 view；下一 Hook 释放 RS 输入，保留 Bi 交给 AR</text>
    <line x1="180" y1="464" x2="1072" y2="464" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
    <text x="1050" y="455" fill="#64748b" font-size="12">时间</text>

    <g fill="#475569" font-size="13" font-weight="600" text-anchor="end">
      <text x="164" y="510">反向计算 / Hook</text>
      <text x="164" y="568">shard 组 RS</text>
      <text x="164" y="626">replicate 组 AR</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="180" y="485" width="115" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="300" y="485" width="80" height="40" rx="7" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="385" y="485" width="140" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="530" y="485" width="95" height="40" rx="7" fill="#fff7ed" stroke="#fb923c"/>
      <rect x="630" y="485" width="140" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
      <rect x="775" y="485" width="95" height="40" rx="7" fill="#fff7ed" stroke="#fb923c"/>
      <rect x="950" y="480" width="125" height="50" rx="7" fill="#fee2e2" stroke="#f87171"/>

      <rect x="325" y="543" width="200" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="585" y="543" width="185" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="835" y="543" width="130" height="40" rx="7" fill="#dcfce7" stroke="#4ade80"/>

      <rect x="610" y="601" width="180" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
      <rect x="850" y="601" width="160" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
      <rect x="1010" y="601" width="65" height="40" rx="7" fill="#f3e8ff" stroke="#c084fc"/>
    </g>

    <g fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle">
      <text x="237.5" y="510">L3 backward</text>
      <text x="455" y="510">L2 backward</text>
      <text x="700" y="510">L1 backward</text>
    </g>
    <g fill="#334155" font-size="10.8" font-weight="700" text-anchor="middle">
      <text x="340" y="501">post L3</text><text x="340" y="517">发 RS3</text>
      <text x="577.5" y="497">post L2</text><text x="577.5" y="509">wait RS3</text><text x="577.5" y="521">发 RS2 / AR3</text>
      <text x="822.5" y="497">post L1</text><text x="822.5" y="509">wait RS2</text><text x="822.5" y="521">发 RS1 / AR2</text>
    </g>
    <g fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="1012.5" y="494">root callback</text><text x="1012.5" y="508">wait RS1；发 AR1</text><text x="1012.5" y="522">wait pending AR</text>
    </g>
    <g fill="#166534" font-size="13" font-weight="700" text-anchor="middle">
      <text x="425" y="568">逐参数 RS3 → B3</text>
      <text x="677.5" y="568">逐参数 RS2 → B2</text>
      <text x="900" y="568">逐参数 RS1</text>
    </g>
    <g fill="#6b21a8" font-size="13" font-weight="700" text-anchor="middle">
      <text x="700" y="626">融合 AR3：原地用 B3</text>
      <text x="930" y="626">融合 AR2：用 B2</text>
      <text x="1042.5" y="626">AR1</text>
    </g>

    <!-- Hyper dependencies -->
    <path d="M525 553 C543 539 548 531 559 523" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <text x="494" y="536" fill="#92400e" font-size="10.5">Work.wait(RS3)</text>
    <path d="M770 553 C788 539 793 531 804 523" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <text x="742" y="536" fill="#92400e" font-size="10.5">Work.wait(RS2)</text>
    <path d="M965 553 C980 539 989 531 998 523" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M587 527 C587 583 595 607 610 621" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
    <path d="M824 527 C824 583 835 607 850 621" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>

    <rect x="164" y="665" width="494" height="42" rx="7" fill="#fff7ed" stroke="#fdba74"/>
    <text x="180" y="682" fill="#92400e" font-size="12.5" font-weight="700">RS 输入回收</text>
    <text x="180" y="699" fill="#92400e" font-size="12.5">post L2：wait RS3 后释放各参数 _grad，不释放 B3</text>
    <rect x="672" y="665" width="404" height="42" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="688" y="682" fill="#1e3a8a" font-size="12.5" font-weight="700">AR 输出保留</text>
    <text x="688" y="699" fill="#1e3a8a" font-size="12.5">group 持有 B3；AR 后各参数结果 view 接续持有</text>

    <!-- Legend and conclusion -->
    <g font-size="12">
      <rect x="32" y="749" width="15" height="15" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="54" y="761" fill="#475569">反向计算</text>
      <rect x="132" y="749" width="15" height="15" rx="3" fill="#dcfce7" stroke="#4ade80"/>
      <text x="154" y="761" fill="#475569">Reduce-Scatter</text>
      <rect x="281" y="749" width="15" height="15" rx="3" fill="#f3e8ff" stroke="#c084fc"/>
      <text x="303" y="761" fill="#475569">All-Reduce</text>
      <line x1="406" y1="756" x2="438" y2="756" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#dependency-arrow)"/>
      <text x="447" y="761" fill="#475569">事件 / 数据依赖</text>
      <text x="1080" y="761" fill="#64748b" text-anchor="end">所有通信最终都必须在梯度交给优化器前完成</text>
    </g>

    <rect x="32" y="778" width="1056" height="50" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="48" y="798" fill="#334155" font-size="13"><tspan font-weight="700">关键区别：</tspan>PyTorch 在当前 Hook 用 stream dependency 排入 AR；Hyper 在下一 Hook 等前序 RS 后再发融合 AR。</text>
    <text x="48" y="819" fill="#475569" font-size="12.5">下一层反向不消费上一层的参数梯度归约结果；图中等待来自通信衔接与 buffer 生命周期管理。</text>
    </g>
  </g>
</svg>
