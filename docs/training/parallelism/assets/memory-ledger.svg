<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 14 800 137" role="img" aria-label="本文 Megatron BF16 加 Adam 账本中每参数 18 字节的构成">
  <style>
    [fill="#eaeefb"]{fill:#172033}[fill="#9aa3b2"]{fill:#5f6b7a}[fill="#cdd5ff"]{fill:#334a8a}[fill="#bbf7d0"]{fill:#166534}[fill="#86efac"]{fill:#15803d}[fill="#fde68a"]{fill:#92400e}
  </style>
  <text x="20" y="30" fill="#eaeefb" font-size="14" font-weight="600">每个参数的「模型状态」开销 = 18 字节</text>
  <!-- bar segments, total width 768 for 18 bytes => about 42.7/byte -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="20"  y="48" width="84"  height="46" rx="5" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="62"  y="70" fill="#cdd5ff">BF16 权重</text><text x="62"  y="86" fill="#9aa3b2">2B</text>
    <rect x="106" y="48" width="169" height="46" rx="5" fill="rgba(124,147,255,0.22)" stroke="#7c93ff"/><text x="190" y="70" fill="#cdd5ff">FP32 main_grad</text><text x="190" y="86" fill="#9aa3b2">4B</text>
    <rect x="277" y="48" width="169" height="46" rx="5" fill="rgba(74,222,128,0.16)" stroke="#4ade80"/><text x="361" y="70" fill="#bbf7d0">FP32 master 权重</text><text x="361" y="86" fill="#86efac">4B</text>
    <rect x="448" y="48" width="169" height="46" rx="5" fill="rgba(74,222,128,0.16)" stroke="#4ade80"/><text x="532" y="70" fill="#bbf7d0">Adam 一阶 m</text><text x="532" y="86" fill="#86efac">4B</text>
    <rect x="619" y="48" width="169" height="46" rx="5" fill="rgba(74,222,128,0.16)" stroke="#4ade80"/><text x="703" y="70" fill="#bbf7d0">Adam 二阶 v</text><text x="703" y="86" fill="#86efac">4B</text>
  </g>
  <path d="M20 100 L20 107 L275 107 L275 100" fill="none" stroke="#9aa3b2" stroke-width="1"/>
  <text x="147" y="122" text-anchor="middle" fill="#9aa3b2" font-size="12.5">参数 2B + FP32 main_grad 4B</text>
  <path d="M277 100 L277 107 L788 107 L788 100" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="532" y="122" text-anchor="middle" fill="#86efac" font-size="12.5">优化器状态 12B = master 4B + 一阶 m 4B + 二阶 v 4B</text>
  <text x="20" y="142" fill="#fbbf24" font-size="12">激活值不在此图内，单独占显存，且随 batch×seq 增长——长序列训练的另一大头。</text>
</svg>
