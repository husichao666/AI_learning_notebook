<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 478" role="img" aria-labelledby="title desc">
<title id="title">GPU1 在预热和排空阶段提前接收下一份数据</title>
<desc id="desc">上半图：预热时，在前向 F1 之前向 GPU0 发起激活2的接收，在 F1 期间接收，F1 结束后向 GPU2 发送激活1；确认激活2收齐后执行 F2。下半图：排空时，在反向 B7 之前向 GPU2 发起梯度8的接收，在 B7 期间接收，B7 结束后向 GPU0 发送 DX7；确认梯度8收齐后执行 B8。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="780" height="478" fill="#fff"/>
<g font-family="system-ui, sans-serif" fill="#334155">
<text x="20" y="27" font-size="17" fill="#334155" text-anchor="start" font-weight="600">① 预热 · 用前向计算覆盖激活接收</text>
<path d="M150 51 L738 51" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="746" y="56" font-size="12" fill="#334155" text-anchor="start">时间</text>
<path d="M270 64 L270 194" fill="none" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="275" y="77" font-size="12" fill="#64748b" text-anchor="start">收齐后继续</text>
<text x="20" y="113" font-size="14" fill="#334155" text-anchor="start" font-weight="600">GPU1 计算</text>
<rect x="140" y="91" width="130" height="30" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="205.0" y="112" font-size="14" fill="#334155" text-anchor="middle">F1</text>
<rect x="270" y="91" width="130" height="30" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="335.0" y="112" font-size="14" fill="#334155" text-anchor="middle">F2</text>
<text x="20" y="149" font-size="13" fill="#334155" text-anchor="start">提前接收</text>
<text x="20" y="165" font-size="12" fill="#64748b" text-anchor="start">GPU0 → GPU1</text>
<rect x="140" y="135" width="90" height="30" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="185.0" y="156" font-size="14" fill="#334155" text-anchor="middle">激活2</text>
<path d="M230 150 L270 150" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="20" y="193" font-size="13" fill="#334155" text-anchor="start">计算后发送</text>
<text x="20" y="209" font-size="12" fill="#64748b" text-anchor="start">GPU1 → GPU2</text>
<rect x="270" y="179" width="80" height="30" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="310.0" y="200" font-size="14" fill="#334155" text-anchor="middle">激活1</text>
<rect x="400" y="179" width="80" height="30" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="440.0" y="200" font-size="14" fill="#334155" text-anchor="middle">激活2</text>
<path d="M140 82 L140 172" fill="none" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="136" y="77" font-size="12" fill="#64748b" text-anchor="end">先挂接收</text>
<text x="470" y="111" font-size="13" fill="#64748b" text-anchor="start">F1 的输入此前已收齐</text>
<text x="470" y="135" font-size="13" fill="#64748b" text-anchor="start">F1 期间接收 F2 的输入</text>
<text x="20" y="251" font-size="17" fill="#334155" text-anchor="start" font-weight="600">② 排空 · 用反向计算覆盖梯度接收</text>
<path d="M150 275 L738 275" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="746" y="280" font-size="12" fill="#334155" text-anchor="start">时间</text>
<path d="M400 288 L400 418" fill="none" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="405" y="301" font-size="12" fill="#64748b" text-anchor="start">收齐后继续</text>
<text x="20" y="337" font-size="14" fill="#334155" text-anchor="start" font-weight="600">GPU1 计算</text>
<rect x="140" y="315" width="260" height="30" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="270.0" y="336" font-size="14" fill="#334155" text-anchor="middle">B7</text>
<rect x="400" y="315" width="260" height="30" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="530.0" y="336" font-size="14" fill="#334155" text-anchor="middle">B8</text>
<text x="20" y="373" font-size="13" fill="#334155" text-anchor="start">提前接收</text>
<text x="20" y="389" font-size="12" fill="#64748b" text-anchor="start">GPU2 → GPU1</text>
<rect x="140" y="359" width="90" height="30" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="185.0" y="380" font-size="14" fill="#334155" text-anchor="middle">梯度8</text>
<path d="M230 374 L400 374" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="20" y="417" font-size="13" fill="#334155" text-anchor="start">计算后发送</text>
<text x="20" y="433" font-size="12" fill="#64748b" text-anchor="start">GPU1 → GPU0</text>
<rect x="400" y="403" width="80" height="30" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="440.0" y="424" font-size="14" fill="#334155" text-anchor="middle">DX7</text>
<rect x="660" y="403" width="80" height="30" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<text x="700.0" y="424" font-size="14" fill="#334155" text-anchor="middle">DX8</text>
<path d="M140 306 L140 396" fill="none" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="136" y="301" font-size="12" fill="#64748b" text-anchor="end">先挂接收</text>
<text x="500" y="382" font-size="13" fill="#64748b" text-anchor="start">B7 的梯度此前已收齐</text>
<path d="M20 222 L760 222" fill="none" stroke="#94a3b8"/>
<text x="20" y="467" font-size="13" fill="#64748b" text-anchor="start">局部示意：其他预接收省略；若数据未收齐，就在检查点等待。</text>
</g></svg>
