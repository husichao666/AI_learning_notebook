<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-label="ZeRO 三阶段的每卡模型状态理想容量递减（N=8）">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <text x="20" y="26" fill="#eaeefb" font-size="15" font-weight="700">每卡模型状态理想账本（N=8，无 padding）</text>
  <!-- legend -->
  <rect x="352" y="15" width="15" height="14" fill="rgba(124,147,255,0.28)" stroke="#7c93ff"/><text x="373" y="27" fill="#9aa3b2" font-size="13">参数 2P</text>
  <rect x="452" y="15" width="15" height="14" fill="rgba(74,222,128,0.24)" stroke="#4ade80"/><text x="473" y="27" fill="#9aa3b2" font-size="13">FP32 梯度 4P</text>
  <rect x="600" y="15" width="15" height="14" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/><text x="621" y="27" fill="#9aa3b2" font-size="13">优化器状态 12P</text>
  <g font-size="14.5">
    <!-- DDP -->
    <text x="20" y="80" fill="#d7dbe4">DDP</text>
    <rect x="162" y="60" width="60"  height="30" fill="rgba(124,147,255,0.28)" stroke="#7c93ff"/>
    <rect x="222" y="60" width="120" height="30" fill="rgba(74,222,128,0.24)" stroke="#4ade80"/>
    <rect x="342" y="60" width="358" height="30" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/>
    <text x="710" y="80" fill="#9aa3b2">18P</text>
    <!-- ZeRO-1 -->
    <text x="20" y="138" fill="#d7dbe4">ZeRO-1</text>
    <rect x="162" y="118" width="60" height="30" fill="rgba(124,147,255,0.28)" stroke="#7c93ff"/>
    <rect x="222" y="118" width="120" height="30" fill="rgba(74,222,128,0.24)" stroke="#4ade80"/>
    <rect x="342" y="118" width="45" height="30" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/>
    <text x="397" y="138" fill="#9aa3b2">6P + 12P/8 = 7.5P</text>
    <!-- ZeRO-2 -->
    <text x="20" y="196" fill="#d7dbe4">ZeRO-2</text>
    <rect x="162" y="176" width="60" height="30" fill="rgba(124,147,255,0.28)" stroke="#7c93ff"/>
    <rect x="222" y="176" width="15" height="30" fill="rgba(74,222,128,0.24)" stroke="#4ade80"/>
    <rect x="237" y="176" width="45" height="30" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/>
    <text x="292" y="196" fill="#9aa3b2">2P + 16P/8 = 4P</text>
    <!-- ZeRO-3 / full-shard -->
    <text x="20" y="254" fill="#4ade80" font-weight="700">ZeRO-3 / full-shard</text>
    <rect x="162" y="234" width="8"  height="30" fill="rgba(124,147,255,0.28)" stroke="#7c93ff"/>
    <rect x="170" y="234" width="15" height="30" fill="rgba(74,222,128,0.24)" stroke="#4ade80"/>
    <rect x="185" y="234" width="45" height="30" fill="rgba(255,138,76,0.22)" stroke="#ff8a4c"/>
    <text x="240" y="254" fill="#86efac" font-weight="700">18P/8 = 2.25P（降到 1/8）</text>
  </g>
  <text x="20" y="300" fill="#4ade80" font-size="13.5">✅ ZeRO 逐阶段切分<tspan font-weight="700">模型状态</tspan>：理想容量可随分片组增大降到 1/N。</text>
  <text x="20" y="322" fill="#fbbf24" font-size="13.5">⚠️ 不直接切分<tspan font-weight="700">激活</tspan>：其每卡容量还由 local batch、SP/CP 与重计算策略决定。</text>
  <text x="20" y="344" fill="#9aa3b2" font-size="13.5">⚠️ ZeRO-3 还有一笔<tspan font-weight="700" fill="#cbd5e1">瞬时峰值</tspan>：及时 reshard 路径会物化当前 unit 的完整参数。</text>
</svg>
