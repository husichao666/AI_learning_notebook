<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 254" role="img" aria-labelledby="title desc">
<title id="title">Megatron 层内 MoE 前后向通信计算重叠窗口</title>
<desc id="desc">同一卡上，F 和 B 来自不同 micro-batch。反向 combine 与前向前置计算重叠；前向 dispatch 与反向专家计算重叠；反向 dispatch 与前向专家计算重叠；前向 combine 与反向前置计算重叠。各任务遵守本 micro-batch 内的数据依赖。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="780" height="254" fill="#fff"/>
<g font-family="system-ui, sans-serif" fill="#334155" font-size="14">
<text x="20" y="27" font-size="17" font-weight="600">同一卡 · 两个 micro-batch 的层内任务</text>
<rect x="545" y="14" width="15" height="15" rx="2" fill="#dfe7ff" stroke="#9aaad7"/>
<text x="567" y="27">F 前向</text><rect x="655" y="14" width="15" height="15" rx="2" fill="#d9eee3" stroke="#8db7a2"/>
<text x="677" y="27">B 反向</text>
<path d="M130 49 H744" fill="none" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="27" y="104">EP 通信</text><text x="27" y="175">本卡计算</text>
<g stroke="#e2e8f0" stroke-dasharray="3 4"><path d="M280 66 V206"/><path d="M438 66 V206"/><path d="M596 66 V206"/></g>
<rect x="130" y="73" width="142" height="48" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<rect x="288" y="73" width="142" height="48" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<rect x="446" y="73" width="142" height="48" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<rect x="604" y="73" width="142" height="48" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<rect x="130" y="143" width="142" height="55" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<rect x="288" y="143" width="142" height="55" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<rect x="446" y="143" width="142" height="55" rx="4" fill="#dfe7ff" stroke="#9aaad7"/>
<rect x="604" y="143" width="142" height="55" rx="4" fill="#d9eee3" stroke="#8db7a2"/>
<g text-anchor="middle">
<text x="201" y="94">B · combine</text><text x="201" y="112" font-size="12">反向 A2A</text>
<text x="359" y="94">F · dispatch</text><text x="359" y="112" font-size="12">前向 A2A</text>
<text x="517" y="94">B · dispatch</text><text x="517" y="112" font-size="12">反向 A2A</text>
<text x="675" y="94">F · combine</text><text x="675" y="112" font-size="12">前向 A2A</text>
<text x="201" y="166">F · 前置计算</text><text x="201" y="186" font-size="12">attention / router 等</text>
<text x="359" y="166">B · 专家计算</text><text x="359" y="186" font-size="12">含可调度的 DW</text>
<text x="517" y="166">F · 专家 MLP</text><text x="517" y="186" font-size="12">等待 F dispatch 就绪</text>
<text x="675" y="166">B · 前置部分反向</text><text x="675" y="186" font-size="12">attention 等</text>
</g>
<text x="20" y="233" font-size="13" fill="#64748b">各列表示可重叠窗口，非等长时间片；每一路仍须等待自身输入就绪。</text>
</g></svg>
