<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" role="img" aria-label="注意力两次矩阵乘：QKᵀ 得到 SxS 分数矩阵，再乘 V 得到输出">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa3b2"/></marker>
  </defs>
  <!-- Q -->
  <rect x="24" y="55" width="46" height="110" rx="6" fill="rgba(124,147,255,0.14)" stroke="#5b6bb0"/>
  <text x="47" y="112" text-anchor="middle" fill="#aab6ff" font-size="14" font-weight="700">Q</text>
  <text x="47" y="184" text-anchor="middle" fill="#9aa3b2" font-size="11">[S, d]</text>
  <text x="94" y="115" text-anchor="middle" fill="#d7dbe4" font-size="16">×</text>
  <!-- Kᵀ -->
  <rect x="112" y="88" width="110" height="46" rx="6" fill="rgba(124,147,255,0.14)" stroke="#5b6bb0"/>
  <text x="167" y="116" text-anchor="middle" fill="#aab6ff" font-size="14" font-weight="700">Kᵀ</text>
  <text x="167" y="152" text-anchor="middle" fill="#9aa3b2" font-size="11">[d, S]</text>
  <text x="242" y="115" text-anchor="middle" fill="#d7dbe4" font-size="16">=</text>
  <!-- P scores S×S -->
  <rect x="262" y="55" width="110" height="110" rx="6" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="317" y="104" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">P = QKᵀ</text>
  <text x="317" y="124" text-anchor="middle" fill="#9aa3b2" font-size="11">[S, S]</text>
  <text x="317" y="184" text-anchor="middle" fill="#fbbf24" font-size="10.5">← 逻辑上的全局交互</text>
  <!-- softmax arrow -->
  <path d="M378,110 L438,110" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="408" y="100" text-anchor="middle" fill="#86efac" font-size="10.5">softmax</text>
  <text x="408" y="126" text-anchor="middle" fill="#9aa3b2" font-size="9.5">逐行</text>
  <!-- P' -->
  <rect x="448" y="55" width="110" height="110" rx="6" fill="rgba(74,222,128,0.10)" stroke="#4ade80"/>
  <text x="503" y="114" text-anchor="middle" fill="#bbf7d0" font-size="12.5" font-weight="700">softmax(P)</text>
  <text x="503" y="184" text-anchor="middle" fill="#9aa3b2" font-size="11">[S, S]</text>
  <text x="580" y="115" text-anchor="middle" fill="#d7dbe4" font-size="16">×</text>
  <!-- V -->
  <rect x="600" y="55" width="46" height="110" rx="6" fill="rgba(124,147,255,0.14)" stroke="#5b6bb0"/>
  <text x="623" y="112" text-anchor="middle" fill="#aab6ff" font-size="14" font-weight="700">V</text>
  <text x="623" y="184" text-anchor="middle" fill="#9aa3b2" font-size="11">[S, d]</text>
  <text x="670" y="115" text-anchor="middle" fill="#d7dbe4" font-size="16">=</text>
  <!-- O -->
  <rect x="690" y="55" width="46" height="110" rx="6" fill="rgba(74,222,128,0.16)" stroke="#4ade80" stroke-width="1.6"/>
  <text x="713" y="112" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="700">O</text>
  <text x="713" y="184" text-anchor="middle" fill="#9aa3b2" font-size="11">[S, d]</text>
  <!-- compute note -->
  <rect x="756" y="55" width="82" height="110" rx="8" fill="rgba(255,255,255,0.02)" stroke="#262b3a"/>
  <text x="797" y="82" text-anchor="middle" fill="#9aa3b2" font-size="9.5">两次乘法</text>
  <text x="797" y="100" text-anchor="middle" fill="#d7dbe4" font-size="11" font-weight="700">O(S²·d)</text>
  <text x="797" y="126" text-anchor="middle" fill="#9aa3b2" font-size="9.5">朴素 P buffer</text>
  <text x="797" y="144" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">O(S²)</text>
</svg>
