<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" role="img" aria-label="矩阵乘法的行并行切分">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  [fill="#fca5a5"],[fill="#ffb0b0"]{fill:#991b1b}
  [fill="#c4b5fd"],[fill="#d8b4fe"]{fill:#6b21a8}
  [fill="#ffb380"],[fill="#ffd0ad"],[fill="#ffddc2"],[fill="#ff9c63"]{fill:#9a3412}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"],circle[fill="#161922"]{fill:#f8fafc}
  rect[fill="#293b91"],rect[fill="#3a56d4"],rect[fill="#17213b"],rect[fill="#26336b"],rect[fill="#18203a"],rect[fill="#1b2246"],rect[fill="#202a4c"],rect[fill="#1a2340"],rect[fill="#24377e"],rect[fill="#1b3650"]{fill:#e8edff}
  rect[fill="#12351f"],rect[fill="#1f7a4d"],rect[fill="#14251d"],rect[fill="#10251a"],rect[fill="#173d31"],rect[fill="#1e6443"],rect[fill="#20352f"]{fill:#dcfce7}
  rect[fill="#b9703f"],rect[fill="#251e18"],rect[fill="#402d21"],rect[fill="#8a5a2e"]{fill:#ffedd5}
  rect[fill="#6f57bd"],rect[fill="#211c28"],rect[fill="#2d2450"]{fill:#f3e8ff}
  rect[fill="#4b5563"],rect[fill="#42595a"]{fill:#e2e8f0}
  rect[fill="rgba(255,255,255,0.03)"],rect[fill="rgba(255,255,255,.025)"],rect[fill="rgba(255,255,255,0.02)"]{fill:rgba(15,23,42,.04)}
  stop[stop-color="#293b91"]{stop-color:#e0e7ff}
  stop[stop-color="#1f6f66"]{stop-color:#d1fae5}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"]{stroke:#cbd5e1}
</style>
  <defs><marker id="rarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">Row Parallel：每卡算同一输出的一份部分和</text>
  <g transform="translate(35,61)">
    <text x="120" y="-10" text-anchor="middle" fill="#9aa3b2" font-size="12">X 沿 K 维切</text>
    <rect x="0" y="0" width="120" height="120" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="120" y="0" width="120" height="120" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M30 0V120M60 0V120M90 0V120M150 0V120M180 0V120M210 0V120M0 30H240M0 60H240M0 90H240" stroke="#313747"/>
    <text x="60" y="67" text-anchor="middle" fill="#cdd5ff" font-size="17">X⁽⁰⁾</text>
    <text x="180" y="67" text-anchor="middle" fill="#ffd9a8" font-size="17">X⁽¹⁾</text>
  </g>
  <text x="296" y="130" fill="#9aa3b2" font-size="24">×</text>
  <g transform="translate(335,61)">
    <text x="60" y="-10" text-anchor="middle" fill="#9aa3b2" font-size="12">W 沿行切</text>
    <rect x="0" y="0" width="120" height="60" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="0" y="60" width="120" height="60" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M30 0V120M60 0V120M90 0V120M0 30H120M0 90H120" stroke="#313747"/>
    <text x="60" y="36" text-anchor="middle" fill="#cdd5ff" font-size="16">W⁽⁰⁾</text>
    <text x="60" y="96" text-anchor="middle" fill="#ffd9a8" font-size="16">W⁽¹⁾</text>
  </g>
  <line x1="470" y1="121" x2="515" y2="121" stroke="#64748b" stroke-width="2" marker-end="url(#rarr)"/>
  <g transform="translate(535,58)">
    <rect x="0" y="0" width="130" height="56" rx="7" fill="rgba(124,147,255,.15)" stroke="#7c93ff"/>
    <text x="65" y="24" text-anchor="middle" fill="#cdd5ff" font-size="13">GPU 0: Ỹ⁽⁰⁾</text>
    <text x="65" y="43" text-anchor="middle" fill="#9aa3b2" font-size="11">X⁽⁰⁾W⁽⁰⁾</text>
    <rect x="0" y="70" width="130" height="56" rx="7" fill="rgba(255,138,76,.12)" stroke="#ff8a4c"/>
    <text x="65" y="94" text-anchor="middle" fill="#ffd9a8" font-size="13">GPU 1: Ỹ⁽¹⁾</text>
    <text x="65" y="113" text-anchor="middle" fill="#9aa3b2" font-size="11">X⁽¹⁾W⁽¹⁾</text>
  </g>
  <line x1="665" y1="86" x2="704" y2="109" stroke="#64748b" marker-end="url(#rarr)"/>
  <line x1="665" y1="156" x2="704" y2="133" stroke="#64748b" marker-end="url(#rarr)"/>
  <rect x="715" y="92" width="155" height="60" rx="8" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
  <text x="792" y="116" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">all-reduce(sum)</text>
  <text x="792" y="137" text-anchor="middle" fill="#fff" font-size="12">Y = Ỹ⁽⁰⁾ + Ỹ⁽¹⁾</text>
  <text x="35" y="240" fill="#9aa3b2" font-size="12.5">颜色必须对齐：GPU 0 同时拿 X⁽⁰⁾ 与 W⁽⁰⁾；GPU 1 同时拿 X⁽¹⁾ 与 W⁽¹⁾。</text>
  <text x="35" y="264" fill="#fbbf24" font-size="12.5">通信原因：两个 rank 都只得到完整 Y 的部分和，不求和就不是正确输出。</text>
</svg>
