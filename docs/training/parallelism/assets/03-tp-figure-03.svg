<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="矩阵乘法的行并行切分">
<style>
  /* The book treats diagrams as daylight-mode figures in every site theme. */
  [fill="#fff"],[fill="#ffffff"],[fill="#eaeefb"],[fill="#d7dbe4"],[fill="#eaf0ff"],[fill="#e6ebff"]{fill:#172033}
  [fill="#9aa3b2"],[fill="#94a3b8"],[fill="#7c8499"]{fill:#5f6b7a}
  [fill="#cdd5ff"],[fill="#aab6ff"],[fill="#c7cff5"],[fill="#dbe4ff"],[fill="#8b95c9"]{fill:#334a8a}
  [fill="#bbf7d0"],[fill="#86efac"],[fill="#daffe9"],[fill="#eafff2"],[fill="#d8ffe6"]{fill:#166534}
  [fill="#fde68a"],[fill="#fbbf24"],[fill="#fcd34d"],[fill="#ffd9a8"],[fill="#ffcfaa"],[fill="#ffcf8a"]{fill:#92400e}
  rect[fill="#161922"],rect[fill="#1c2030"],rect[fill="#12151d"],rect[fill="#101320"],rect[fill="#141824"],rect[fill="#11151f"],rect[fill="#13161f"],rect[fill="#242938"],rect[fill="#20243a"]{fill:#f8fafc}
  rect[fill="rgba(255,255,255,.025)"]{fill:rgba(15,23,42,.04)}
  [stroke="#2f3650"],[stroke="#2a2f3e"],[stroke="#333a52"],[stroke="#313747"]{stroke:#cbd5e1}
</style>
  <defs>
    <marker id="rarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#eaeefb" font-size="16" font-weight="700">Row Parallel：沿同一个归约维 K 对齐切分</text>
  <text x="20" y="51" fill="#9aa3b2" font-size="12.5">示意尺寸：X 为 4×4，W 为 4×4，TP = 2</text>

  <!-- X: [M,K] = [X(0) X(1)]; each local shard is 4x2. -->
  <g transform="translate(25,91)">
    <text x="60" y="-12" text-anchor="middle" fill="#9aa3b2" font-size="12">X [M,K] · 沿 K 切</text>
    <rect x="0" y="0" width="60" height="120" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="60" y="0" width="60" height="120" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M30 0V120M90 0V120M0 30H120M0 60H120M0 90H120" stroke="#313747"/>
    <text x="30" y="65" text-anchor="middle" fill="#cdd5ff" font-size="15">X⁽⁰⁾</text>
    <text x="90" y="65" text-anchor="middle" fill="#ffd9a8" font-size="15">X⁽¹⁾</text>
    <text x="30" y="142" text-anchor="middle" fill="#7c93ff" font-size="11">4×2</text>
    <text x="90" y="142" text-anchor="middle" fill="#ff8a4c" font-size="11">4×2</text>
  </g>

  <text x="165" y="158" fill="#9aa3b2" font-size="24">×</text>

  <!-- W: [K,N] = [W(0); W(1)]; each local shard is 2x4. -->
  <g transform="translate(195,91)">
    <text x="60" y="-12" text-anchor="middle" fill="#9aa3b2" font-size="12">W [K,N] · 沿行切</text>
    <rect x="0" y="0" width="120" height="60" fill="rgba(124,147,255,.20)" stroke="#7c93ff"/>
    <rect x="0" y="60" width="120" height="60" fill="rgba(255,138,76,.16)" stroke="#ff8a4c"/>
    <path d="M30 0V120M60 0V120M90 0V120M0 30H120M0 90H120" stroke="#313747"/>
    <text x="60" y="36" text-anchor="middle" fill="#cdd5ff" font-size="15">W⁽⁰⁾ · 2×4</text>
    <text x="60" y="96" text-anchor="middle" fill="#ffd9a8" font-size="15">W⁽¹⁾ · 2×4</text>
  </g>

  <path d="M330 151H355V113H375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#rarr)"/>
  <path d="M355 151V247H375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#rarr)"/>
  <circle cx="355" cy="151" r="3" fill="#64748b"/>

  <!-- Each rank produces a complete-shaped 4x4 partial sum. -->
  <g transform="translate(385,63)">
    <text x="50" y="-10" text-anchor="middle" fill="#7c93ff" font-size="11.5">GPU 0：X⁽⁰⁾W⁽⁰⁾</text>
    <rect x="0" y="0" width="100" height="100" fill="rgba(124,147,255,.16)" stroke="#7c93ff"/>
    <path d="M25 0V100M50 0V100M75 0V100M0 25H100M0 50H100M0 75H100" stroke="#313747"/>
    <text x="50" y="55" text-anchor="middle" fill="#cdd5ff" font-size="16">Ỹ⁽⁰⁾</text>
    <text x="50" y="119" text-anchor="middle" fill="#9aa3b2" font-size="11">部分和 · 4×4</text>
  </g>
  <g transform="translate(385,197)">
    <text x="50" y="-10" text-anchor="middle" fill="#ff8a4c" font-size="11.5">GPU 1：X⁽¹⁾W⁽¹⁾</text>
    <rect x="0" y="0" width="100" height="100" fill="rgba(255,138,76,.13)" stroke="#ff8a4c"/>
    <path d="M25 0V100M50 0V100M75 0V100M0 25H100M0 50H100M0 75H100" stroke="#313747"/>
    <text x="50" y="55" text-anchor="middle" fill="#ffd9a8" font-size="16">Ỹ⁽¹⁾</text>
    <text x="50" y="119" text-anchor="middle" fill="#9aa3b2" font-size="11">部分和 · 4×4</text>
  </g>

  <line x1="485" y1="113" x2="540" y2="143" stroke="#64748b" marker-end="url(#rarr)"/>
  <line x1="485" y1="247" x2="540" y2="177" stroke="#64748b" marker-end="url(#rarr)"/>
  <rect x="550" y="126" width="135" height="68" rx="8" fill="rgba(251,191,36,.12)" stroke="#fbbf24"/>
  <text x="617" y="153" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">all-reduce(sum)</text>
  <text x="617" y="176" text-anchor="middle" fill="#9aa3b2" font-size="11.5">Ỹ⁽⁰⁾ + Ỹ⁽¹⁾</text>

  <line x1="685" y1="160" x2="735" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#rarr)"/>
  <g transform="translate(755,110)">
    <text x="50" y="-10" text-anchor="middle" fill="#166534" font-size="11.5">完整结果</text>
    <rect x="0" y="0" width="100" height="100" fill="rgba(74,222,128,.12)" stroke="#4ade80"/>
    <path d="M25 0V100M50 0V100M75 0V100M0 25H100M0 50H100M0 75H100" stroke="#313747"/>
    <text x="50" y="55" text-anchor="middle" fill="#bbf7d0" font-size="16">Y · 4×4</text>
  </g>

  <text x="25" y="346" fill="#5f6b7a" font-size="12.5">每个本地 GEMM 都满足 4×2 · 2×4 → 4×4；两张 4×4 只是完整 Y 的部分和。</text>
  <text x="550" y="224" fill="#92400e" font-size="11.5">逻辑上合成一个完整 Y；</text>
  <text x="550" y="242" fill="#92400e" font-size="11.5">collective 完成后各 rank 均得到该结果。</text>
</svg>
