<defs><marker id="group-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7c93ff"/></marker></defs>
<text x="390" y="30" fill="#eaeefb" font-size="17" font-weight="700" text-anchor="middle">同样 8 张 GPU，在 dense 与 sparse 区使用两套分组</text>
<text x="390" y="54" fill="#9aa3b2" font-size="12.5" text-anchor="middle">dense: TP2 × DP4 = 8　　sparse: EP4 × expert-DP2 = 8</text>

