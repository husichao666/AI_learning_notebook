<text x="325" y="442" text-anchor="middle" font-size="15" fill="#059669" font-weight="400">E2 / E3</text>
<rect x="430" y="400" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="495" y="422" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU2</text>
<text x="495" y="442" text-anchor="middle" font-size="15" fill="#d97706" font-weight="400">E4 / E5</text>
<rect x="600" y="400" width="130" height="49" rx="7" fill="#faf5ff" stroke="none"/>
<text x="665" y="422" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU3</text>
<text x="665" y="442" text-anchor="middle" font-size="15" fill="#9333ea" font-weight="400">E6 / E7</text>
<rect x="75" y="485" width="670" height="85" rx="9" fill="#f8fafc" stroke="#6ee7b7"/>
