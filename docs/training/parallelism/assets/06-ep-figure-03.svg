<rect x="90" y="510" width="130" height="49" rx="7" fill="#eef2ff" stroke="none"/>
<text x="155" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU4</text>
<text x="155" y="552" text-anchor="middle" font-size="15" fill="#4f46e5" font-weight="400">E0 / E1</text>
<rect x="260" y="510" width="130" height="49" rx="7" fill="#ecfdf5" stroke="none"/>
<text x="325" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU5</text>
<text x="325" y="552" text-anchor="middle" font-size="15" fill="#059669" font-weight="400">E2 / E3</text>
<rect x="430" y="510" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="495" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU6</text>
<text x="495" y="552" text-anchor="middle" font-size="15" fill="#d97706" font-weight="400">E4 / E5</text>
<rect x="600" y="510" width="130" height="49" rx="7" fill="#faf5ff" stroke="none"/>
<text x="665" y="532" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU7</text>
<text x="665" y="552" text-anchor="middle" font-size="15" fill="#9333ea" font-weight="400">E6 / E7</text>
<path d="M155 449V510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M325 449V510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M495 449V510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M665 449V510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="410" y="598" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">虚线：同专家副本之间的梯度同步</text>
</g></svg>
