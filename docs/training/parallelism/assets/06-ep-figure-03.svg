<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 615" role="img" aria-labelledby="title desc">
<title id="title">固定 GPU 顺序对照稠密区与专家区的进程组</title>
<desc id="desc">上下两图均为第一行 GPU0、GPU1、GPU2、GPU3，第二行 GPU4、GPU5、GPU6、GPU7。稠密区四个 TP 组分别是 0/1、2/3、4/5、6/7；专家区两个 EP 组分别是 0/1/2/3 和 4/5/6/7。同列 GPU 持有相同专家副本，沿 expert-DP 同步梯度。</desc>
<rect width="820" height="615" rx="12" fill="white"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="75" y="42" text-anchor="start" font-size="22" fill="#172033" font-weight="700">稠密区 · TP 2 × DP 4</text>
<rect x="75" y="70" width="330" height="90" rx="9" fill="#f8fafc" stroke="#a5b4fc"/>
<text x="240" y="92" text-anchor="middle" font-size="15" fill="#475569" font-weight="700">TP 组 0</text>
<rect x="415" y="70" width="330" height="90" rx="9" fill="#f8fafc" stroke="#a5b4fc"/>
<text x="580" y="92" text-anchor="middle" font-size="15" fill="#475569" font-weight="700">TP 组 1</text>
<rect x="90" y="101" width="130" height="49" rx="7" fill="#eef2ff" stroke="none"/>
<text x="155" y="122" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU0</text>
<text x="155" y="142" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="400">TP 分片 0</text>
<rect x="260" y="101" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="325" y="122" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU1</text>
<text x="325" y="142" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="400">TP 分片 1</text>
<rect x="430" y="101" width="130" height="49" rx="7" fill="#eef2ff" stroke="none"/>
<text x="495" y="122" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU2</text>
<text x="495" y="142" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="400">TP 分片 0</text>
<rect x="600" y="101" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="665" y="122" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU3</text>
<text x="665" y="142" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="400">TP 分片 1</text>
<rect x="75" y="180" width="330" height="90" rx="9" fill="#f8fafc" stroke="#a5b4fc"/>
<text x="240" y="202" text-anchor="middle" font-size="15" fill="#475569" font-weight="700">TP 组 2</text>
<rect x="415" y="180" width="330" height="90" rx="9" fill="#f8fafc" stroke="#a5b4fc"/>
<text x="580" y="202" text-anchor="middle" font-size="15" fill="#475569" font-weight="700">TP 组 3</text>
<rect x="90" y="211" width="130" height="49" rx="7" fill="#eef2ff" stroke="none"/>
<text x="155" y="232" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU4</text>
<text x="155" y="252" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="400">TP 分片 0</text>
<rect x="260" y="211" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="325" y="232" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU5</text>
<text x="325" y="252" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="400">TP 分片 1</text>
<rect x="430" y="211" width="130" height="49" rx="7" fill="#eef2ff" stroke="none"/>
<text x="495" y="232" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU6</text>
<text x="495" y="252" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="400">TP 分片 0</text>
<rect x="600" y="211" width="130" height="49" rx="7" fill="#fff7ed" stroke="none"/>
<text x="665" y="232" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU7</text>
<text x="665" y="252" text-anchor="middle" font-size="14" fill="#c2410c" font-weight="400">TP 分片 1</text>
<text x="410" y="308" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">4 个 TP 组对应 4 份 DP 副本</text>
<text x="75" y="356" text-anchor="start" font-size="22" fill="#172033" font-weight="700">专家区 · EP 4 × expert-DP 2</text>
