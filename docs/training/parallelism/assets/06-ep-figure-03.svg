<text x="112" y="461" fill="#9aa3b2" font-size="11.5" text-anchor="middle">expert-DP 同步</text>

<text x="390" y="580" fill="#9aa3b2" font-size="12.5" text-anchor="middle">GPU0/1 在 dense 区共同切一份权重；在 sparse 区则分别持有不同专家。</text>
