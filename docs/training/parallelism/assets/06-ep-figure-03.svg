<text x="155" y="422" text-anchor="middle" font-size="19" fill="#172033" font-weight="700">GPU0</text>
<text x="155" y="442" text-anchor="middle" font-size="15" fill="#4f46e5" font-weight="400">E0 / E1</text>
<rect x="260" y="400" width="130" height="49" rx="7" fill="#ecfdf5" stroke="none"/>
