[project]
site_name = "AI Learning Notebook"
site_description = "大模型架构、核心模块、训练系统与性能工程个人知识库"
site_url = "https://husichao666.github.io/AI_learning_notebook/"
repo_url = "https://github.com/husichao666/AI_learning_notebook"
repo_name = "husichao666/AI_learning_notebook"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "首页" = "index.md" },
  { "模型架构" = [
    { "领域总览" = "models/index.md" },
    { "Qwen3.5" = "models/qwen3-5/index.md" },
    { "DeepSeek V4" = "models/deepseek-v4/index.md" },
  ] },
  { "核心模块" = [
    { "领域总览" = "components/index.md" },
    { "注意力机制" = [
      { "模块总览" = "components/attention/index.md" },
      { "DeepSeek Sparse Attention" = "components/attention/dsa/index.md" },
      { "Gated Attention" = "components/attention/gated-attention/index.md" },
    ] },
    { "位置编码" = [
      { "模块总览" = "components/position-encoding/index.md" },
      { "RoPE 与 M-RoPE" = "components/position-encoding/rope/index.md" },
    ] },
    { "可扩展记忆" = [
      { "模块总览" = "components/memory/index.md" },
      { "Engram" = "components/memory/engram/index.md" },
    ] },
  ] },
  { "训练系统" = [
    { "领域总览" = "training/index.md" },
    { "并行训练" = [
      { "手册总览" = "training/parallelism/index.md" },
      { "M0 · 基础铺垫" = "training/parallelism/00-foundations.md" },
      { "M1 · 数据并行 DP" = "training/parallelism/01-dp.md" },
      { "M2 · FSDP / ZeRO" = "training/parallelism/02-fsdp.md" },
      { "M3 · 张量并行 TP + SP" = "training/parallelism/03-tp.md" },
      { "M4 · 流水线并行 PP" = "training/parallelism/04-pp.md" },
      { "M5 · 上下文并行 CP" = "training/parallelism/05-cp.md" },
      { "M6-1 · EP 原理" = "training/parallelism/06-ep.md" },
      { "M6-2 · EP 源码" = "training/parallelism/06-ep-source.md" },
      { "M6-3 · EP 性能优化" = "training/parallelism/06-ep-performance.md" },
      { "M7 · nD 组合并行" = "training/parallelism/07-nd.md" },
      { "专题 · Loss Parallel" = "training/parallelism/loss-parallel.md" },
      { "专题 · MoE aux loss" = "training/parallelism/moe-aux-loss.md" },
    ] },
  ] },
  { "性能工程" = [
    { "领域总览" = "engineering/index.md" },
    { "训练性能采集与分析" = "engineering/training-performance.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "navigation.path",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "light green"
toggle.icon = "lucide/sun"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "切换到深色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
