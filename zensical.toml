[project]
site_name = "AI Learning Notebook"
site_description = "大模型架构、核心模块、训练系统与性能工程个人知识库"
site_url = "https://husichao666.github.io/AI_learning_notebook/"
repo_url = "https://github.com/husichao666/AI_learning_notebook"
repo_name = "husichao666/AI_learning_notebook"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "首页" = "index.md" },
  { "模型架构" = [
    { "领域总览" = "models/index.md" },
    { "Qwen3.5" = "models/qwen3-5/index.md" },
    { "DeepSeek V4" = "models/deepseek-v4/index.md" },
  ] },
  { "核心模块" = [
    { "领域总览" = "components/index.md" },
    { "注意力机制" = [
      { "模块总览" = "components/attention/index.md" },
      { "DeepSeek Sparse Attention" = "components/attention/dsa/index.md" },
      { "Gated Attention" = "components/attention/gated-attention/index.md" },
    ] },
    { "位置编码" = [
      { "模块总览" = "components/position-encoding/index.md" },
      { "RoPE 与 M-RoPE" = "components/position-encoding/rope/index.md" },
    ] },
    { "可扩展记忆" = [
      { "模块总览" = "components/memory/index.md" },
      { "Engram" = "components/memory/engram/index.md" },
    ] },
  ] },
  { "训练系统" = [
    { "领域总览" = "training/index.md" },
    { "并行训练" = [
      { "全书总览" = "training/parallelism/index.md" },
      { "第 1 章 · 训练状态与集合通信" = "training/parallelism/00-foundations.md" },
      { "第 2 章 · Data Parallel" = "training/parallelism/01-dp.md" },
      { "第 3 章 · 模型状态分片" = [
        { "3.1 · ZeRO 与 FSDP" = "training/parallelism/02-fsdp.md" },
        { "3.2 · 通信开销基础" = "training/parallelism/02-communication-cost.md" },
        { "3.3 · Megatron 实现方案" = "training/parallelism/02-megatron-fsdp.md" },
        { "3.4 · PyTorch 原生方案" = "training/parallelism/02-pytorch-fsdp.md" },
        { "3.5 · HyperParallel 性能优化" = "training/parallelism/02-hyper-fsdp.md" },
      ] },
      { "第 4 章 · Tensor Parallel 与 Sequence Parallel" = [
        { "4.1 · Tensor Parallel" = "training/parallelism/03-tp.md" },
        { "4.2 · Sequence Parallel" = "training/parallelism/03-sp.md" },
        { "4.3 · Loss Parallel" = "training/parallelism/loss-parallel.md" },
      ] },
      { "第 5 章 · Pipeline Parallel" = "training/parallelism/04-pp.md" },
      { "第 6 章 · Context Parallel" = "training/parallelism/05-cp.md" },
      { "第 7 章 · Expert Parallel" = [
        { "7.1 · 原理" = "training/parallelism/06-ep.md" },
        { "7.2 · Megatron 实现" = "training/parallelism/06-ep-source.md" },
        { "7.3 · 性能优化" = "training/parallelism/06-ep-performance.md" },
        { "7.4 · MoE 辅助损失" = "training/parallelism/moe-aux-loss.md" },
      ] },
      { "第 8 章 · 多维组合并行" = "training/parallelism/07-nd.md" },
    ] },
  ] },
  { "TorchTitan" = [
    { "专题总览" = "torchtitan/index.md" },
    { "共用基础" = [
      { "第 1 章 · DTensor 原理与使用" = "torchtitan/01-dtensor.md" },
      { "第 2 章 · DeviceMesh 与 Placement" = "torchtitan/02-device-mesh-placement.md" },
    ] },
    { "partial_dtensor 路线" = [
      { "第 3 章 · 分布式算子与分片传播" = "torchtitan/03-distributed-operators.md" },
      { "第 4 章 · 使用 ColwiseParallel 切分模型" = "torchtitan/04-colwise-parallel.md" },
    ] },
    { "spmd_types 路线" = [
      { "第 5 章 · ShardingConfig 与 spmd_types" = "torchtitan/05-sharding-config-spmd-types.md" },
    ] },
    { "独立源码分析 · GraphTrainer" = "torchtitan/graph-trainer.md" },
  ] },
  { "性能工程" = [
    { "领域总览" = "engineering/index.md" },
    { "GPU 性能基础" = [
      { "专题总览" = "engineering/gpu-basics/index.md" },
      { "1 · GPU 里面有什么" = "engineering/gpu-basics/01-architecture.md" },
      { "2 · 一次计算消耗什么" = "engineering/gpu-basics/02-compute.md" },
      { "3 · 一次拷贝消耗什么" = "engineering/gpu-basics/03-copy.md" },
      { "4 · 一次通信消耗什么" = "engineering/gpu-basics/04-communication.md" },
      { "5 · 异步与 overlap" = "engineering/gpu-basics/05-concurrency.md" },
      { "6 · 怎样观察这些开销" = "engineering/gpu-basics/06-profiling.md" },
    ] },
    { "训练性能采集与分析" = "engineering/training-performance.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "navigation.path",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "light green"
toggle.icon = "lucide/sun"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "切换到深色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
